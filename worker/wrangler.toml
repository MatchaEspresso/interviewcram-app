# Deploy from this folder: npx wrangler deploy
# Secrets (asked for interactively, never stored in the repo):
#   npx wrangler secret put OPENROUTER_API_KEY
#   npx wrangler secret put APP_TOKEN        # the access code you type into the app once
name = "interviewcram-chat"
main = "worker.js"
compatibility_date = "2026-09-01"

[vars]
# Comma-separated, tried in order; the first 3 that exist on OpenRouter are sent.
# Keep these to DeepSeek, GLM (z-ai), Kimi (moonshotai) and Qwen: the OpenRouter key only allows those.
# These are paid (roughly $0.0001-0.001 per question) and need OpenRouter credits.
MODELS = "deepseek/deepseek-v4.1-flash,z-ai/glm-5.3-flash,moonshotai/kimi-k2.6,qwen/qwen3.6-35b-a3b,deepseek/deepseek-v4-flash,z-ai/glm-5.2"
ALLOWED_ORIGINS = "https://matchaespresso.github.io"
