 2]]) == 2\nassert min_cost_supply_water(2, [1, 10], [[1, 2, 100]]) == 11\nassert min_cost_supply_water(2, [100, 100], [[1, 2, 1]]) == 101\nassert min_cost_supply_water(1, [7], []) == 7\nassert min_cost_supply_water(2, [5, 1], [[1, 2, 1]]) == 2","setup":"","unit":"mst"},"mst-run-ow-why":{"id":"mst-run-ow-why","type":"mcq","prompt":"Why does the virtual node make this a plain MST?","code":"","options":["A well becomes just another edge, so *connect everything to water* = span all `n + 1` nodes","It removes cycles","It makes the graph directed","It sorts the wells"],"mono":false,"explain":"Without it, nodes have costs and edges have costs: two kinds of choice. With it, everything is an edge and Kruskal handles it.","run":"","unit":"mst"},"mst-run-ow-cloze":{"id":"mst-run-ow-cloze","type":"cloze","prompt":"Turn each well into an edge.","code":"def min_cost_supply_water(n, wells, pipes):\n    edges = [___ for i, c in enumerate(wells)]\n    edges += [(c, a, b) for a, b, c in pipes]\n    parent = list(range(n + 1))\n\n    def find(x):\n        while parent[x] != x:\n            parent[x] = parent[parent[x]]\n            x = parent[x]\n        return x\n\n    total = 0\n    for c, a, b in sorted(edges):\n        ra, rb = find(a), find(b)\n        if ra != rb:\n            parent[ra] = rb\n            total += c\n    return total","options":["(c, 0, i + 1)","(c, 0, i)","(c, i, i + 1)"],"mono":true,"explain":"Houses are labelled `1..n` and `enumerate` starts at 0, so house `i + 1` connects to the source, node 0.","tests":"assert min_cost_supply_water(3, [1, 2, 2], [[1, 2, 1], [2, 3, 1]]) == 3\nassert min_cost_supply_water(2, [1, 1], [[1, 2, 1], [1, 2, 2]]) == 2\nassert min_cost_supply_water(2, [1, 10], [[1, 2, 100]]) == 11\nassert min_cost_supply_water(2, [100, 100], [[1, 2, 1]]) == 101\nassert min_cost_supply_water(1, [7], []) == 7\nassert min_cost_supply_water(2, [5, 1], [[1, 2, 1]]) == 2","setup":"","unit":"mst"},"mst-run-ow-order":{"id":"mst-run-ow-order","type":"order","prompt":"Build the edge list and parent array.","lines":["def build(n, wells, pipes):","    edges = [(c, 0, i + 1) for i, c in enumerate(wells)]","    edges += [(c, a, b) for a, b, c in pipes]","    parent = list(range(n + 1))","    return sorted(edges), parent"],"distractors":["    parent = list(range(n))","    edges += pipes"],"explain":"Well edges from node 0, pipes re-ordered to `(cost, a, b)` so `sorted` uses cost, and `n + 1` slots for nodes `0..n`.","tests":"e, p = build(2, [5, 3], [[1, 2, 1]])\nassert e == [(1, 1, 2), (3, 0, 2), (5, 0, 1)] and p == [0, 1, 2]","setup":"","unit":"mst"},"mst-run-ow-pred":{"id":"mst-run-ow-pred","type":"predict","prompt":"What does the last line evaluate to?","code":"def min_cost_supply_water(n, wells, pipes):\n    edges = [(c, 0, i + 1) for i, c in enumerate(wells)]\n    edges += [(c, a, b) for a, b, c in pipes]\n    parent = list(range(n + 1))\n\n    def find(x):\n        while parent[x] != x:\n            parent[x] = parent[parent[x]]\n            x = parent[x]\n        return x\n\n    total = 0\n    for c, a, b in sorted(edges):\n        ra, rb = find(a), find(b)\n        if ra != rb:\n            parent[ra] = rb\n            total += c\n    return total","expr":"min_cost_supply_water(3, [1, 2, 2], [[1, 2, 1], [2, 3, 1]])","options":["3","5","2","4"],"mono":true,"explain":"Pipes 1-2 and 2-3 (cost 1 each), then the well at house 1 (cost 1). Every house reaches node 0.","unit":"mst"}},"comingSoon":[]};</script>
<script>
(function () {
  'use strict';

  const C = window.IC_CONTENT;
  const CARDS = C.cards;
  const KEY = 'interviewcram.v1';
  const INTERVALS = [0, 1, 3, 7, 16, 35]; // days until the next review, by memory box
  const root = document.getElementById('app');

  // ------------------------------------------------------------ icons
  const svg = (body, extra = '') =>
    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${extra}>${body}</svg>`;
  const I = {
    flame: svg('<path d="M12 22c4.4 0 7-2.9 7-6.6 0-3.9-2.7-6.2-4.6-9.4-.4 2.1-1.4 3.4-2.8 4.1C11.5 7.2 10.4 4.3 8.2 2c.3 3.9-3.2 6.6-3.2 11.1C5 18.6 7.6 22 12 22z"/>'),
    bolt: svg('<path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"/>'),
    path: svg('<path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5h4v5"/>'),
    review: svg('<path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/>'),
    book: svg('<path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H11v17H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M20 4.5A1.5 1.5 0 0 0 18.5 3H13v17h5.5a1.5 1.5 0 0 0 1.5-1.5z"/>'),
    me: svg('<circle cx="12" cy="8" r="4"/><path d="M4 21c1.3-4 4.3-6 8-6s6.7 2 8 6"/>'),
    lock: svg('<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>'),
    check: svg('<path d="m5 12.5 4.5 4.5L19 7.5"/>', 'stroke-width="3"'),
    x: svg('<path d="M6 6l12 12M18 6 6 18"/>', 'stroke-width="3"'),
    close: svg('<path d="M6 6l12 12M18 6 6 18"/>'),
    clock: svg('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),
    spot: svg('<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>'),
    template: svg('<path d="m8 6-6 6 6 6M16 6l6 6-6 6"/>'),
    variants: svg('<circle cx="6" cy="5" r="2.2"/><circle cx="6" cy="19" r="2.2"/><circle cx="18" cy="7" r="2.2"/><path d="M6 7.2v9.6M18 9.2c0 5-6 3.5-11 7.8"/>'),
    moves: svg('<path d="m15 4 1.4 3.6L20 9l-3.6 1.4L15 14l-1.4-3.6L10 9l3.6-1.4z"/><path d="M4 20l7-7"/>'),
    problems: svg('<path d="M9 3h6v3a2 2 0 1 0 0 4v3h3a2 2 0 1 1 4 0"/><path d="M3 9h3a2 2 0 1 1 4 0h3v12H3z"/>'),
    legendary: svg('<path d="m3 8 4.5 4L12 5l4.5 7L21 8l-2 11H5z"/>'),
    teach: svg('<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/>'),
    back: svg('<path d="M15 5l-7 7 7 7"/>'),
    chat: svg('<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.6A8 8 0 1 1 21 12z"/><path d="M8.5 10.5h7M8.5 13.5h4"/>'),
    send: svg('<path d="M5 12h13M13 6l6 6-6 6"/>', 'stroke-width="2.6"'),
    trophy: svg('<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4"/>'),
  };

  // ------------------------------------------------------------ text helpers
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function inline(s) {
    // pull code spans out first so * and ** inside code are left alone
    const codes = [];
    const t = esc(String(s).replace(/`([^`]*)`/g, (_, c) => { codes.push(c); return `\u0000${codes.length - 1}\u0000`; }))
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[^*\w])\*(?=\S)(.+?)\*(?!\w)/g, '$1<em>$2</em>');
    return t.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${esc(codes[i])}</code>`);
  }

  function rich(text) {
    // blank lines split blocks; inside a block, runs of "- " or "1. " lines become lists
    const out = [];
    for (const block of String(text).split(/\n\s*\n/)) {
      let para = [], list = null;
      const flushPara = () => { if (para.length) out.push(`<p>${para.map(inline).join(' ')}</p>`); para = []; };
      const flushList = () => { if (list) out.push(`<${list.tag}>${list.items.map((li) => `<li>${inline(li)}</li>`).join('')}</${list.tag}>`); list = null; };
      for (const raw of block.split('\n')) {
        const l = raw.trim();
        if (!l) continue;
        const m = l.match(/^(- |\d+\.\s)(.*)$/);
        if (m) {
          const tag = m[1] === '- ' ? 'ul' : 'ol';
          flushPara();
          if (!list || list.tag !== tag) { flushList(); list = { tag, items: [] }; }
          list.items.push(m[2]);
        } else {
          flushList();
          para.push(l);
        }
      }
      flushPara();
      flushList();
    }
    return out.join('');
  }

  const KW = new Set('def return if elif else while for in not and or is None True False class import from as lambda yield pass break continue with try except finally raise global nonlocal del assert'.split(' '));
  const BI = new Set('len range min max sum sorted enumerate zip list dict set tuple int str float abs map filter any all print bisect_left bisect_right insort heappush heappop heapify deque defaultdict Counter divmod ord chr reversed isinstance self cache math'.split(' '));

  /** Highlight Python. `blank` (html) replaces the `___` token when given. */
  function hl(code, blank) {
    const re = /(#[^\n]*)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')|(\b\d+(?:\.\d+)?\b)|(\w+)|(\s+)|([\s\S])/g;
    let out = '', prev = '', m;
    while ((m = re.exec(code))) {
      if (m[1]) { out += `<span class="t-com">${esc(m[1])}</span>`; prev = ''; }
      else if (m[2]) { out += `<span class="t-str">${esc(m[2])}</span>`; prev = ''; }
      else if (m[3]) { out += `<span class="t-num">${m[3]}</span>`; prev = ''; }
      else if (m[4]) {
        const w = m[4];
        if (w === '___' && blank !== undefined) out += blank;
        else if (KW.has(w)) out += `<span class="t-kw">${w}</span>`;
        else if (prev === 'def' || prev === 'class') out += `<span class="t-fn">${w}</span>`;
        else if (BI.has(w)) out += `<span class="t-bi">${w}</span>`;
        else out += esc(w);
        prev = w;
      }
      else if (m[5]) out += m[5];
      else { out += esc(m[6]); prev = ''; }
    }
    return out;
  }

  const codeBlock = (code, blank) => `<pre class="code">${hl(code, blank)}</pre>`;

  function shuffle(a) {
    a = a.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // ------------------------------------------------------------ dates
  const dayStr = (d = new Date()) =>
    `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const addDays = (s, n) => { const [y, m, d] = s.split('-').map(Number); return dayStr(new Date(y, m - 1, d + n)); };
  const today = () => dayStr();

  // ------------------------------------------------------------ state
  const fresh = () => ({
    v: 1, xp: 0, goal: 30,
    streak: { count: 0, last: null, best: 0 },
    daily: { day: null, xp: 0 },
    history: {}, lessons: {}, cards: {}, active: null, last: null,
  });

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) return Object.assign(fresh(), JSON.parse(raw));
    } catch (e) { /* storage blocked: run without persistence */ }
    return fresh();
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* ignore */ }
  }

  let S = load();
  const ui = { tab: 'path', screen: 'tabs', topic: null, guide: C.units[0].id, msg: null, resetArmed: false };

  function streakNow() {
    const t = today();
    return S.streak.last === t || S.streak.last === addDays(t, -1) ? S.streak.count : 0;
  }
  function dailyXP() { return S.daily.day === today() ? S.daily.xp : 0; }

  function awardXP(n) {
    const t = today();
    if (S.daily.day !== t) S.daily = { day: t, xp: 0 };
    S.daily.xp += n;
    S.xp += n;
    S.history[t] = (S.history[t] || 0) + n;
  }
  function bumpStreak() {
    const t = today();
    if (S.streak.last === t) return;
    S.streak.count = S.streak.last === addDays(t, -1) ? S.streak.count + 1 : 1;
    S.streak.last = t;
    S.streak.best = Math.max(S.streak.best, S.streak.count);
  }

  // spaced repetition: right → next box, wrong → back to box 0 (due today)
  function grade(id, ok) {
    const c = S.cards[id] || (S.cards[id] = { box: 0, due: null, right: 0, wrong: 0 });
    if (ok) { c.box = Math.min(c.box + 1, INTERVALS.length - 1); c.right++; }
    else { c.box = 0; c.wrong++; }
    c.due = addDays(today(), INTERVALS[c.box]);
    c.last = ok;
  }
  const dueCards = () => {
    const t = today();
    return Object.keys(S.cards).filter((id) => CARDS[id] && S.cards[id].due <= t)
      .sort((a, b) => (S.cards[a].due < S.cards[b].due ? -1 : 1));
  };
  const mistakeCards = () => Object.keys(S.cards).filter((id) => CARDS[id] && S.cards[id].last === false);

  // ------------------------------------------------------------ content lookups
  const LESSONS = {};
  for (const unit of C.units) {
    for (const level of unit.levels) {
      for (const lesson of level.lessons) LESSONS[lesson.id] = { lesson, level, unit };
    }
  }
  const unitById = (id) => C.units.find((u) => u.id === id);
  const lessonDone = (id) => (S.lessons[id] && S.lessons[id].done) || 0;
  const unitCardIds = (unit) => Object.keys(CARDS).filter((id) => CARDS[id].unit === unit.id && CARDS[id].type !== 'teach');

  // ------------------------------------------------------------ sessions
  function begin(session) {
    S.active = Object.assign({ pos: 0, done: [], first: {}, wrong: 0 }, session, { total: new Set(session.queue).size });
    ui.screen = 'lesson';
    resetCard();
    save();
    render();
  }

  function startLesson(lessonId) {
    const { lesson, level, unit } = LESSONS[lessonId];
    if (lesson.sample) {
      const pool = shuffle(unitCardIds(unit));
      // weak cards first, then the rest
      pool.sort((a, b) => ((S.cards[a] || { box: 0 }).box) - ((S.cards[b] || { box: 0 }).box));
      begin({ mode: 'legendary', lessonId, unit: unit.id, back: unit.id, title: `${unit.title}: ${lesson.title}`,
        queue: shuffle(pool.slice(0, lesson.sample)), seconds: lesson.seconds || 40 });
    } else {
      begin({ mode: 'lesson', lessonId, unit: unit.id, back: unit.id, title: `${unit.title}: ${lesson.title}`, queue: lesson.cards.slice() });
    }
  }

  function startMix(unitIds) {
    const pool = shuffle(C.units.filter((u) => unitIds.includes(u.id)).flatMap(unitCardIds));
    // weakest (unseen counts as weak) first, then pick 8 and shuffle them
    pool.sort((a, b) => ((S.cards[a] || { box: -1 }).box) - ((S.cards[b] || { box: -1 }).box));
    const queue = shuffle(pool.slice(0, 8));
    begin({ mode: 'mix', title: 'Quick mix', unit: CARDS[queue[0]].unit, queue, back: unitIds.length === 1 ? unitIds[0] : null });
  }

  function startReview(ids, title) {
    if (!ids.length) return;
    begin({ mode: 'review', title, unit: CARDS[ids[0]].unit, queue: shuffle(ids).slice(0, 12) });
  }

  const current = () => S.active && CARDS[S.active.queue[S.active.pos]];

  function resetCard() {
    ui.sel = null;
    ui.built = [];
    ui.verdict = null;
    ui.perm = null;
    ui.pool = null;
    ui.deadline = S.active && S.active.mode === 'legendary' ? Date.now() + S.active.seconds * 1000 : null;
  }

  function ready(card) {
    if (card.type === 'order') return ui.built.length === card.lines.length;
    return ui.sel !== null;
  }

  function isCorrect(card) {
    switch (card.type) {
      case 'mcq': case 'predict': case 'cloze': return ui.sel === 0;
      case 'order': return ui.built.length === card.lines.length && ui.built.every((v, k) => v === k);
      case 'bug': return ui.sel === card.line;
      case 'compare': return ui.sel === card.answer;
      default: return true;
    }
  }

  function check(timedOut) {
    const card = current();
    const a = S.active;
    const ok = !timedOut && isCorrect(card);
    ui.verdict = ok ? 'good' : 'bad';
    ui.timedOut = !!timedOut;
    if (!(card.id in a.first)) {
      a.first[card.id] = ok;
      grade(card.id, ok);
    }
    if (ok) {
      if (!a.done.includes(card.id)) a.done.push(card.id);
    } else {
      a.wrong++;
      if (a.mode === 'legendary') { if (!a.done.includes(card.id)) a.done.push(card.id); }
      else a.queue.push(card.id); // ask again at the end, Duolingo-style
    }
    save();
    render();
  }

  function next() {
    const a = S.active;
    const card = current();
    if (card.type === 'teach' && !a.done.includes(card.id)) a.done.push(card.id);
    a.pos++;
    if (a.pos >= a.queue.length) return finish();
    resetCard();
    save();
    render();
    const body = root.querySelector('.lesson-body');
    if (body) body.scrollTop = 0;
  }

  function finish() {
    const a = S.active;
    const graded = Object.values(a.first);
    const right = graded.filter(Boolean).length;
    const acc = graded.length ? Math.round((100 * right) / graded.length) : 100;
    let xp = 10, passed = true;
    if (a.mode === 'lesson') xp = a.wrong === 0 ? 15 : 10;
    if (a.mode === 'legendary') { passed = acc >= 80; xp = passed ? 25 : 5; }
    if (a.lessonId && passed) {
      const rec = S.lessons[a.lessonId] || { done: 0, best: 0 };
      rec.done++;
      rec.best = Math.max(rec.best, acc);
      S.lessons[a.lessonId] = rec;
    }
    awardXP(xp);
    bumpStreak();
    const missed = Object.keys(a.first).filter((id) => !a.first[id]);
    S.last = { mode: a.mode, title: a.title, xp, acc, passed, missed, streak: S.streak.count, back: a.back || null };
    S.active = null;
    ui.screen = 'done';
    save();
    render();
  }

  // ------------------------------------------------------------ views: shared
  function topbar() {
    const st = streakNow();
    const doneToday = S.streak.last === today();
    return `<header class="topbar">
      <div class="brand">Interview<span>Cram</span></div>
      <span class="chip-stat ${doneToday ? 'hot' : 'cold'}" aria-label="${st} day streak">${I.flame}${st}</span>
      <span class="chip-stat" aria-label="${S.xp} total XP" style="color:var(--gold)">${I.bolt}${S.xp}</span>
    </header>`;
  }

  function tabbar() {
    const due = dueCards().length;
    const tabs = [['path', 'Topics', I.path], ['review', 'Review', I.review], ['guide', 'Guide', I.book], ['me', 'Me', I.me]];
    return `<nav class="tabbar"><div class="tabbar-inner">${tabs.map(([id, label, icon]) => `
      <button class="tab" data-act="tab" data-id="${id}" ${ui.tab === id ? 'aria-current="page"' : ''}>
        <span class="tab-icon">${icon}${id === 'review' && due ? `<span class="badge">${due > 99 ? '99+' : due}</span>` : ''}</span>${label}
      </button>`).join('')}</div></nav>`;
  }

  // ------------------------------------------------------------ views: topics
  const KIND_ICON = { spot: I.spot, template: I.template, variants: I.variants, moves: I.moves, problems: I.problems, legendary: I.legendary };

  function unitProgress(unit) {
    const lessons = unit.levels.flatMap((lv) => lv.lessons);
    return { total: lessons.length, done: lessons.filter((l) => lessonDone(l.id) > 0).length };
  }

  function resumeBanner() {
    const a = S.active;
    if (!a) return '';
    return `<div class="resume" data-hue style="--hue:${unitById(a.unit).hue}">
      <p>${esc(a.title)}<small>${a.done.length} of ${a.total} done · ${a.mode === 'legendary' ? 'timed' : 'saved'}</small></p>
      <button class="link-btn" data-act="discard">Discard</button>
      <button class="btn small" data-act="resume">Resume</button>
    </div>`;
  }

  function viewHome() {
    const goal = S.goal, got = dailyXP();
    const pct = Math.min(1, got / goal);
    const r = 22, circ = 2 * Math.PI * r;
    let html = topbar() + resumeBanner();
    html += `<section class="daily">
      <svg class="ring" viewBox="0 0 52 52"><circle class="track" cx="26" cy="26" r="${r}"/>
        <circle class="fill" cx="26" cy="26" r="${r}" stroke-dasharray="${circ}" stroke-dashoffset="${circ * (1 - pct)}" transform="rotate(-90 26 26)"/></svg>
      <div class="daily-text"><strong>${got} / ${goal} XP today</strong>
        <p>${got >= goal ? 'Daily goal done. Anything more is a bonus.' : 'Each activity takes 2–3 minutes and is worth 10–15 XP.'}</p></div>
    </section>
    <button class="quick" data-act="mix">
      <span class="quick-icon">${I.bolt}</span>
      <span><strong>Quick mix</strong><small>8 cards from any topic, weakest first</small></span>
    </button>
    <h2 class="section-title">Topics</h2>
    <div class="topics">`;
    for (const unit of C.units) {
      const p = unitProgress(unit);
      html += `<button class="topic" data-hue style="--hue:${unit.hue}" data-act="topic" data-id="${unit.id}">
        <span class="topic-icon">${KIND_ICON[unit.levels[1] ? unit.levels[1].kind : 'template']}</span>
        <span class="topic-text"><strong>${esc(unit.title)}</strong><small>${esc(unit.subtitle)}</small>
          <span class="bar"><span style="width:${Math.round((100 * p.done) / p.total)}%"></span></span>
          <small>${p.done} of ${p.total} activities done</small></span>
      </button>`;
    }
    if (C.comingSoon.length) html += `</div><div class="locked-list"><h3>Not written yet</h3>${C.comingSoon.map((t) => `<div class="locked">${esc(t)}</div>`).join('')}</div>`;
    else html += '</div>';
    return html;
  }

  function viewTopic() {
    const unit = unitById(ui.topic);
    let html = `${topbar()}<button class="back" data-act="topics">${I.back}All topics</button>`;
    html += `<div data-hue style="--hue:${unit.hue}">
      <div class="unit-head"><div><h2>${esc(unit.title)}</h2><p>${esc(unit.subtitle)}</p></div>
        <button class="guide-btn" data-act="guide" data-id="${unit.id}">${I.book}Guide</button></div>
      <button class="quick" data-act="mix-topic" data-id="${unit.id}">
        <span class="quick-icon">${I.bolt}</span>
        <span><strong>Quick mix</strong><small>8 random cards from ${esc(unit.title)}</small></span>
      </button>`;
    for (const lv of unit.levels) {
      html += `<h2 class="section-title">${KIND_ICON[lv.kind] || ''}${esc(lv.title)}</h2>`;
      for (const ls of lv.lessons) {
        const n = lessonDone(ls.id);
        const meta = ls.sample
          ? `${ls.sample} cards · ${ls.seconds}s each · pass with 80%`
          : `${ls.cards.length} cards · ${Math.max(2, Math.round(ls.cards.length / 3))} min`;
        html += `<button class="lesson-row ${n ? 'done' : ''}" data-act="start" data-id="${ls.id}">
          <span class="tick">${n ? I.check : ls.sample ? I.clock : I.bolt}</span>
          <div><strong>${esc(ls.title)}</strong><small>${meta}${n ? ` · done ${n}×` : ''}</small></div>
        </button>`;
      }
    }
    return html + '</div>';
  }

  // ------------------------------------------------------------ views: review
  function viewReview() {
    const due = dueCards(), miss = mistakeCards();
    const boxes = [0, 0, 0, 0, 0, 0];
    for (const id in S.cards) if (CARDS[id]) boxes[S.cards[id].box]++;
    const maxB = Math.max(1, ...boxes);
    const upcoming = Object.values(S.cards).map((c) => c.due).filter((d) => d > today()).sort()[0];
    return `${topbar()}
      <h1 class="page-title">Review</h1>
      <p class="page-sub">Cards come back just before you'd forget them. Miss one and it returns today.</p>
      <section class="panel">
        <div class="big-num">${due.length}<small>card${due.length === 1 ? '' : 's'} due</small></div>
        <p>${due.length ? 'A short mixed session from everything you’ve studied.' : upcoming ? `Nothing due. Next review on ${upcoming}.` : 'Finish a lesson and its cards will start showing up here.'}</p>
        <button class="btn block" data-act="review-due" ${due.length ? '' : 'disabled'}>Start review</button>
      </section>
      <section class="panel">
        <h2>Mistakes</h2>
        <p>${miss.length ? `${miss.length} card${miss.length === 1 ? '' : 's'} you got wrong last time.` : 'No open mistakes.'}</p>
        <button class="btn ghost block" data-act="review-miss" ${miss.length ? '' : 'disabled'}>Practice mistakes</button>
      </section>
      <section class="panel">
        <h2>Memory strength</h2>
        <div class="boxes">${boxes.map((n) => `<div style="height:${Math.round((n / maxB) * 100)}%" title="${n}"></div>`).join('')}</div>
        <div class="boxes-labels">${['again', '1 day', '3 days', '1 week', '2 weeks', '5 weeks'].map((l, i) => `<span>${boxes[i]}<br>${l}</span>`).join('')}</div>
      </section>`;
  }

  // ------------------------------------------------------------ views: guide
  function viewGuide() {
    const unit = unitById(ui.guide) || C.units[0];
    const g = unit.guide;
    return `${topbar()}
      <h1 class="page-title">Guide</h1>
      <p class="page-sub">Cheat sheet for each unit. Skim it before an interview.</p>
      <div class="guide-tabs">${C.units.map((u) => `<button data-act="guide-unit" data-id="${u.id}" aria-pressed="${u.id === unit.id}">${esc(u.title)}</button>`).join('')}</div>
      <div data-hue style="--hue:${unit.hue}">
        <section class="panel"><h2>${esc(unit.title)}</h2><div class="rich">${rich(g.intro)}</div>${codeBlock(g.template)}</section>
        ${g.variants.length ? `<section class="panel"><h2>Variants</h2>${g.variants.map((v) => `
          <div class="variant"><strong>${esc(v.name)}</strong>
            <span class="when"><span class="when-label">When</span>${inline(v.trigger)}</span>
            <span class="how">${inline(v.how)}</span></div>`).join('')}</section>` : ''}
        <section class="panel"><h2>Moves</h2>${g.moves.map((m) => `
          <div class="variant"><strong>${esc(m.name)}</strong><span class="how">${inline(m.body)}</span></div>`).join('')}</section>
      </div>`;
  }

  // ------------------------------------------------------------ views: me
  function viewMe() {
    const learned = Object.values(S.cards).filter((c) => c.box >= 1).length;
    const strong = Object.values(S.cards).filter((c) => c.box >= 4).length;
    const total = Object.values(CARDS).filter((c) => c.type !== 'teach').length;
    const goals = [[10, 'Casual'], [20, 'Regular'], [30, 'Serious'], [50, 'Intense']];
    const msg = ui.msg ? `<p class="note ${ui.msg.kind}">${esc(ui.msg.text)}</p>` : '';
    return `${topbar()}
      <h1 class="page-title">Progress</h1>
      <p class="page-sub">Saved on this device after every card.</p>
      <div class="stat-grid" style="margin-bottom:16px">
        <div class="stat streak"><b>${streakNow()}</b><span>day streak</span></div>
        <div class="stat streak"><b>${S.streak.best}</b><span>best streak</span></div>
        <div class="stat xp"><b>${S.xp}</b><span>total XP</span></div>
        <div class="stat acc"><b>${learned}<small style="font-size:14px;color:var(--muted)"> / ${total}</small></b><span>cards learned</span></div>
      </div>
      <section class="panel">
        <h2>Daily goal</h2>
        <div class="goal-picks">${goals.map(([n, l]) => `<button data-act="goal" data-n="${n}" aria-pressed="${S.goal === n}">${n} XP<small>${l}</small></button>`).join('')}</div>
        <p>${strong} card${strong === 1 ? '' : 's'} at 2+ weeks of memory strength.</p>
      </section>
      <section class="panel">
        <h2>Backup</h2>
        <p>iOS can clear a web app’s storage. Copy a backup code now and then and keep it in Notes. Paste it here to restore.</p>
        <textarea id="backup" class="backup" placeholder="Backup code appears here, or paste one to restore" spellcheck="false"></textarea>
        <div class="row">
          <button class="btn small" data-act="backup">Copy backup code</button>
          <button class="btn small ghost" data-act="restore">Restore from code</button>
        </div>
        ${msg}
      </section>
      <section class="panel">
        <h2>Reset</h2>
        <p>Erase all progress on this device.</p>
        <button class="btn small ${ui.resetArmed ? 'bad' : 'ghost'}" data-act="reset">${ui.resetArmed ? 'Tap again to erase everything' : 'Reset progress'}</button>
      </section>`;
  }

  // ------------------------------------------------------------ views: lesson
  const KIND_LABEL = {
    teach: ['New concept', I.teach], mcq: ['Choose', I.spot], predict: ['Predict the output', I.template],
    cloze: ['Fill the blank', I.template], order: ['Build it', I.variants], bug: ['Find the bug', I.spot],
    compare: ['Cleaner code', I.moves],
  };

  function optionLabel(card, opt) {
    return card.type === 'predict' || card.type === 'cloze' ? `<code>${esc(opt)}</code>` : inline(opt);
  }

  function optionsHTML(card) {
    if (!ui.perm) ui.perm = shuffle(card.options.map((_, i) => i));
    const checked = !!ui.verdict;
    return `<div class="options">${ui.perm.map((i) => {
      let cls = '';
      if (checked && i === 0) cls = 'right';
      else if (checked && i === ui.sel) cls = 'wrong';
      return `<button class="opt ${card.mono || card.type !== 'mcq' ? 'mono' : ''} ${cls}" data-act="pick" data-i="${i}"
        aria-pressed="${ui.sel === i}" ${checked ? 'disabled' : ''}>${optionLabel(card, card.options[i])}</button>`;
    }).join('')}</div>`;
  }

  function cardHTML(card) {
    const a = S.active;
    const [label, icon] = KIND_LABEL[card.type];
    const head = `<span class="kind ${a.mode === 'review' ? 'review' : ''}">${icon}${a.mode === 'review' ? 'Review · ' : ''}${label}</span>`;
    const checked = !!ui.verdict;
    switch (card.type) {
      case 'teach':
        return `${head}<h1 class="teach-title">${inline(card.title)}</h1><div class="rich">${rich(card.body)}</div>${card.code ? codeBlock(card.code) : ''}`;
      case 'mcq':
        return `${head}<p class="prompt">${inline(card.prompt)}</p>${card.code ? codeBlock(card.code) : ''}${optionsHTML(card)}`;
      case 'predict':
        return `${head}<p class="prompt">${inline(card.prompt)}</p>${codeBlock((card.code ? card.code + '\n' : '') + card.expr)}${optionsHTML(card)}`;
      case 'cloze': {
        let cls = 'blank', text = '&nbsp;'.repeat(6);
        if (ui.sel !== null) { cls += ' filled'; text = esc(card.options[ui.sel]); }
        if (checked) cls += ui.verdict === 'good' ? ' good' : ' bad';
        return `${head}<p class="prompt">${inline(card.prompt)}</p>${codeBlock(card.code, `<span class="${cls}">${text}</span>`)}${optionsHTML(card)}`;
      }
      case 'order': {
        const all = card.lines.concat(card.distractors);
        if (!ui.pool) ui.pool = shuffle(all.map((_, i) => i));
        const builtCls = checked ? (ui.verdict === 'good' ? 'right' : 'wrong') : '';
        const built = ui.built.map((i, k) => `<button class="chip" data-act="unplace" data-k="${k}" ${checked ? 'disabled' : ''}>${hl(all[i])}</button>`).join('');
        const pool = ui.pool.filter((i) => !ui.built.includes(i))
          .map((i) => `<button class="chip" data-act="place" data-i="${i}" ${checked ? 'disabled' : ''}>${hl(all[i])}</button>`).join('');
        const extra = card.distractors.length ? ` ${card.distractors.length === 1 ? 'One line doesn’t belong.' : `${card.distractors.length} lines don’t belong.`}` : '';
        return `${head}<p class="prompt">${inline(card.prompt)}</p>
          <p class="note">Tap lines in order. Tap a placed line to remove it.${extra}</p>
          <div class="built ${builtCls}">${built}</div><div class="pool">${pool}</div>`;
      }
      case 'bug': {
        const lines = card.lines.map((ln, i) => {
          let cls = '';
          if (checked && i === card.line) cls = 'right';
          else if (checked && i === ui.sel) cls = 'wrong';
          return `<button class="ln ${cls}" data-act="line" data-i="${i}" aria-pressed="${ui.sel === i}" ${checked ? 'disabled' : ''}>${hl(ln) || ' '}</button>`;
        }).join('');
        return `${head}<p class="prompt">${inline(card.prompt)}</p><pre class="code lines">${lines}</pre>`;
      }
      case 'compare': {
        const pick = (k) => {
          let cls = '';
          if (checked && k === card.answer) cls = 'right';
          else if (checked && k === ui.sel) cls = 'wrong';
          return `<button class="opt ${cls}" data-act="pick-ab" data-k="${k}" aria-pressed="${ui.sel === k}" ${checked ? 'disabled' : ''} style="text-align:center;font-weight:700">${k.toUpperCase()} is cleaner</button>`;
        };
        return `${head}<p class="prompt">${inline(card.prompt)}</p>
          <div class="versions"><div><div class="version-label">VERSION A</div>${codeBlock(card.a)}</div>
          <div><div class="version-label">VERSION B</div>${codeBlock(card.b)}</div></div>
          <div class="opt-row">${pick('a')}${pick('b')}</div>`;
      }
    }
    return '';
  }

  function answerHTML(card) {
    switch (card.type) {
      case 'mcq': case 'predict': case 'cloze':
        return `<p class="fb-answer">Answer: ${optionLabel(card, card.options[0])}</p>`;
      case 'order': return `<p class="fb-answer">Correct order:</p>${codeBlock(card.lines.join('\n'))}`;
      case 'bug': return `<p class="fb-answer">Line ${card.line + 1}. Fix: <code>${esc(card.fix)}</code></p>`;
      case 'compare': return `<p class="fb-answer">Answer: version ${card.answer.toUpperCase()}</p>`;
    }
    return '';
  }

  function footHTML(card) {
    if (card.type === 'teach') {
      return `<footer class="lesson-foot"><div><button class="btn block" data-act="next">Got it</button></div></footer>`;
    }
    if (!ui.verdict) {
      return `<footer class="lesson-foot"><div><button class="btn block" data-act="check" ${ready(card) ? '' : 'disabled'}>Check</button></div></footer>`;
    }
    const good = ui.verdict === 'good';
    const fix = card.type === 'bug' && good ? `<p>Fix: <code>${esc(card.fix)}</code></p>` : '';
    return `<footer class="lesson-foot ${good ? 'is-good' : 'is-bad'}"><div>
      <div class="fb-head">${good ? I.check : I.x}${good ? 'Correct' : ui.timedOut ? 'Time’s up' : 'Not quite'}</div>
      <div class="fb-text">${good ? '' : answerHTML(card)}${fix}<div class="rich">${rich(card.explain)}</div></div>
      <button class="btn block ${good ? 'good' : 'bad'}" data-act="next">Continue</button>
      <button class="link-btn ask-btn" data-act="chat-open">${I.chat}Ask about this answer</button>
    </div></footer>`;
  }

  function viewLesson() {
    const a = S.active;
    const card = current();
    const pct = Math.round((100 * a.done.length) / a.total);
    const unit = unitById(card.unit);
    const timer = a.mode === 'legendary' && card.type !== 'teach' ? `<span class="timer" id="timer"></span>` : '';
    return `<div class="lesson" data-hue style="--hue:${unit.hue}">
      <div class="lesson-top">
        <button class="icon-btn" data-act="quit" aria-label="Close lesson">${I.close}</button>
        <div class="progress" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><div style="width:${pct}%"></div></div>
        ${timer}
        ${chatAllowed(card) ? `<button class="icon-btn" data-act="chat-open" aria-label="Ask about this card">${I.chat}</button>` : ''}
      </div>
      <div class="lesson-body"><article class="card">${cardHTML(card)}</article></div>
      ${footHTML(card)}
    </div>`;
  }

  function viewDone() {
    const r = S.last || { xp: 0, acc: 100, passed: true, missed: [], streak: 0, mode: 'lesson' };
    const title = r.mode === 'legendary' ? (r.passed ? 'Challenge passed' : 'Not yet') : r.mode === 'review' ? 'Review done' : r.mode === 'mix' ? 'Mix done' : 'Done';
    const sub = r.mode === 'legendary' && !r.passed ? 'You need 80% to pass. Your misses are now in Review.' : esc(r.title || '');
    return `<div class="lesson"><div class="done-screen">
      <div class="medal ${r.passed ? '' : 'failed'}">${r.passed ? I.trophy : I.review}</div>
      <h1>${title}</h1><p class="note">${sub}</p>
      <div class="stats">
        <div class="stat xp"><b>+${r.xp}</b><span>XP</span></div>
        <div class="stat acc"><b>${r.acc}%</b><span>first try</span></div>
        <div class="stat streak"><b>${r.streak}</b><span>streak</span></div>
      </div>
      <div class="done-actions">
        <button class="btn block" data-act="home">Continue</button>
        ${r.missed.length ? `<button class="btn ghost block" data-act="review-last">Retry ${r.missed.length} missed card${r.missed.length === 1 ? '' : 's'}</button>` : ''}
      </div>
    </div></div>`;
  }

  // ------------------------------------------------------------ chat
  // Answers come from the Cloudflare Worker in worker/ (OpenRouter behind it). One thread per card, kept until reload.
  // CHAT_URL is the Worker's address, ending in "/". Empty means chat isn't set up yet.
  const CHAT_URL = 'https://interviewcram-chat.interviewcram.workers.dev/';
  const CODE_KEY = 'interviewcram.chatCode';
  const chat = { open: false, cardId: null, threads: {}, busy: false, error: null, avail: null, needCode: false, pending: '' };
  const getCode = () => { try { return localStorage.getItem(CODE_KEY) || ''; } catch (e) { return ''; } };
  const setCode = (v) => { try { localStorage.setItem(CODE_KEY, v); } catch (e) { /* storage blocked */ } };
  const chatEl = document.createElement('div');
  chatEl.id = 'chat';
  document.body.appendChild(chatEl);

  // No help mid-question in timed challenges.
  const chatAllowed = (card) => !(S.active && S.active.mode === 'legendary' && card.type !== 'teach' && !ui.verdict);

  /** Plain-text description of the card and where the learner is on it, sent as context. */
  function cardContext(card) {
    const a = S.active;
    const { unit } = card;
    const L = (i) => String.fromCharCode(65 + i);
    const out = [`Topic: ${unitById(unit).title}${a ? ` (${a.title})` : ''}`, `Card type: ${KIND_LABEL[card.type][0]}`];
    const answered = !!ui.verdict;
    switch (card.type) {
      case 'teach':
        out.push(`Concept: ${card.title}`, card.body);
        if (card.code) out.push(`Code:\n${card.code}`);
        out.push('This is a teaching card; there is no question to answer.');
        break;
      case 'mcq': case 'predict': case 'cloze': {
        out.push(`Question: ${card.prompt}`);
        const code = card.type === 'predict' ? (card.code ? card.code + '\n' : '') + card.expr : card.code;
        if (code) out.push(`Code${card.type === 'cloze' ? ' (___ is the blank)' : ''}:\n${code}`);
        const perm = ui.perm || card.options.map((_, i) => i);
        out.push('Options as shown:\n' + perm.map((i, k) => `${L(k)}) ${card.options[i]}`).join('\n'));
        if (answered) {
          out.push(`Correct answer: ${L(perm.indexOf(0))}) ${card.options[0]}`);
          out.push(ui.sel === null ? 'Learner ran out of time.' : `Learner picked: ${L(perm.indexOf(ui.sel))}) ${card.options[ui.sel]} (${ui.sel === 0 ? 'correct' : 'wrong'})`);
        } else if (ui.sel !== null) out.push(`Learner has tentatively selected ${L(perm.indexOf(ui.sel))}) but not checked it.`);
        break;
      }
      case 'order': {
        out.push(`Task: ${card.prompt}`, 'Lines to arrange (shuffled for the learner):\n' + card.lines.concat(card.distractors).join('\n'));
        if (card.distractors.length) out.push(`${card.distractors.length} of those lines do not belong.`);
        if (answered) {
          const all = card.lines.concat(card.distractors);
          out.push(`Correct order:\n${card.lines.join('\n')}`, `Learner's order (${ui.verdict === 'good' ? 'correct' : 'wrong'}):\n${ui.built.map((i) => all[i]).join('\n')}`);
        }
        break;
      }
      case 'bug':
        out.push(`Task: ${card.prompt}`, 'Code (numbered):\n' + card.lines.map((l, i) => `${i + 1}: ${l}`).join('\n'));
        if (answered) out.push(`Buggy line: ${card.line + 1}. Fix: ${card.fix}`, ui.sel === null ? 'Learner ran out of time.' : `Learner picked line ${ui.sel + 1} (${ui.sel === card.line ? 'correct' : 'wrong'})`);
        break;
      case 'compare':
        out.push(`Task: ${card.prompt}`, `Version A:\n${card.a}`, `Version B:\n${card.b}`);
        if (answered) out.push(`Cleaner version: ${card.answer.toUpperCase()}`, ui.sel === null ? 'Learner ran out of time.' : `Learner picked ${String(ui.sel).toUpperCase()} (${ui.sel === card.answer ? 'correct' : 'wrong'})`);
        break;
    }
    if (card.type !== 'teach') out.push(answered ? `Explanation shown to learner: ${card.explain}` : 'The learner has NOT answered yet.');
    return out.join('\n\n');
  }

  // Replies are markdown-ish: ``` fences become code blocks, the rest goes through rich().
  function replyHTML(text) {
    return String(text).split(/```[\w+-]*\n?/).map((part, i) => (i % 2 ? codeBlock(part.replace(/\n$/, '')) : part.trim() ? `<div class="rich">${rich(part)}</div>` : '')).join('');
  }

  function suggestions(card) {
    if (card.type === 'teach') return ['Explain this more simply', 'Show another example', 'When does this come up in interviews?'];
    if (!ui.verdict) return ['What is this asking?', 'Give me a hint', 'Explain the terms'];
    return ui.verdict === 'bad'
      ? ['Why was my answer wrong?', 'Walk me through it', 'Show a similar example']
      : ['Why is this the answer?', 'Show a similar example', 'What would make it wrong?'];
  }

  async function checkAvail() {
    if (chat.avail) return;
    if (!CHAT_URL) { chat.avail = false; renderChat(); return; }
    if (!getCode()) chat.needCode = true;
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), 2500);
    try {
      const res = await fetch(`${CHAT_URL}api/health`, { cache: 'no-store', signal: ctl.signal });
      chat.avail = res.ok && !!(await res.json()).ok;
    } catch (e) { chat.avail = false; }
    clearTimeout(t);
    renderChat();
  }

  function renderChat() {
    const card = chat.open && S.active && current();
    if (!card || card.id !== chat.cardId || ui.screen !== 'lesson') { chat.open = false; chatEl.innerHTML = ''; return; }
    const ta = chatEl.querySelector('textarea');
    const draft = ta ? ta.value : '';
    const th = chat.threads[card.id] || [];
    let log;
    if (chat.avail === false) {
      log = CHAT_URL
        ? `<div class="msg err">Couldn’t reach the chat server. Check your connection and try again.</div><button class="btn small ghost" data-chat="retry">Try again</button>`
        : '<div class="msg err">Chat isn’t set up yet: deploy the Worker in <code>worker/</code> and put its address in <code>CHAT_URL</code>.</div>';
    } else if (chat.needCode) {
      log = `<p class="chat-hint">Enter the access code you set on the chat Worker (<code>APP_TOKEN</code>). It’s saved on this device.</p>
        <form class="code-form"><input type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Access code" aria-label="Access code">
          <button class="btn small" type="submit">Save</button></form>
        ${chat.error ? `<div class="msg err">${esc(chat.error)}</div>` : ''}`;
    } else {
      log = th.length ? '' : `<p class="chat-hint">${ui.verdict || card.type === 'teach' ? 'Ask anything about this card.' : 'Ask to clarify the question. It won’t give away the answer unless you ask.'}</p>
        <div class="chat-sugs">${suggestions(card).map((s) => `<button data-chat="sug">${esc(s)}</button>`).join('')}</div>`;
      log += th.map((m) => (m.role === 'user' ? `<div class="msg me">${esc(m.content)}</div>` : `<div class="msg ai">${replyHTML(m.content)}</div>`)).join('');
      if (chat.busy) log += '<div class="msg ai wait"><span><i></i><i></i><i></i></span></div>';
      if (chat.error) log += `<div class="msg err">${esc(chat.error)}</div>`;
    }
    chatEl.innerHTML = `<div class="chat-scrim" data-chat="close"></div>
      <section class="chat-sheet" data-hue style="--hue:${unitById(card.unit).hue}" role="dialog" aria-label="Ask about this card">
        <div class="chat-head"><strong>Ask Claude<small>About this card</small></strong>
          <button class="icon-btn" data-chat="close" aria-label="Close chat">${I.close}</button></div>
        <div class="chat-log">${log}</div>
        <form class="chat-form"><textarea rows="1" enterkeyhint="send" placeholder="Ask a question…" aria-label="Your question" ${chat.avail === false || chat.needCode ? 'disabled' : ''}></textarea>
          <button class="btn" type="submit" aria-label="Send" ${chat.busy || chat.avail === false || chat.needCode ? 'disabled' : ''}>${I.send}</button></form>
      </section>`;
    const nta = chatEl.querySelector('textarea');
    nta.value = draft;
    const logEl = chatEl.querySelector('.chat-log');
    logEl.scrollTop = logEl.scrollHeight;
  }

  function openChat() {
    const card = current();
    if (!card || !chatAllowed(card)) return;
    chat.open = true; chat.cardId = card.id; chat.error = null;
    renderChat();
    checkAvail();
    const field = chatEl.querySelector(chat.needCode ? '.code-form input' : 'textarea');
    if (chat.avail !== false && field && !(chat.threads[card.id] || []).length) field.focus();
  }

  async function sendChat(text) {
    text = text.trim();
    if (!text || chat.busy) return;
    const card = CARDS[chat.cardId];
    const th = chat.threads[card.id] || (chat.threads[card.id] = []);
    th.push({ role: 'user', content: text });
    chat.busy = true; chat.error = null;
    renderChat();
    chatEl.querySelector('textarea').value = '';
    try {
      const res = await fetch(`${CHAT_URL}api/chat`, {
        method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${getCode()}` },
        body: JSON.stringify({ context: cardContext(card), messages: th }),
      });
      const data = await res.json().catch(() => ({}));
      if (res.status === 401) { chat.needCode = true; chat.pending = text; throw new Error(getCode() ? 'That access code didn’t work.' : 'Enter the access code first.'); }
      if (!res.ok || !data.reply) throw new Error(data.error || `The chat server answered ${res.status}.`);
      th.push({ role: 'assistant', content: data.reply });
    } catch (e) {
      th.pop(); // give the question back so it can be resent
      chat.error = e instanceof TypeError ? 'Couldn’t reach the chat server. Check your connection and try again.' : e.message;
      chat.busy = false;
      renderChat();
      const ta = chatEl.querySelector('textarea');
      if (ta) ta.value = text;
      return;
    }
    chat.busy = false;
    renderChat();
  }

  chatEl.addEventListener('click', (e) => {
    const el = e.target.closest('[data-chat]');
    if (!el) return;
    const k = el.dataset.chat;
    if (k === 'close') { chat.open = false; renderChat(); }
    else if (k === 'sug') sendChat(el.textContent);
    else if (k === 'retry') { chat.avail = null; renderChat(); checkAvail(); }
  });
  chatEl.addEventListener('submit', (e) => {
    e.preventDefault();
    if (e.target.classList.contains('code-form')) {
      const v = e.target.querySelector('input').value.trim();
      if (!v) return;
      setCode(v); chat.needCode = false; chat.error = null;
      const q = chat.pending; chat.pending = '';
      renderChat();
      if (q) sendChat(q);
      else chatEl.querySelector('textarea').focus();
      return;
    }
    sendChat(chatEl.querySelector('textarea').value);
  });
  chatEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && e.target.tagName === 'TEXTAREA') { e.preventDefault(); sendChat(e.target.value); }
    if (e.key === 'Escape') { chat.open = false; renderChat(); }
  });

  // ------------------------------------------------------------ render
  let timerHandle = null;
  function stopTimer() { if (timerHandle) { clearInterval(timerHandle); timerHandle = null; } }

  function tickTimer() {
    const el = document.getElementById('timer');
    if (!el || !ui.deadline || ui.verdict) return stopTimer();
    const left = Math.max(0, Math.ceil((ui.deadline - Date.now()) / 1000));
    el.textContent = `${left}s`;
    el.classList.toggle('low', left <= 5);
    if (left === 0) { stopTimer(); check(true); }
  }

  function render() {
    renderMain();
    renderChat();
  }

  function renderMain() {
    stopTimer();
    if (ui.screen === 'lesson' && S.active) {
      root.innerHTML = viewLesson();
      if (document.getElementById('timer') && !ui.verdict) { tickTimer(); timerHandle = setInterval(tickTimer, 250); }
      return;
    }
    if (ui.screen === 'done') { root.innerHTML = viewDone(); return; }
    ui.screen = 'tabs';
    const views = { path: () => (ui.topic && unitById(ui.topic) ? viewTopic() : viewHome()), review: viewReview, guide: viewGuide, me: viewMe };
    root.innerHTML = `<main class="screen">${views[ui.tab]()}</main>${tabbar()}`;
  }

  // ------------------------------------------------------------ events
  function setMsg(text, kind) { ui.msg = { text, kind }; }

  function copyText(text, ta) {
    ta.value = text;
    const fallback = () => { ta.focus(); ta.select(); setMsg('Code selected. Copy it from the box.', 'ok'); render(); document.getElementById('backup').value = text; };
    try {
      navigator.clipboard.writeText(text).then(() => {
        setMsg('Backup code copied. Paste it into Notes.', 'ok');
        render();
        document.getElementById('backup').value = text;
      }, fallback);
    } catch (e) { fallback(); }
  }

  const actions = {
    tab: (el) => {
      if (el.dataset.id === 'path' && ui.tab === 'path') ui.topic = null; // tapping Topics again goes to the list
      ui.tab = el.dataset.id; ui.msg = null; ui.resetArmed = false; render(); window.scrollTo(0, 0);
    },
    topic: (el) => { ui.topic = el.dataset.id; render(); window.scrollTo(0, 0); },
    topics: () => { ui.topic = null; render(); window.scrollTo(0, 0); },
    mix: () => startMix(C.units.map((u) => u.id)),
    'mix-topic': (el) => startMix([el.dataset.id]),
    start: (el) => startLesson(el.dataset.id),
    guide: (el) => { ui.guide = el.dataset.id; ui.tab = 'guide'; render(); window.scrollTo(0, 0); },
    'guide-unit': (el) => { ui.guide = el.dataset.id; render(); },
    resume: () => { ui.screen = 'lesson'; resetCard(); render(); },
    discard: () => { S.active = null; save(); render(); },
    quit: () => { ui.screen = 'tabs'; ui.tab = 'path'; ui.topic = S.active && S.active.back; save(); render(); },
    home: () => { ui.screen = 'tabs'; ui.tab = 'path'; ui.topic = S.last && S.last.back; render(); window.scrollTo(0, 0); },
    'review-due': () => startReview(dueCards(), 'Review'),
    'review-miss': () => startReview(mistakeCards(), 'Mistakes'),
    'review-last': () => startReview((S.last && S.last.missed) || [], 'Missed cards'),
    pick: (el) => { ui.sel = Number(el.dataset.i); render(); },
    'pick-ab': (el) => { ui.sel = el.dataset.k; render(); },
    line: (el) => { ui.sel = Number(el.dataset.i); render(); },
    place: (el) => { ui.built.push(Number(el.dataset.i)); render(); },
    unplace: (el) => { ui.built.splice(Number(el.dataset.k), 1); render(); },
    check: () => { if (ready(current())) check(false); },
    next: () => next(),
    'chat-open': () => openChat(),
    goal: (el) => { S.goal = Number(el.dataset.n); save(); render(); },
    backup: () => {
      const ta = document.getElementById('backup');
      const data = Object.assign({}, S, { active: null });
      copyText(btoa(unescape(encodeURIComponent(JSON.stringify(data)))), ta);
    },
    restore: () => {
      const raw = document.getElementById('backup').value.trim();
      try {
        const data = JSON.parse(decodeURIComponent(escape(atob(raw))));
        if (!data || data.v !== 1 || typeof data.cards !== 'object') throw new Error('bad');
        S = Object.assign(fresh(), data, { active: null });
        save();
        setMsg('Progress restored.', 'ok');
      } catch (e) {
        setMsg('That doesn’t look like a backup code. Copy the whole code and try again.', 'err');
      }
      render();
    },
    reset: () => {
      if (!ui.resetArmed) { ui.resetArmed = true; render(); return; }
      S = fresh();
      save();
      ui.resetArmed = false;
      setMsg('Progress erased.', 'ok');
      render();
    },
  };

  root.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const fn = actions[el.dataset.act];
    if (fn) fn(el);
  });

  document.addEventListener('keydown', (e) => {
    if (ui.screen !== 'lesson' || !S.active || chat.open) return;
    if (e.key === 'Enter') {
      const btn = root.querySelector('[data-act="check"]:not(:disabled), [data-act="next"]');
      if (btn) { e.preventDefault(); btn.click(); }
    }
  });

  // Re-render when the app comes back to the foreground on a new day.
  let lastDay = today();
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && today() !== lastDay) { lastDay = today(); if (ui.screen === 'tabs') render(); }
  });

  // Installed PWA only: offline cache and a request to keep storage.
  if (document.querySelector('link[rel="manifest"]')) {
    try {
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    } catch (e) { /* not available */ }
  }

  render();
})();

</script>

</body></html>
