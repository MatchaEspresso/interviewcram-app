<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cram">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0E1320">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>InterviewCram</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one centered phone column; topic list → topic page with every activity; activities are a full-screen overlay with a fixed action footer. */
:root {
  --bg: #F3F5FA;
  --surface: #FFFFFF;
  --raised: #E6EAF3;
  --raised-deep: #CBD2E0;
  --ink: #172033;
  --muted: #5A657A;
  --line: #D9DFEA;
  --code-bg: #EEF1F8;
  --code-ink: #1F2940;
  --gold: #E39B0B;
  --gold-deep: #B57A05;
  --gold-soft: #FFF3D6;
  --good: #1E9A54;
  --good-deep: #157541;
  --good-soft: #E2F5EA;
  --bad: #D34343;
  --bad-deep: #A83030;
  --bad-soft: #FCE7E7;
  --tok-kw: #8A3FD1;
  --tok-str: #1C7F4B;
  --tok-num: #B5560E;
  --tok-com: #7C879B;
  --tok-fn: #2350D8;
  --tok-bi: #0F7C8C;
  --acc-s: 78%;
  --acc-l: 52%;
  --accd-l: 38%;
  --accs-l: 95%;
  --acc-ink: #FFFFFF;
  --hue: 226;
  --font-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --font-code: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1320; --surface: #161D2E; --raised: #222B42; --raised-deep: #121828; --ink: #E5E9F2;
    --muted: #96A0B5; --line: #2A3552; --code-bg: #10172A; --code-ink: #DCE3F0;
    --gold: #F4B740; --gold-deep: #A9781A; --gold-soft: #3A2E10;
    --good: #3DC27A; --good-deep: #23874F; --good-soft: #12301F;
    --bad: #F06767; --bad-deep: #B13A3A; --bad-soft: #3A1818;
    --tok-kw: #C792EA; --tok-str: #8BD49C; --tok-num: #F5A86B; --tok-com: #6E7A93; --tok-fn: #82AAFF; --tok-bi: #6FD3E0;
    --acc-s: 85%; --acc-l: 64%; --accd-l: 42%; --accs-l: 20%; --acc-ink: #0B1020;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1320; --surface: #161D2E; --raised: #222B42; --raised-deep: #121828; --ink: #E5E9F2;
  --muted: #96A0B5; --line: #2A3552; --code-bg: #10172A; --code-ink: #DCE3F0;
  --gold: #F4B740; --gold-deep: #A9781A; --gold-soft: #3A2E10;
  --good: #3DC27A; --good-deep: #23874F; --good-soft: #12301F;
  --bad: #F06767; --bad-deep: #B13A3A; --bad-soft: #3A1818;
  --tok-kw: #C792EA; --tok-str: #8BD49C; --tok-num: #F5A86B; --tok-com: #6E7A93; --tok-fn: #82AAFF; --tok-bi: #6FD3E0;
  --acc-s: 85%; --acc-l: 64%; --accd-l: 42%; --accs-l: 20%; --acc-ink: #0B1020;
  color-scheme: dark;
}
/* Accent is recomputed wherever a unit sets its own hue. */
:root, [data-hue] {
  --accent: hsl(var(--hue) var(--acc-s) var(--acc-l));
  --accent-deep: hsl(var(--hue) var(--acc-s) var(--accd-l));
  --accent-soft: hsl(var(--hue) var(--acc-s) var(--accs-l));
}

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body {
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, textarea:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
code, .mono { font-family: var(--font-code); }
p { margin: 0; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; line-height: 1.15; text-wrap: balance; }

/* ------------------------------------------------------------ app frame */
.screen {
  max-width: 560px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 0 calc(96px + env(safe-area-inset-bottom, 0px));
}
.topbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  display: flex;
  align-items: center;
  gap: 10px;
  padding-block: 12px;
  background: var(--bg);
}
.brand { font-family: var(--font-display); font-weight: 800; font-size: 22px; letter-spacing: -0.02em; margin-right: auto; }
.brand span { color: var(--accent); }
.chip-stat {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 10px; border-radius: 999px;
  background: var(--surface); border: 1.5px solid var(--line);
  font-weight: 700; font-variant-numeric: tabular-nums; font-size: 15px;
}
.chip-stat svg { width: 18px; height: 18px; }
.chip-stat.hot { color: var(--gold); border-color: var(--gold); background: var(--gold-soft); }
.chip-stat.cold { color: var(--muted); }

.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  display: flex; justify-content: center;
  background: var(--surface);
  border-top: 1.5px solid var(--line);
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
}
.tabbar-inner { display: flex; width: 100%; max-width: 560px; }
.tab {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 6px 0; border: 0; background: none; border-radius: 12px;
  color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.02em;
}
.tab svg { width: 26px; height: 26px; }
.tab[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
.tab .badge {
  position: absolute; transform: translate(14px, -4px);
  min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
  background: var(--bad); color: #fff; font-size: 11px; line-height: 18px; text-align: center;
}
.tab-icon { position: relative; display: flex; }

/* ------------------------------------------------------------ buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 52px; padding: 0 20px;
  border: 0; border-radius: 14px;
  background: var(--accent); color: var(--acc-ink);
  font-weight: 700; font-size: 16px; letter-spacing: 0.04em; text-transform: uppercase;
  box-shadow: 0 4px 0 var(--accent-deep);
  transition: transform 60ms ease, box-shadow 60ms ease;
}
.btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 0 0 var(--accent-deep); }
.btn:disabled { background: var(--raised); color: var(--muted); box-shadow: 0 4px 0 var(--raised-deep); cursor: default; }
.btn.block { width: 100%; }
.btn.ghost { background: var(--surface); color: var(--accent); box-shadow: 0 4px 0 var(--line); border: 2px solid var(--line); }
.btn.good { background: var(--good); color: #fff; box-shadow: 0 4px 0 var(--good-deep); }
.btn.bad { background: var(--bad); color: #fff; box-shadow: 0 4px 0 var(--bad-deep); }
.btn.small { min-height: 40px; padding: 0 14px; font-size: 13px; border-radius: 12px; }
.link-btn { border: 0; background: none; color: var(--accent); font-weight: 700; padding: 8px 4px; }

/* ------------------------------------------------------------ path */
.resume {
  display: flex; align-items: center; gap: 12px;
  margin-block: 4px 16px; padding: 14px 16px;
  border-radius: var(--radius); background: var(--accent-soft); border: 2px solid var(--accent);
}
.resume p { flex: 1; min-width: 0; font-weight: 700; }
.resume small { display: block; font-weight: 400; color: var(--muted); }

.daily {
  display: flex; align-items: center; gap: 14px;
  margin-block: 4px 20px; padding: 14px 16px;
  border-radius: var(--radius); background: var(--surface); border: 1.5px solid var(--line);
}
.daily .ring { flex: none; width: 52px; height: 52px; }
.daily .ring circle { fill: none; stroke-width: 6; }
.daily .ring .track { stroke: var(--raised); }
.daily .ring .fill { stroke: var(--gold); stroke-linecap: round; transition: stroke-dashoffset 400ms ease; }
.daily-text { flex: 1; min-width: 0; }
.daily-text strong { font-family: var(--font-display); font-size: 18px; }
.daily-text p { color: var(--muted); font-size: 14px; }

.unit-head {
  display: flex; align-items: center; gap: 12px;
  padding: 16px; border-radius: var(--radius);
  background: var(--accent); color: var(--acc-ink);
  box-shadow: 0 5px 0 var(--accent-deep);
}
.unit-head > div { flex: 1; min-width: 0; }
.unit-head small { display: block; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.85; }
.unit-head h2 { font-size: 24px; letter-spacing: -0.01em; }
.unit-head p { font-size: 14px; opacity: 0.9; }
.unit-head .guide-btn {
  flex: none; display: flex; flex-direction: column; align-items: center; gap: 2px;
  border: 2px solid currentColor; border-radius: 12px; background: transparent; color: inherit;
  padding: 8px 10px; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
}
.unit-head .guide-btn svg { width: 22px; height: 22px; }

.locked-list { display: flex; flex-direction: column; gap: 8px; margin-block: 0 24px; }
.locked-list h3 { font-size: 15px; color: var(--muted); font-family: var(--font-body); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 4px; }
.locked {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 14px; border-radius: 14px; border: 1.5px dashed var(--line); color: var(--muted);
}
.locked svg { width: 18px; height: 18px; flex: none; }

/* ------------------------------------------------------------ topics */
.section-title {
  display: flex; align-items: center; gap: 8px;
  font-size: 18px; margin-block: 22px 10px;
}
.section-title svg { width: 20px; height: 20px; color: var(--accent); }
.quick {
  display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
  margin-block: 14px 0; padding: 14px 16px;
  border: 2px solid var(--accent); border-radius: var(--radius); background: var(--accent-soft);
  box-shadow: 0 4px 0 var(--accent);
}
.quick:active { transform: translateY(4px); box-shadow: none; }
.quick strong { display: block; font-family: var(--font-display); font-size: 18px; color: var(--accent); }
.quick small { color: var(--muted); }
.quick-icon { flex: none; width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--accent); color: var(--acc-ink); }
.quick-icon svg { width: 24px; height: 24px; }
.topics { display: flex; flex-direction: column; gap: 12px; }
.topic {
  display: flex; align-items: flex-start; gap: 14px; width: 100%; text-align: left;
  padding: 16px; border: 2px solid var(--line); border-radius: var(--radius); background: var(--surface);
  box-shadow: 0 4px 0 var(--line);
}
.topic:active { transform: translateY(4px); box-shadow: none; }
.topic-icon { flex: none; width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; background: var(--accent); color: var(--acc-ink); box-shadow: 0 4px 0 var(--accent-deep); }
.topic-icon svg { width: 28px; height: 28px; }
.topic-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.topic-text strong { font-family: var(--font-display); font-size: 20px; line-height: 1.2; }
.topic-text small { color: var(--muted); font-size: 14px; }
.bar { display: block; height: 10px; border-radius: 5px; background: var(--raised); overflow: hidden; margin-top: 4px; }
.bar > span { display: block; height: 100%; border-radius: 5px; background: var(--accent); }
.back { display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; color: var(--accent); font-weight: 700; padding: 4px 0 12px; }
.back svg { width: 20px; height: 20px; }

/* ------------------------------------------------------------ activity rows */
.lesson-row {
  display: flex; align-items: center; gap: 12px; width: 100%;
  padding: 14px; margin-bottom: 10px; text-align: left;
  border: 2px solid var(--line); border-radius: 14px; background: var(--surface);
  box-shadow: 0 3px 0 var(--line);
}
.lesson-row:active { transform: translateY(3px); box-shadow: none; }
.lesson-row > div { flex: 1; min-width: 0; }
.lesson-row strong { display: block; }
.lesson-row small { color: var(--muted); }
.lesson-row .tick { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--raised); color: var(--muted); }
.lesson-row.done .tick { background: var(--gold); color: #fff; }
.lesson-row .tick svg { width: 18px; height: 18px; }

/* ------------------------------------------------------------ lesson */
.lesson {
  position: fixed; inset: 0; z-index: 30;
  display: flex; flex-direction: column;
  background: var(--bg);
  padding-top: env(safe-area-inset-top, 0px);
}
.lesson-top { display: flex; align-items: center; gap: 12px; padding: 12px 16px; max-width: 640px; width: 100%; margin: 0 auto; }
.icon-btn { flex: none; width: 40px; height: 40px; display: grid; place-items: center; border: 0; background: none; color: var(--muted); border-radius: 10px; }
.icon-btn svg { width: 26px; height: 26px; }
.progress { flex: 1; height: 16px; border-radius: 8px; background: var(--raised); overflow: hidden; }
.progress > div { height: 100%; border-radius: 8px; background: var(--good); transition: width 300ms ease; min-width: 16px; }
.timer { flex: none; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--muted); min-width: 34px; text-align: right; }
.timer.low { color: var(--bad); }

.lesson-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.card { max-width: 640px; margin: 0 auto; padding: 4px 16px 24px; display: flex; flex-direction: column; gap: 16px; }
.kind {
  align-self: flex-start;
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent);
}
.kind svg { width: 16px; height: 16px; }
.kind.review { color: var(--bad); }
.prompt { font-size: 19px; font-weight: 700; line-height: 1.4; }
.prompt code, .rich code, .opt code, .fb-text code {
  font-size: 0.86em; padding: 1px 5px; border-radius: 6px; background: var(--code-bg); color: var(--code-ink);
  overflow-wrap: anywhere;
}
.rich { display: flex; flex-direction: column; gap: 10px; font-size: 16px; }
.rich ul, .rich ol { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px; }
.teach-title { font-size: 26px; letter-spacing: -0.01em; }

.code {
  margin: 0; padding: 12px;
  font-family: var(--font-code); font-size: 12.5px; line-height: 1.6;
  background: var(--code-bg); color: var(--code-ink);
  border-radius: 12px; overflow-x: auto; white-space: pre; tab-size: 4;
}
.code .blank {
  display: inline-block; min-width: 4ch; padding: 0 4px; border-radius: 5px;
  border-bottom: 2px solid var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600;
}
.code .blank.filled { border-bottom-style: solid; color: var(--code-ink); }
.code .blank.good { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.code .blank.bad { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.t-kw { color: var(--tok-kw); font-weight: 600; }
.t-str { color: var(--tok-str); }
.t-num { color: var(--tok-num); }
.t-com { color: var(--tok-com); font-style: italic; }
.t-fn { color: var(--tok-fn); }
.t-bi { color: var(--tok-bi); }

.options { display: flex; flex-direction: column; gap: 10px; }
.opt {
  width: 100%; text-align: left; padding: 14px 16px; min-height: 54px;
  border: 2px solid var(--line); border-radius: 14px; background: var(--surface);
  box-shadow: 0 4px 0 var(--line); font-size: 16px; line-height: 1.4;
  transition: transform 60ms ease, box-shadow 60ms ease;
}
.opt:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.opt.mono { font-family: var(--font-code); font-size: 14px; }
.opt.mono code { background: none; padding: 0; font-size: 1em; }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 4px 0 var(--accent); }
.opt.right { border-color: var(--good); background: var(--good-soft); box-shadow: 0 4px 0 var(--good); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); box-shadow: 0 4px 0 var(--bad); }
.opt:disabled { cursor: default; }
.opt-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* bug hunt: tappable code lines */
.lines { padding: 8px 0; }
.lines .ln {
  display: block; width: 100%; text-align: left; border: 0; background: none;
  font: inherit; color: inherit; white-space: pre; padding: 2px 12px; min-height: 28px;
}
.lines .ln[aria-pressed="true"] { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.lines .ln.right { background: var(--good-soft); box-shadow: inset 3px 0 0 var(--good); }
.lines .ln.wrong { background: var(--bad-soft); box-shadow: inset 3px 0 0 var(--bad); }
.lines .ln:disabled { cursor: default; }

/* parsons */
.built {
  min-height: 120px; padding: 8px; border-radius: 12px;
  background: var(--code-bg); border: 2px dashed var(--line);
  display: flex; flex-direction: column; gap: 4px;
}
.built:empty::before { content: "Tap lines below in order"; color: var(--muted); padding: 8px; font-size: 14px; }
.pool { display: flex; flex-direction: column; gap: 8px; }
.chip {
  display: block; width: 100%; text-align: left;
  font-family: var(--font-code); font-size: 13px; line-height: 1.5; white-space: pre; overflow-x: auto;
  padding: 9px 12px; border-radius: 10px;
  background: var(--surface); color: var(--code-ink); border: 2px solid var(--line); box-shadow: 0 3px 0 var(--line);
}
.chip:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.built .chip { box-shadow: none; padding: 5px 10px; border-color: transparent; background: var(--surface); }
.built.right .chip { background: var(--good-soft); }
.built.wrong .chip { background: var(--bad-soft); }
.chip:disabled { cursor: default; }

/* compare */
.versions { display: flex; flex-direction: column; gap: 12px; }
.version-label { font-weight: 800; font-size: 13px; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 4px; }

/* footer + feedback */
.lesson-foot { flex: none; border-top: 1.5px solid var(--line); background: var(--bg); padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px)); }
.lesson-foot > div { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.lesson-foot.is-good { background: var(--good-soft); border-color: transparent; }
.lesson-foot.is-bad { background: var(--bad-soft); border-color: transparent; }
.fb-head { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-size: 22px; font-weight: 800; }
.fb-head svg { width: 30px; height: 30px; }
.is-good .fb-head { color: var(--good); }
.is-bad .fb-head { color: var(--bad); }
.fb-text { font-size: 15px; max-height: 34vh; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
.fb-text .code { font-size: 12px; }
.fb-answer { font-weight: 700; }

/* lesson complete */
.done-screen { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px 16px; text-align: center; }
.done-screen h1 { font-size: 34px; letter-spacing: -0.02em; }
.done-screen .medal { width: 96px; height: 96px; border-radius: 50%; display: grid; place-items: center; background: var(--gold); color: #fff; box-shadow: 0 7px 0 var(--gold-deep); }
.done-screen .medal svg { width: 52px; height: 52px; }
.done-screen .medal.failed { background: var(--raised); color: var(--muted); box-shadow: 0 7px 0 var(--raised-deep); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: 100%; max-width: 420px; }
.stat { border-radius: 14px; border: 2px solid var(--line); background: var(--surface); padding: 10px 6px; }
.stat b { display: block; font-family: var(--font-display); font-size: 24px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

.page-title { font-size: 30px; letter-spacing: -0.02em; margin-block: 4px 6px; }
.page-sub { color: var(--muted); margin-bottom: 18px; }

.goal-picks button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.goal-picks small { display: block; font-weight: 400; font-size: 11px; color: var(--muted); }
textarea.backup {
  width: 100%; min-height: 90px; resize: vertical;
  font-family: var(--font-code); font-size: 12px;
  border: 2px solid var(--line); border-radius: 12px; padding: 10px;
  background: var(--code-bg); color: var(--code-ink);
}

.row > .btn { flex: 1 1 140px; }
.note { font-size: 14px; color: var(--muted); }
.note.ok { color: var(--good); }
.note.err { color: var(--bad); }
.empty { text-align: center; color: var(--muted); padding: 12px 0; }

/* Chat: a bottom sheet over the lesson, rendered outside #app so re-renders keep its input. */
.chat-scrim { position: fixed; inset: 0; z-index: 40; background: rgb(0 0 0 / 0.35); }
.chat-sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 41;
  max-width: 640px; margin: 0 auto; height: min(78dvh, 640px);

}

":"longest consecutive sequence, contains duplicate","how":"`s = set(nums)`; only start a run where `x - 1 not in s`"},{"name":"Last-seen index","trigger":"duplicate within distance k","how":"`last[x] = i` every time; compare `i - last[x]`"},{"name":"Top k frequent","trigger":"k most common elements","how":"`Counter.most_common(k)`, a heap, or buckets indexed by count"}],"moves":[{"name":"Look before you store","body":"Two Sum checks the complement before storing `x`, so `x` never pairs with itself."},{"name":"Seed the prefix map","body":"`{0: 1}` for counts, `{0: -1}` for lengths, so subarrays starting at index 0 are found."},{"name":"Hashable keys","body":"Lists and sets can't be keys. Use `tuple(...)`, `frozenset(...)` or a string."},{"name":"Counter reads don't insert","body":"`c['z']` is 0 for a missing key and adds nothing. A `defaultdict` **does** add the key when read."},{"name":"Counter tricks","body":"`c.most_common(k)`; `c1 - c2` keeps only positive counts; `c1 == c2` ignores zero counts (3.10+)."},{"name":"dict.get","body":"`d[k] = d.get(k, 0) + 1` counts without `defaultdict`."},{"name":"Buckets by count","body":"Counts are 1..n, so `buckets = [[] for _ in range(n + 1)]` sorts by frequency in O(n). Never `[[]] * (n + 1)`."}]},"levels":[{"id":"hm-l1","kind":"spot","title":"Spot it","lessons":[{"id":"hm-l1-a","title":"Signals","cards":["hm-sig-teach","hm-spot-twosum","hm-spot-anagram","hm-spot-group","hm-spot-subk","hm-spot-consec","hm-spot-topk","hm-spot-notmap"]}]},{"id":"hm-l2","kind":"template","title":"Core template","lessons":[{"id":"hm-l2-a","title":"Seen before","cards":["hm-core-teach","hm-core-order","hm-core-cloze-key","hm-core-why-order","hm-core-bug","hm-core-pred","hm-core-overwrite","hm-core-complexity"]}]},{"id":"hm-l3","kind":"variants","title":"Variants","lessons":[{"id":"hm-l3-a","title":"Counting & grouping","cards":["hm-count-teach","hm-count-pred-most","hm-count-pred-sub","hm-cmp-anagram","hm-group-teach","hm-group-cloze","hm-group-why-tuple","hm-group-key26"]},{"id":"hm-l3-b","title":"Prefix sums & sets","cards":["hm-prefix-teach","hm-prefix-cloze-seed","hm-prefix-cloze-look","hm-prefix-why-after","hm-prefix-pred","hm-consec-teach","hm-consec-bug","hm-consec-worst","hm-consec-iterate","hm-first-teach","hm-first-cloze"]}]},{"id":"hm-l4","kind":"moves","title":"Moves","lessons":[{"id":"hm-l4-a","title":"Python dict moves","cards":["hm-moves-teach","hm-dd-insert","hm-counter-noinsert","hm-get-cloze","hm-cmp-count","hm-hashable","hm-visited","hm-first-why"]}]},{"id":"hm-l5","kind":"problems","title":"Problems","lessons":[{"id":"hm-l5-a","title":"Top K Frequent Elements","cards":["hm-run-topk-teach","hm-run-topk-oneliner","hm-run-topk-cloze","hm-run-topk-pred","hm-run-topk-on","hm-run-topk-alias"]},{"id":"hm-l5-b","title":"Contains Duplicate II","cards":["hm-run-near-teach","hm-run-near-cloze","hm-run-near-pred","hm-run-near-update"]}]},{"id":"hm-l6","kind":"legendary","title":"Timed challenge","lessons":[{"id":"hm-l6-a","title":"Timed mix","sample":12,"seconds":40}]}]},{"id":"gr","title":"BFS / DFS on Grids","subtitle":"Flood fill and shortest steps","hue":135,"guide":{"intro":"A grid is a graph: each cell connects to its 4 neighbours. **DFS** to explore, count or measure regions. **BFS** when you need the **fewest steps**. Bounds-check before indexing, and mark a cell visited the moment you push it.","template":"q = deque([start])\nseen = {start}\nsteps = 0\nwhile q:\n    for _ in range(len(q)):        # one distance layer\n        r, c = q.popleft()\n        if (r, c) == goal:\n            return steps\n        for dr, dc in DIRS:\n            nxt = (r + dr, c + dc)\n            if free(*nxt) and nxt not in seen:   # in bounds, not a wall\n                seen.add(nxt)\n                q.append(nxt)\n    steps += 1\nreturn -1","variants":[{"name":"Count regions","trigger":"number of islands, connected components","how":"scan every cell; on unvisited land, `count += 1` and flood-fill it"},{"name":"Region size","trigger":"max area of island","how":"count cells during each flood fill, keep the max"},{"name":"Shortest path (BFS)","trigger":"fewest steps through an unweighted grid","how":"level-by-level BFS; the first time you reach the goal is the shortest"},{"name":"Multi-source BFS","trigger":"rotting oranges, distance to nearest 0, walls and gates","how":"push **all** sources first, at distance 0"},{"name":"Border flood","trigger":"surrounded regions, Pacific Atlantic","how":"flood from the edges and mark what's reachable; the rest is the answer"},{"name":"8 directions","trigger":"diagonal moves allowed","how":"add the 4 diagonal deltas to `DIRS`"},{"name":"Weighted cells","trigger":"each cell has a cost to enter","how":"Dijkstra with `heapq`, not plain BFS"}],"moves":[{"name":"One DIRS tuple","body":"`DIRS = ((1, 0), (-1, 0), (0, 1), (0, -1))`, then `nr, nc = r + dr, c + dc`."},{"name":"Bounds first","body":"`0 <= nr < rows and 0 <= nc < cols` before `grid[nr][nc]`. Negative indexes don't crash in Python; they silently wrap."},{"name":"Mark on push","body":"Add to `seen` when you enqueue, not when you pop, or the same cell gets queued many times."},{"name":"Sink instead of seen","body":"If you're allowed to change the grid, overwrite visited land (`grid[r][c] = '0'`)."},{"name":"Recursion limit","body":"Recursive DFS on a big grid can pass Python's limit of 1000 frames. Use an explicit stack or BFS."},{"name":"Levels","body":"`for _ in range(len(q))` processes exactly one distance layer. Or store distances in a `dist` grid."},{"name":"deque, not list","body":"`list.pop(0)` is O(n). `deque.popleft()` is O(1)."},{"name":"2D init","body":"`[[0] * cols for _ in range(rows)]`. `[[0] * cols] * rows` repeats one row."}]},"levels":[{"id":"gr-l1","kind":"spot","title":"Spot it","lessons":[{"id":"gr-l1-a","title":"Signals","cards":["gr-sig-teach","gr-spot-islands","gr-spot-shortest","gr-spot-rotting","gr-spot-dp","gr-spot-surrounded","gr-spot-dfs-bfs","gr-spot-weighted"]}]},{"id":"gr-l2","kind":"template","title":"Core template","lessons":[{"id":"gr-l2-a","title":"Flood fill","cards":["gr-core-teach","gr-core-order","gr-core-cloze-guard","gr-core-cloze-sink","gr-core-pred","gr-core-bug","gr-core-recursion","gr-core-complexity"]}]},{"id":"gr-l3","kind":"variants","title":"Variants","lessons":[{"id":"gr-l3-a","title":"Shortest path BFS","cards":["gr-bfs-teach","gr-bfs-cloze-level","gr-bfs-cloze-pop","gr-bfs-mark-push","gr-bfs-pred","gr-bfs-why-not-dfs","gr-bfs-deque","gr-bfs-bug"]},{"id":"gr-l3-b","title":"Multi-source & borders","cards":["gr-rot-teach","gr-rot-cloze-cond","gr-rot-why-all","gr-rot-pred","gr-rot-why-fresh","gr-border-teach","gr-border-cloze","gr-border-why"]}]},{"id":"gr-l4","kind":"moves","title":"Moves","lessons":[{"id":"gr-l4-a","title":"Grid moves","cards":["gr-moves-teach","gr-neg-index","gr-cmp-dirs","gr-2d-init","gr-sink-when","gr-dist","gr-8dir"]}]},{"id":"gr-l5","kind":"problems","title":"Problems","lessons":[{"id":"gr-l5-a","title":"Max Area of Island","cards":["gr-run-area-teach","gr-run-area-pattern","gr-run-area-cloze","gr-run-area-pred","gr-run-area-bug"]},{"id":"gr-l5-b","title":"01 Matrix","cards":["gr-run-01-teach","gr-run-01-why","gr-run-01-cloze","gr-run-01-pred","gr-run-01-nolevels"]}]},{"id":"gr-l6","kind":"legendary","title":"Timed challenge","lessons":[{"id":"gr-l6-a","title":"Timed mix","sample":12,"seconds":40}]}]},{"id":"tr","title":"Tree DFS","subtitle":"Return up, pass down","hue":98,"guide":{"intro":"Decide what a node needs: answers from its children (return a value up) or context from its ancestors (pass state down). Start every function with the `None` base case. Use BFS for anything per-level.","template":"def dfs(node, state):\n    if not node:\n        return BASE\n    left = dfs(node.left, update(state, node))\n    right = dfs(node.right, update(state, node))\n    return combine(node, left, right)","variants":[{"name":"Return up (core)","trigger":"depth, size, balanced, same / symmetric tree","how":"`1 + max(left, right)` and friends"},{"name":"Pass down (core)","trigger":"root-to-leaf sums, good nodes, depth-aware","how":"extra parameter; check at leaves"},{"name":"Return one, track another","trigger":"diameter, max path sum","how":"return the one-sided value; `nonlocal best` for the two-sided one"},{"name":"BST bounds","trigger":"validate BST, insert, range queries","how":"`ok(node, lo, hi)`; left tightens `hi`, right tightens `lo`"},{"name":"LCA","trigger":"lowest common ancestor","how":"return on match; both sides non-None → this node"},{"name":"Level order","trigger":"per level, right side view, zigzag","how":"BFS with `for _ in range(len(q))`"},{"name":"Inorder","trigger":"k-th smallest, sorted BST values","how":"iterative: push lefts, pop, go right"}],"moves":[{"name":"Balanced in O(n)","body":"return -1 for *unbalanced* and check it once"},{"name":"Bool adds as int","body":"`good + dfs(l) + dfs(r)`"},{"name":"Clip negatives","body":"`max(gain(child), 0)`"},{"name":"Mirror","body":"`m(a.left, b.right) and m(a.right, b.left)`"},{"name":"BST LCA","body":"walk down while both are on one side"}]},"levels":[{"id":"tr-l1","kind":"spot","title":"Spot it","lessons":[{"id":"tr-l1-a","title":"Up or down?","cards":["tr-sig-teach","tr-spot-depth","tr-spot-path","tr-spot-level","tr-spot-bst","tr-spot-diam","tr-spot-kth","tr-spot-complex"]}]},{"id":"tr-l2","kind":"template","title":"Core template","lessons":[{"id":"tr-l2-a","title":"Return a value up","cards":["tr-up-teach","tr-up-cloze-base","tr-up-cloze-combine","tr-up-order","tr-up-balanced","tr-same-teach","tr-same-sym"]},{"id":"tr-l2-b","title":"Pass state down","cards":["tr-down-teach","tr-down-cloze-leaf","tr-down-bug","tr-good-teach","tr-good-cloze","tr-bool-pred","tr-down-order"]}]},{"id":"tr-l3","kind":"variants","title":"Variants","lessons":[{"id":"tr-l3-a","title":"Diameter & BST bounds","cards":["tr-diam-teach","tr-diam-cloze-best","tr-diam-bug","tr-diam-root","tr-bst-teach","tr-bst-cloze","tr-bst-parent"]},{"id":"tr-l3-b","title":"LCA & level order","cards":["tr-lca-teach","tr-lca-order","tr-lca-cloze","tr-lca-self","tr-lca-bst","tr-bfs-teach","tr-bfs-cloze","tr-bfs-right"]}]},{"id":"tr-l4","kind":"moves","title":"Moves","lessons":[{"id":"tr-l4-a","title":"Clean tree code","cards":["tr-moves-teach","tr-cmp-base","tr-cmp-bst","tr-kth-teach","tr-kth-cloze","tr-inorder-pred","tr-preorder"]}]},{"id":"tr-l5","kind":"problems","title":"Problems","lessons":[{"id":"tr-l5-a","title":"Max Path Sum","cards":["tr-run-mp-teach","tr-run-mp-return","tr-run-mp-neg","tr-run-mp-order","tr-run-mp-init","tr-run-mp-pred"]},{"id":"tr-l5-b","title":"Lowest Common Ancestor","cards":["tr-run-lc-teach","tr-run-lc-brute","tr-run-lc-split","tr-run-lc-bug","tr-run-lc-complex"]}]},{"id":"tr-l6","kind":"legendary","title":"Timed challenge","lessons":[{"id":"tr-l6-a","title":"Timed mix","sample":12,"seconds":40}]}]},{"id":"hp","title":"Heap / Top-K","subtitle":"Always know the smallest","hue":350,"guide":{"intro":"`heapq` is a min-heap on a list: O(1) peek, O(log n) push and pop. Keep a heap of size k for top-k, merge k sorted streams, track two halves for a running median, and order work by priority in Dijkstra.","template":"h = []\nfor x in nums:\n    heappush(h, x)\n    if len(h) > k:\n        heappop(h)        # evict the smallest\nreturn h[0]               # k-th largest","variants":[{"name":"Size-k heap (core)","trigger":"k-th largest, k closest, top-k frequent","how":"min-heap to keep the k largest; negate the key for k smallest"},{"name":"k-way merge","trigger":"merge k sorted lists, k-th smallest in sorted matrix","how":"seed with each head as `(val, i, j)`, pop then push the next from list `i`"},{"name":"Two heaps","trigger":"running median, sliding median","how":"max-heap low half, min-heap high half, sizes within one"},{"name":"End-time heap","trigger":"meeting rooms, car pooling, CPU tasks","how":"sort by start; reuse the room at `ends[0]` if it's free"},{"name":"Dijkstra","trigger":"weighted shortest path, non-negative weights","how":"`(dist, node)`; skip popped nodes already finalised"},{"name":"Greedy by frequency","trigger":"reorganize string, task scheduler","how":"max-heap of counts; hold back the last one used"}],"moves":[{"name":"Max-heap","body":"push `-x`, read `-h[0]`"},{"name":"Tiebreak","body":"`(priority, i, item)`"},{"name":"heapify is O(n)","body":"build once, don't push n times"},{"name":"Pop + push","body":"`heapreplace(h, x)` pops first; `heappushpop` pushes first"},{"name":"Lazy deletion","body":"leave stale entries, skip them on pop"},{"name":"One-liners","body":"`nlargest(k, xs, key=...)`, `Counter.most_common(k)`"}]},"levels":[{"id":"hp-l1","kind":"spot","title":"Spot it","lessons":[{"id":"hp-l1-a","title":"Signals","cards":["hp-sig-teach","hp-spot-kth","hp-spot-stream","hp-spot-mergek","hp-spot-sorted-once","hp-spot-rooms","hp-spot-dijkstra","hp-spot-api"]},{"id":"hp-l1-b","title":"heapq API","cards":["hp-api-teach","hp-api-pop","hp-api-max","hp-api-tuple","hp-api-list","hp-api-heapify","hp-api-nlargest"]}]},{"id":"hp-l2","kind":"template","title":"Core template","lessons":[{"id":"hp-l2-a","title":"Heap of size k","cards":["hp-core-teach","hp-core-order","hp-core-cloze-trim","hp-core-cloze-ret","hp-core-why-min","hp-key-teach","hp-key-cloze","hp-cmp-closest"]}]},{"id":"hp-l3","kind":"variants","title":"Variants","lessons":[{"id":"hp-l3-a","title":"Merge & schedule","cards":["hp-merge-teach","hp-merge-cloze","hp-merge-tie","hp-merge-matrix","hp-rooms-teach","hp-rooms-cloze","hp-rooms-pred"]},{"id":"hp-l3-b","title":"Dijkstra","cards":["hp-dij-teach","hp-dij-order","hp-dij-bug","hp-dij-neg","hp-dij-unweighted","hp-dij-state"]}]},{"id":"hp-l4","kind":"moves","title":"Moves","lessons":[{"id":"hp-l4-a","title":"Clean heap code","cards":["hp-moves-teach","hp-cmp-kth","hp-replace-pred","hp-pushpop-pred","hp-lazy","hp-topfreq"]}]},{"id":"hp-l5","kind":"problems","title":"Problems","lessons":[{"id":"hp-l5-a","title":"Median from Data Stream","cards":["hp-run-md-teach","hp-run-md-why","hp-run-md-order","hp-run-md-cloze","hp-run-md-bug","hp-run-md-follow"]},{"id":"hp-l5-b","title":"Reorganize String","cards":["hp-run-ro-teach","hp-run-ro-impossible","hp-run-ro-order","hp-run-ro-cloze","hp-run-ro-complex"]}]},{"id":"hp-l6","kind":"legendary","title":"Timed challenge","lessons":[{"id":"hp-l6-a","title":"Timed mix","sample":12,"seconds":40}]}]},{"id":"iv","title":"Intervals","subtitle":"Sort, then sweep","hue":192,"guide":{"intro":"Sort by start to merge, sort by end to pick greedily, or turn intervals into +1/−1 events to count overlaps. Decide up front whether touching intervals overlap.","template":"intervals.sort()\nres = []\nfor s, e in intervals:\n    if res and s <= res[-1][1]:\n        res[-1][1] = max(res[-1][1], e)\n    else:\n        res.append([s, e])","variants":[{"name":"Merge (core)","trigger":"merge overlapping, union of ranges","how":"sort by start; extend `res[-1]` with `max` or append"},{"name":"Insert","trigger":"add one interval to a sorted disjoint list","how":"copy before, absorb overlaps, copy after: O(n)"},{"name":"Greedy by end","trigger":"min removals, max non-overlapping, min arrows","how":"sort by end; keep when `s >= end` (or `>` if touching overlaps)"},{"name":"Sweep line","trigger":"meeting rooms, max overlap, car pooling","how":"events `(s, +1)`, `(e, -1)`, sort, running count"},{"name":"Two lists","trigger":"intersection of two sorted interval lists","how":"overlap is `[max starts, min ends]`; advance the earlier end"}],"moves":[{"name":"Overlap test","body":"`a[0] <= b[1] and b[0] <= a[1]`"},{"name":"Touching","body":"merge: `<=`; arrows: same arrow; rooms: end frees first"},{"name":"Difference array","body":"small integer range: `+1` at s, `-1` at e + 1"},{"name":"Fallback","body":"insert = append + merge, O(n log n)"},{"name":"Sorted copy","body":"`sorted(intervals)` keeps the input intact"}]},"levels":[{"id":"iv-l1","kind":"spot","title":"Spot it","lessons":[{"id":"iv-l1-a","title":"Which sort?","cards":["iv-sig-teach","iv-overlap-pred","iv-spot-merge","iv-spot-erase","iv-spot-rooms","iv-spot-attend","iv-spot-two-lists","iv-spot-calendar"]}]},{"id":"iv-l2","kind":"template","title":"Core template","lessons":[{"id":"iv-l2-a","title":"Merge","cards":["iv-core-teach","iv-core-order","iv-core-cloze-cmp","iv-core-cloze-max","iv-core-bug","iv-core-pred","iv-core-copy"]},{"id":"iv-l2-b","title":"Insert & check","cards":["iv-ins-teach","iv-ins-cloze-left","iv-ins-cloze-end","iv-ins-alt","iv-ins-order"]}]},{"id":"iv-l3","kind":"variants","title":"Variants","lessons":[{"id":"iv-l3-a","title":"Greedy by end","cards":["iv-greedy-teach","iv-greedy-cloze-key","iv-greedy-cloze-ok","iv-arrow-teach","iv-arrow-cloze","iv-greedy-same"]},{"id":"iv-l3-b","title":"Sweep & two lists","cards":["iv-sweep-teach","iv-sweep-cloze","iv-sweep-pred","iv-sweep-diff","iv-two-teach","iv-two-cloze","iv-two-bug"]}]},{"id":"iv-l4","kind":"moves","title":"Moves","lessons":[{"id":"iv-l4-a","title":"Clean interval code","cards":["iv-moves-teach","iv-cmp-merge","iv-cmp-rooms","iv-sortkey-pred","iv-inplace","iv-free-time"]}]},{"id":"iv-l5","kind":"problems","title":"Problems","lessons":[{"id":"iv-l5-a","title":"Insert Interval","cards":["iv-run-in-teach","iv-run-in-phases","iv-run-in-order","iv-run-in-pred","iv-run-in-complex"]},{"id":"iv-l5-b","title":"Minimum Arrows","cards":["iv-run-ar-teach","iv-run-ar-where","iv-run-ar-order","iv-run-ar-bug","iv-run-ar-overflow"]}]},{"id":"iv-l6","kind":"legendary","title":"Timed challenge","lessons":[{"id":"iv-l6-a","title":"Timed mix","sample":12,"seconds":40}]}]},{"id":"ps","title":"Prefix Sum","subtitle":"Any range in one subtraction","hue":52,"guide":{"intro":"Precompute running totals so any subarray sum is `pre[j + 1] - pre[i]`. Pair it with a hash map to count or find subarrays with a target sum, even with negative numbers.","template":"count = Counter({0: 1})        # empty prefix\nprefix = res = 0\nfor x in nums:\n    prefix += x\n    res += count[prefix - k]   # look back\n    count[prefix] += 1         # store","variants":[{"name":"Range queries (core)","trigger":"many sum(i, j) queries on a fixed array","how":"`pre = [0]` + running sums; `pre[j + 1] - pre[i]`"},{"name":"Count sum = k (core)","trigger":"number of subarrays with sum k, negatives allowed","how":"`Counter({0: 1})`, add `count[prefix - k]`, then store"},{"name":"Longest sum = k","trigger":"longest subarray with sum k, equal 0s and 1s","how":"`{0: -1}` and `setdefault(prefix, i)` for first index"},{"name":"Divisible by k","trigger":"sum divisible by k, multiple of k","how":"store `prefix % k`, look up the same remainder"},{"name":"Left × right","trigger":"product except self, pivot index","how":"a forward pass and a backward pass, or `total - left - x`"},{"name":"Difference array","trigger":"many range updates, car pooling, flight bookings","how":"`+v` at start, `-v` at end, then a running sum"},{"name":"2D","trigger":"rectangle sums in a fixed matrix","how":"build: cell + up + left − corner; query: big − strips + corner"}],"moves":[{"name":"One-liner","body":"`list(accumulate(nums, initial=0))`"},{"name":"Running max","body":"`accumulate(nums, max)`"},{"name":"Python modulo","body":"`-7 % 5 == 3`: no fix needed for negatives"},{"name":"Positives only?","body":"a sliding window is simpler and O(1) space"},{"name":"Updates + queries","body":"Fenwick / segment tree, O(log n) each"}]},"levels":[{"id":"ps-l1","kind":"spot","title":"Spot it","lessons":[{"id":"ps-l1-a","title":"Signals","cards":["ps-sig-teach","ps-spot-queries","ps-spot-neg","ps-spot-pos","ps-spot-updates","ps-spot-pivot","ps-spot-updates-mixed","ps-spot-2d"]}]},{"id":"ps-l2","kind":"template","title":"Core template","lessons":[{"id":"ps-l2-a","title":"Padded prefix array","cards":["ps-core-teach","ps-core-order","ps-core-cloze-query","ps-core-acc","ps-core-pred","ps-core-bug","ps-pivot-teach","ps-pivot-cloze"]},{"id":"ps-l2-b","title":"Prefix + hash map","cards":["ps-map-teach","ps-map-order","ps-map-cloze-look","ps-map-bug","ps-map-pred","ps-map-why-window"]}]},{"id":"ps-l3","kind":"variants","title":"Variants","lessons":[{"id":"ps-l3-a","title":"Mod, longest, difference","cards":["ps-mod-teach","ps-mod-cloze","ps-mod-pred","ps-first-teach","ps-first-cloze","ps-first-seed","ps-contig","ps-diff-teach","ps-diff-cloze"]},{"id":"ps-l3-b","title":"Products & 2D","cards":["ps-prod-teach","ps-prod-cloze-range","ps-2d-teach","ps-2d-cloze","ps-2d-build"]}]},{"id":"ps-l4","kind":"moves","title":"Moves","lessons":[{"id":"ps-l4-a","title":"Clean moves","cards":["ps-moves-teach","ps-cmp-pivot","ps-cmp-count","ps-running-pred","ps-accmax-pred","ps-overflow"]}]},{"id":"ps-l5","kind":"problems","title":"Problems","lessons":[{"id":"ps-l5-a","title":"Subarray Sum Equals K","cards":["ps-run-sk-teach","ps-run-sk-brute","ps-run-sk-zero","ps-run-sk-order","ps-run-sk-space"]},{"id":"ps-l5-b","title":"Product Except Self","cards":["ps-run-pe-teach","ps-run-pe-div","ps-run-pe-idea","ps-run-pe-order","ps-run-pe-bug"]}]},{"id":"ps-l6","kind":"legendary","title":"Timed challenge","lessons":[{"id":"ps-l6-a","title":"Timed mix","sample":12,"seconds":40}]}]},{"id":"ms","title":"Monotonic Stack","subtitle":"Next greater, in one pass","hue":250,"guide":{"intro":"A stack handles anything nested or most-recent-first. A monotonic stack keeps indices in sorted order by popping what breaks it; each pop answers a *next greater / smaller* question. Every index is pushed and popped once: O(n).","template":"res = [-1] * len(nums)\nstack = []                          # indices, values decreasing\nfor i, x in enumerate(nums):\n    while stack and nums[stack[-1]] < x:\n        res[stack.pop()] = x        # x is their next greater\n    stack.append(i)","variants":[{"name":"Next greater (core)","trigger":"next greater element, next warmer day","how":"pop while top `<` x; record value or `i - j`"},{"name":"Next / previous smaller","trigger":"nearest smaller on either side","how":"flip the comparison; previous = top after popping"},{"name":"Circular","trigger":"array wraps around","how":"loop `2 * n` with `i % n`, push only when `i < n`"},{"name":"Span","trigger":"stock span, consecutive days ≤ today","how":"`(value, span)` pairs; pop and add spans"},{"name":"Histogram","trigger":"largest rectangle, maximal rectangle in a matrix","how":"increasing stack of `(start, height)`, sentinel 0"},{"name":"Greedy removal","trigger":"remove k digits, smallest subsequence","how":"pop bigger tops while budget remains"},{"name":"Plain stack","trigger":"brackets, RPN, min stack, decode string","how":"push / pop, check empty before popping"}],"moves":[{"name":"Sentinel","body":"`heights + [0]` flushes the stack at the end"},{"name":"Default answers","body":"`res = [-1] * n` or `[0] * n`"},{"name":"Min stack","body":"store `(value, min_so_far)`"},{"name":"Truncating division","body":"`int(a / b)`, not `a // b`"},{"name":"Ties","body":"read the wording: strictly greater `<`, at most `<=`"}]},"levels":[{"id":"ms-l1","kind":"spot","title":"Spot it","lessons":[{"id":"ms-l1-a","title":"Signals","cards":["ms-sig-teach","ms-spot-brackets","ms-spot-next","ms-spot-temps","ms-spot-window","ms-spot-hist","ms-spot-digits","ms-spot-kth"]},{"id":"ms-l1-b","title":"Stack basics","cards":["ms-stack-teach","ms-stack-cloze-end","ms-stack-bug","ms-rpn-teach","ms-rpn-cloze-order","ms-rpn-cloze-div","ms-min-teach","ms-min-cloze"]}]},{"id":"ms-l2","kind":"template","title":"Core template","lessons":[{"id":"ms-l2-a","title":"Next greater element","cards":["ms-core-teach","ms-core-order","ms-core-cloze-while","ms-core-cloze-cmp","ms-core-pred","ms-core-indices","ms-core-complex","ms-daily-teach","ms-daily-cloze"]}]},{"id":"ms-l3","kind":"variants","title":"Variants","lessons":[{"id":"ms-l3-a","title":"Direction, circular, span","cards":["ms-dir-teach","ms-prev-smaller","ms-circ-teach","ms-circ-cloze","ms-circ-push","ms-span-teach","m trigger":"N-Queens, Sudoku","how":"one row at a time; sets for columns, `r - c`, `r + c`"},{"name":"Grid path","trigger":"word search, paths without reuse","how":"mark cell, recurse into neighbours, restore"}],"moves":[{"name":"Copy on save","body":"`res.append(path[:])`"},{"name":"Immutable path","body":"`dfs(path + '(')`: no undo"},{"name":"itertools","body":"`combinations`, `permutations`, `product`"},{"name":"Bitmask subsets","body":"`for mask in range(1 << n)`"},{"name":"Count vs list","body":"counting / optimising with overlap → DP"}]},"levels":[{"id":"bt-l1","kind":"spot","title":"Spot it","lessons":[{"id":"bt-l1-a","title":"Backtrack or DP?","cards":["bt-sig-teach","bt-spot-subsets","bt-spot-count","bt-spot-queens","bt-spot-word","bt-spot-size","bt-spot-perm-count","bt-spot-greedy"]}]},{"id":"bt-l2","kind":"template","title":"Core template","lessons":[{"id":"bt-l2-a","title":"Choose, explore, unchoose","cards":["bt-core-teach","bt-core-order","bt-core-cloze-copy","bt-core-cloze-next","bt-core-bug","bt-sub-teach","bt-sub-cloze","bt-sub-pred","bt-core-complex"]}]},{"id":"bt-l3","kind":"variants","title":"Variants","lessons":[{"id":"bt-l3-a","title":"Permutations, reuse, duplicates","cards":["bt-perm-teach","bt-perm-cloze","bt-perm-bug","bt-csum-teach","bt-csum-cloze-reuse","bt-csum-prune","bt-dup-teach","bt-dup-cloze","bt-dup-sort"]}]},{"id":"bt-l4","kind":"moves","title":"Moves","lessons":[{"id":"bt-l4-a","title":"Clean backtracking","cards":["bt-moves-teach","bt-paren-teach","bt-paren-cloze","bt-cmp-itertools","bt-iter-pred","bt-alias-pred","bt-bitmask","bt-pal-teach","bt-pal-cloze"]}]},{"id":"bt-l5","kind":"problems","title":"Problems","lessons":[{"id":"bt-l5-a","title":"N-Queens","cards":["bt-run-nq-teach","bt-run-nq-diag","bt-run-nq-order","bt-run-nq-cloze","bt-run-nq-complex"]},{"id":"bt-l5-b","title":"Word Search","cards":["bt-run-ws-teach","bt-run-ws-order","bt-run-ws-cloze","bt-run-ws-bug","bt-run-ws-prune"]}]},{"id":"bt-l6","kind":"legendary","title":"Timed challenge","lessons":[{"id":"bt-l6-a","title":"Timed mix","sample":12,"seconds":40}]}]},{"id":"dp","title":"Dynamic Programming","subtitle":"Smaller answers, cached","hue":38,"guide":{"intro":"Define the state in words, write the recurrence, set base cases, then compute smaller states first or memoise the recursion. Counting, min/max and yes/no questions with overlapping subproblems are DP; listing every answer is backtracking.","template":"@cache\ndef f(i):\n    if i >= len(nums):          # base case\n        return 0\n    return max(f(i + 1),                 # skip\n               nums[i] + f(i + 2))       # take","variants":[{"name":"1D take / skip (core)","trigger":"house robber, climbing stairs, decode ways","how":"`f(i)` from `f(i + 1)`, `f(i + 2)`; roll to two variables"},{"name":"Kadane","trigger":"max subarray sum / product","how":"best ending here = `max(x, cur + x)`"},{"name":"Unbounded knapsack","trigger":"coin change, fewest coins, combination counts","how":"`dp[a]` from `dp[a - c]`; coins outside for combinations"},{"name":"0/1 knapsack","trigger":"partition equal subset, target sum","how":"1D boolean `dp`, amounts loop **backwards**"},{"name":"Grid","trigger":"unique paths, min path sum (right/down only)","how":"from above + left; one rolling row"},{"name":"Two strings","trigger":"LCS, edit distance, interleaving","how":"`dp[i][j]` over prefixes, padded with a zero row/column"},{"name":"Ends at i","trigger":"LIS, longest chain","how":"`dp[i]` = best ending at `i`; answer is `max(dp)`"},{"name":"Split points","trigger":"word break, palindrome partition count","how":"`dp[i] = any(dp[j] and ok(j, i))`"}],"moves":[{"name":"Recursion first","body":"plain recursion, then `@cache`"},{"name":"Padding","body":"extra row/column for empty prefixes"},{"name":"Impossible","body":"`float('inf')` → -1 at the end"},{"name":"Rolling","body":"`a, b = b, a + b`; tuple-assign from old values"},{"name":"Loop order","body":"coins outside = combinations, inside = permutations"},{"name":"Recursion limit","body":"deep `@cache` recursion → go bottom-up"}]},"levels":[{"id":"dp-l1","kind":"spot","title":"Spot it","lessons":[{"id":"dp-l1-a","title":"Signals","cards":["dp-sig-teach","dp-spot-ways","dp-spot-list","dp-spot-greedy","dp-spot-subarray","dp-spot-two","dp-spot-path","dp-spot-shortest"]},{"id":"dp-l1-b","title":"Define the state","cards":["dp-state-teach","dp-state-rob","dp-state-coin","dp-state-lis","dp-state-lcs","dp-state-dims"]}]},{"id":"dp-l2","kind":"template","title":"Core template","lessons":[{"id":"dp-l2-a","title":"Memo → table → variables","cards":["dp-core-teach","dp-core-cloze-choice","dp-core-cloze-base","dp-table-teach","dp-table-order","dp-vars-teach","dp-vars-bug","dp-climb-pred","dp-memo-vs-table"]},{"id":"dp-l2-b","title":"Kadane","cards":["dp-kad-teach","dp-kad-cloze","dp-kad-bug","dp-kad-product","dp-kad-pred"]}]},{"id":"dp-l3","kind":"variants","title":"Variants","lessons":[{"id":"dp-l3-a","title":"Knapsack family","cards":["dp-coin-teach","dp-coin-cloze","dp-ways-teach","dp-ways-order","dp-ways-cloze","dp-01-teach","dp-01-cloze","dp-01-vs-unbounded"]},{"id":"dp-l3-b","title":"Grids & strings","cards":["dp-grid-teach","dp-grid-cloze","dp-pad-teach","dp-pad-cloze","dp-lcs-teach","dp-lcs-cloze","dp-edit-teach","dp-edit-cloze","dp-lis-teach","dp-lis-cloze"]}]},{"id":"dp-l4","kind":"moves","title":"Moves","lessons":[{"id":"dp-l4-a","title":"Clean DP","cards":["dp-moves-teach","dp-cmp-fib","dp-cmp-rob","dp-cache-pred","dp-recursion-limit","dp-reconstruct"]}]},{"id":"dp-l5","kind":"problems","title":"Problems","lessons":[{"id":"dp-l5-a","title":"Coin Change","cards":["dp-run-cc-teach","dp-run-cc-greedy","dp-run-cc-rec","dp-run-cc-order","dp-run-cc-bug","dp-run-cc-complex"]},{"id":"dp-l5-b","title":"Word Break","cards":["dp-run-wb-teach","dp-run-wb-greedy","dp-run-wb-order","dp-run-wb-cloze","dp-run-wb-complex"]}]},{"id":"dp-l6","kind":"legendary","title":"Timed challenge","lessons":[{"id":"dp-l6-a","title":"Timed mix","sample":12,"seconds":40}]}]},{"id":"ll","title":"Linked List","subtitle":"Dummy, reverse, fast & slow","hue":206,"guide":{"intro":"Four moves cover nearly everything: a dummy head for edits at the front, three-pointer reversal, fast & slow pointers for middles and cycles, and a tail pointer to merge. Save `next` before rewiring.","template":"prev, cur = None, head\nwhile cur:\n    nxt = cur.next      # save\n    cur.next = prev     # flip\n    prev = cur          # step\n    cur = nxt\nreturn prev             # new head","variants":[{"name":"Reverse (core)","trigger":"reverse list, reverse a sublist, k-group","how":"`prev`, `cur`, `nxt`; return `prev`"},{"name":"Dummy + tail (core)","trigger":"merge, partition, build a new list","how":"`dummy = tail = ListNode()`, return `dummy.next`"},{"name":"Gap pointers","trigger":"n-th from end, remove n-th from end","how":"start both at dummy, move `fast` n ahead, then both"},{"name":"Fast & slow","trigger":"cycle, middle, happy number","how":"`while fast and fast.next`; compare with `is`"},{"name":"Cycle start","trigger":"where does the loop begin, find duplicate number","how":"after meeting, restart `slow` at head, both 1 step"},{"name":"Combine moves","trigger":"reorder list, palindrome list","how":"middle → reverse second half → weave or compare"}],"moves":[{"name":"Tuple reverse","body":"`cur.next, prev, cur = prev, cur, cur.next`"},{"name":"Attach the rest","body":"`tail.next = a or b`"},{"name":"Carry loop","body":"`while a or b or carry`"},{"name":"Identity","body":"`slow is fast`, not `.val ==`"},{"name":"LRU","body":"`OrderedDict.move_to_end`, `popitem(last=False)`"}]},"levels":[{"id":"ll-l1","kind":"spot","title":"Spot it","lessons":[{"id":"ll-l1-a","title":"The toolkit","cards":["ll-sig-teach","ll-spot-cycle","ll-spot-middle","ll-spot-nth","ll-spot-pal","ll-spot-merge-k","ll-spot-lru"]}]},{"id":"ll-l2","kind":"template","title":"Core template","lessons":[{"id":"ll-l2-a","title":"Reverse in place","cards":["ll-rev-teach","ll-rev-order","ll-rev-cloze-ret","ll-rev-bug","ll-rev-tuple","ll-rev-tuple-trap","ll-rev-recursive"]},{"id":"ll-l2-b","title":"Dummy head","cards":["ll-dummy-teach","ll-dummy-cloze-rest","ll-dummy-cloze-ret","ll-dummy-bug","ll-nth-teach","ll-nth-cloze","ll-nth-pred"]}]},{"id":"ll-l3","kind":"variants","title":"Variants","lessons":[{"id":"ll-l3-a","title":"Fast & slow","cards":["ll-fs-teach","ll-fs-cloze-loop","ll-fs-cloze-is","ll-mid-pred","ll-start-teach","ll-start-cloze","ll-dup-number"]}]},{"id":"ll-l4","kind":"moves","title":"Moves","lessons":[{"id":"ll-l4-a","title":"Clean list code","cards":["ll-moves-teach","ll-cmp-merge","ll-cmp-pal","ll-is-pred","ll-lru"]}]},{"id":"ll-l5","kind":"problems","title":"Problems","lessons":[{"id":"ll-l5-a","title":"Reorder List","cards":["ll-run-ro-teach","ll-run-ro-cut","ll-run-ro-order","ll-run-ro-cloze","ll-run-ro-complex"]},{"id":"ll-l5-b","title":"Add Two Numbers","cards":["ll-run-at-teach","ll-run-at-cloze-loop","ll-run-at-cloze-div","ll-run-at-order","ll-run-at-follow"]}]},{"id":"ll-l6","kind":"legendary","title":"Timed challenge","lessons":[{"id":"ll-l6-a","title":"Timed mix","sample":12,"seconds":40}]}]},{"id":"ts","title":"Topological Sort","subtitle":"Order by dependencies","hue":112,"guide":{"intro":"Dependencies form a directed graph. Kahn's algorithm repeatedly takes nodes with no remaining prerequisites; if it can't take all of them, there's a cycle. DFS with three colours detects cycles and gives an order in reversed postorder.","template":"q = deque(i for i in range(n) if indeg[i] == 0)\norder = []\nwhile q:\n    u = q.popleft()\n    order.append(u)\n    for v in graph[u]:\n        indeg[v] -= 1\n        if indeg[v] == 0:\n            q.append(v)\nreturn order if len(order) == n else []","variants":[{"name":"Kahn's (core)","trigger":"course schedule, build order, can finish","how":"in-degrees, queue the zeros, count at the end"},{"name":"DFS colours","trigger":"cycle detection in a directed graph","how":"0 new, 1 on path, 2 done; hitting 1 = cycle"},{"name":"Postorder","trigger":"an order via DFS","how":"append after children, reverse at the end"},{"name":"Levels","trigger":"minimum semesters, parallel rounds","how":"Kahn's with `for _ in range(len(q))`"},{"name":"Longest path in DAG","trigger":"parallel jobs with durations","how":"relax `finish[v]` in topological order"},{"name":"Derived edges","trigger":"alien dictionary, sequence reconstruction","how":"build edges from the input's ordering, then sort"}],"moves":[{"name":"Edge direction","body":"prerequisite → course; say it before coding"},{"name":"Unique order","body":"queue never holds more than one node"},{"name":"Smallest order","body":"min-heap instead of a queue"},{"name":"Undirected cycles","body":"Union-Find, not in-degrees"},{"name":"Library","body":"`graphlib.TopologicalSorter`"}]},"levels":[{"id":"ts-l1","kind":"spot","title":"Spot it","lessons":[{"id":"ts-l1-a","title":"Dependencies","cards":["ts-sig-teach","ts-spot-courses","ts-spot-undirected","ts-spot-alien","ts-spot-parallel","ts-spot-dag","ts-spot-unique"]}]},{"id":"ts-l2","kind":"template","title":"Core template","lessons":[{"id":"ts-l2-a","title":"Kahn's algorithm","cards":["ts-core-teach","ts-core-order","ts-core-cloze-edge","ts-core-cloze-zero","ts-core-cloze-cycle","ts-core-pred","ts-core-complex"]},{"id":"ts-l2-b","title":"DFS colouring","cards":["ts-dfs-teach","ts-dfs-cloze-cycle","ts-dfs-bug","ts-dfs-two","ts-post-teach","ts-post-cloze","ts-bfs-vs-dfs"]}]},{"id":"ts-l3","kind":"variants","title":"Variants","lessons":[{"id":"ts-l3-a","title":"Levels & friends","cards":["ts-lvl-teach","ts-lvl-cloze","ts-lvl-pred","ts-lvl-weights","ts-lex","ts-safe","ts-self-loop"]}]},{"id":"ts-l4","kind":"moves","title":"Moves","lessons":[{"id":"ts-l4-a","title":"Clean graph setup","cards":["ts-moves-teach","ts-cmp-build","ts-deque-pred","ts-graphlib"]}]},{"id":"ts-l5","kind":"problems","title":"Problems","lessons":[{"id":"ts-l5-a","title":"Course Schedule II","cards":["ts-run-cs-teach","ts-run-cs-dir","ts-run-cs-order","ts-run-cs-empty","ts-run-cs-complex"]},{"id":"ts-l5-b","title":"Alien Dictionary","cards":["ts-run-ad-teach","ts-run-ad-edge","ts-run-ad-prefix","ts-run-ad-cloze","ts-run-ad-dup"]}]},{"id":"ts-l6","kind":"legendary","title":"Timed challenge","lessons":[{"id":"ts-l6-a","title":"Timed mix","sample":12,"seconds":40}]}]},{"id":"uf","title":"Union-Find","subtitle":"Merge groups, ask who's together","hue":4,"guide":{"intro":"A parent array where each group points to a root. `find` walks up (compressing the path), `union` links two roots (smaller under bigger). Use it for undirected connectivity, cycle detection and grouping by transitive equality.","template":"parent = list(range(n))\ndef find(x):\n    while parent[x] != x:\n        parent[x] = parent[parent[x]]   # path halving\n        x = parent[x]\n    return x\ndef union(a, b):\n    ra, rb = find(a), find(b)\n    if ra == rb:\n        return False\n    parent[ra] = rb\n    return True","variants":[{"name":"Components (core)","trigger":"number of provinces, connected components","how":"`count = n`, minus one per successful union"},{"name":"Cycle detection","trigger":"redundant connection, graph valid tree (undirected)","how":"edge with `find(a) == find(b)` closes a cycle"},{"name":"Valid tree","trigger":"is this graph a tree","how":"exactly `n - 1` edges and no cycle"},{"name":"Equality groups","trigger":"equations `==` / `!=`, similar strings","how":"union all equalities, then check inequalities"},{"name":"Keyed items","trigger":"accounts merge, words, grid cells","how":"dict parent with `setdefault`, or `r * cols + c`"},{"name":"Online connectivity","trigger":"islands added over time","how":"union new item with existing neighbours as it arrives"}],"moves":[{"name":"Union by size","body":"attach smaller root under bigger; track `size`"},{"name":"Recursive find","body":"`parent[x] = find(parent[x])`"},{"name":"Not for direction","body":"directed cycles → DFS colours or Kahn's"},{"name":"Not for distance","body":"shortest path → BFS"},{"name":"Complexity","body":"both tricks → amortised `O(α(n))`"}]},"levels":[{"id":"uf-l1","kind":"spot","title":"Spot it","lessons":[{"id":"uf-l1-a","title":"Signals","cards":["uf-sig-teach","uf-spot-redundant","uf-spot-directed","uf-spot-components","uf-spot-online","uf-spot-equal","uf-spot-path"]}]},{"id":"uf-l2","kind":"template","title":"Core template","lessons":[{"id":"uf-l2-a","title":"find & union","cards":["uf-core-teach","uf-core-order","uf-core-cloze-root","uf-core-cloze-find","uf-rec-teach","uf-rec-cloze","uf-comp-bug","uf-comp-pred"]}]},{"id":"uf-l3","kind":"variants","title":"Variants","lessons":[{"id":"uf-l3-a","title":"Cycles, equations, keys","cards":["uf-cycle-teach","uf-cycle-cloze","uf-cycle-why","uf-eq-teach","uf-eq-order","uf-eq-ord","uf-map-teach","uf-grid-key"]}]},{"id":"uf-l4","kind":"moves","title":"Moves","lessons":[{"id":"uf-l4-a","title":"Compact Union-Find","cards":["uf-moves-teach","uf-cmp-find","uf-cmp-dfs","uf-parent-pred","uf-complexity"]}]},{"id":"uf-l5","kind":"problems","title":"Problems","lessons":[{"id":"uf-l5-a","title":"Redundant Connection","cards":["uf-run-rc-teach","uf-run-rc-last","uf-run-rc-order","uf-run-rc-cloze","uf-run-rc-pred"]},{"id":"uf-l5-b","title":"Accounts Merge","cards":["uf-run-am-teach","uf-run-am-names","uf-run-am-cloze","uf-run-am-order","uf-run-am-complex"]}]},{"id":"uf-l6","kind":"legendary","title":"Timed challenge","lessons":[{"id":"uf-l6-a","title":"Timed mix","sample":12,"seconds":40}]}]},{"id":"dj","title":"Dijkstra","subtitle":"Cheapest path first","hue":316,"guide":{"intro":"Weighted shortest paths with non-negative weights: BFS with a min-heap that always expands the closest unfinished node. A node's first pop is final. Change what a path costs (`max`, product) or what a node is (`(node, stops)`) and the same loop still works.","template":"dist = [inf] * n\ndist[src] = 0\nh = [(0, src)]\nwhile h:\n    d, u = heappop(h)\n    if d > dist[u]:\n        continue                  # stale entry\n    for v, w in graph[u]:\n        if d + w < dist[v]:\n            dist[v] = d + w\n            heappush(h, (d + w, v))\nreturn dist","variants":[{"name":"Single source (core)","trigger":"network delay, fastest route, cheapest cost","how":"`dist` array, heap of `(d, node)`, skip stale pops"},{"name":"One target","trigger":"cost from `src` to `dst`","how":"return `d` when `dst` is **popped**, not pushed"},{"name":"Path","trigger":"return the route itself","how":"`prev[v] = u` on relax, walk back and reverse"},{"name":"Minimax","trigger":"minimum effort, swim in rising water","how":"cost `max(d, w)` instead of `d + w`"},{"name":"Max probability","trigger":"most reliable path","how":"max-heap of `-p`, multiply along the path"},{"name":"State","trigger":"k stops, k discounts, fuel, keys","how":"node = `(node, extra)`; `dist` keyed by state"},{"name":"Count shortest","trigger":"number of ways to arrive","how":"`ways[v] = ways[u]` on shorter, `+=` on equal"},{"name":"0-1 BFS","trigger":"weights are only 0 or 1","how":"deque: 0 → `appendleft`, 1 → `append`"}],"moves":[{"name":"Check weights","body":"equal → BFS, negative → Bellman–Ford, DAG → topological order"},{"name":"Distance first","body":"push `(d, node)`, never `(node, d)`"},{"name":"Undirected","body":"add the edge both ways"},{"name":"Many sources","body":"push them all at 0"},{"name":"To one target","body":"reverse edges, run from the target"},{"name":"k stops","body":"Bellman–Ford, `k + 1` rounds on a copy"},{"name":"Complexity","body":"`O(E log V)`; dense graph → `O(V²)` array scan"}]},"levels":[{"id":"dj-l1","kind":"spot","title":"Spot it","lessons":[{"id":"dj-l1-a","title":"Signals","cards":["dj-sig-teach","dj-spot-roads","dj-spot-unit","dj-spot-negative","dj-spot-01","dj-spot-effort","dj-spot-kstops","dj-spot-mst","dj-spot-dag"]}]},{"id":"dj-l2","kind":"template","title":"Core template","lessons":[{"id":"dj-l2-a","title":"Lazy Dijkstra","cards":["dj-core-teach","dj-core-order","dj-core-cloze-stale","dj-core-cloze-relax","dj-core-bug","dj-core-pred","dj-core-complexity"]},{"id":"dj-l2-b","title":"Targets & paths","cards":["dj-ndt-teach","dj-ndt-cloze","dj-tgt-teach","dj-tgt-why","dj-path-teach","dj-path-cloze"]}]},{"id":"dj-l3","kind":"variants","title":"Variants","lessons":[{"id":"dj-l3-a","title":"Minimax & probability","cards":["dj-eff-teach","dj-eff-cloze","dj-swim","dj-prob","dj-prob-pred"]},{"id":"dj-l3-b","title":"0-1 BFS & states","cards":["dj-01-teach","dj-01-front","dj-state-teach","dj-state-discount","dj-state-keys"]}]},{"id":"dj-l4","kind":"moves","title":"Moves","lessons":[{"id":"dj-l4-a","title":"Clean Dijkstra","cards":["dj-moves-teach","dj-undirected-bug","dj-cmp-style","dj-multi","dj-reverse","dj-tuple-pred","dj-floyd"]}]},{"id":"dj-l5","kind":"problems","title":"Problems","lessons":[{"id":"dj-l5-a","title":"Cheapest Flights Within K Stops","cards":["dj-run-cf-teach","dj-run-cf-why","dj-run-cf-order","dj-run-cf-bug","dj-run-cf-state","dj-run-cf-pred"]},{"id":"dj-l5-b","title":"Number of Ways to Arrive","cards":["dj-run-nw-teach","dj-run-nw-cloze","dj-run-nw-cloze-eq","dj-run-nw-zero","dj-run-nw-complex"]}]},{"id":"dj-l6","kind":"legendary","title":"Timed challenge","lessons":[{"id":"dj-l6-a","title":"Timed mix","sample":12,"seconds":40}]}]},{"id":"mst","title":"MST: Kruskal & Prim","subtitle":"Connect everything, cheapest","hue":156,"guide":{"intro":"A minimum spanning tree connects every node of an undirected weighted graph with `n - 1` edges at the least total weight. **Kruskal**: sort edges, take each one that joins two Union-Find groups. **Prim**: grow one tree, always adding the cheapest edge leaving it. Not shortest paths: that's Dijkstra.","template":"# Kruskal: cheapest edges first, skip cycles\nfor u, v, w in sorted(edges, key=lambda e: e[2]):\n    if find(u) != find(v):\n        union(u, v)\n        total += w\n\n# Prim: like Dijkstra, but push w, not d + w\nh, seen = [(0, 0)], set()\nwhile h:\n    w, u = heappop(h)\n    if u in seen:\n        continue\n    seen.add(u)\n    total += w\n    for nw, v in graph[u]:\n        if v not in seen:\n            heappush(h, (nw, v))","variants":[{"name":"Kruskal (core)","trigger":"edge list, connect all, min total cost","how":"sort by weight, Union-Find skips cycle edges"},{"name":"Prim (heap)","trigger":"adjacency list, grow from one node","how":"heap of `(w, node)`, skip seen nodes"},{"name":"Dense Prim","trigger":"connect all points, complete graph","how":"`best[]` array, O(n²), no edge list"},{"name":"Virtual node","trigger":"wells, power plants, pay to start","how":"node 0 joined to each `i` at its own cost"},{"name":"Disconnected","trigger":"return -1 if impossible","how":"Kruskal: `used < n - 1`; Prim: `len(seen) < n`"},{"name":"Minimax path","trigger":"minimise the largest edge between two nodes","how":"Kruskal until `src` and `dst` join"},{"name":"Critical edges","trigger":"edges every MST needs","how":"rerun Kruskal without the edge; heavier → critical"}],"moves":[{"name":"Prim vs Dijkstra","body":"push `w`, not `d + w`"},{"name":"`(w, u, v)` tuples","body":"plain `sorted(edges)` orders by weight"},{"name":"Stop early","body":"break after `n - 1` edges"},{"name":"Maximum ST","body":"sort descending or negate"},{"name":"Negative weights","body":"fine for MST (not for Dijkstra)"},{"name":"Complexity","body":"Kruskal `O(E log E)`; heap Prim `O(E log V)`; array Prim `O(V²)`"}]},"levels":[{"id":"mst-l1","kind":"spot","title":"Spot it","lessons":[{"id":"mst-l1-a","title":"Signals","cards":["mst-sig-teach","mst-spot-cable","mst-spot-route","mst-spot-points","mst-spot-wells","mst-spot-negative","mst-spot-directed"]}]},{"id":"mst-l2","kind":"template","title":"Core template","lessons":[{"id":"mst-l2-a","title":"Kruskal","cards":["mst-kr-teach","mst-kr-order","mst-kr-cloze-sort","mst-kr-cloze-take","mst-kr-bug","mst-kr-pred"]},{"id":"mst-l2-b","title":"Prim","cards":["mst-pr-teach","mst-pr-order","mst-pr-cloze","mst-pr-bug","mst-pr-diff"]}]},{"id":"mst-l3","kind":"variants","title":"Variants","lessons":[{"id":"mst-l3-a","title":"Early stop, max, minimax","cards":["mst-early-teach","mst-early-cloze","mst-maxst","mst-bot-teach","mst-bot-pred","mst-critical"]}]},{"id":"mst-l4","kind":"moves","title":"Moves","lessons":[{"id":"mst-l4-a","title":"Picking the algorithm","cards":["mst-moves-teach","mst-cmp-dense","mst-cut","mst-complexity","mst-unique","mst-tuple-pred"]}]},{"id":"mst-l5","kind":"problems","title":"Problems","lessons":[{"id":"mst-l5-a","title":"Min Cost to Connect All Points","cards":["mst-run-cp-teach","mst-run-cp-order","mst-run-cp-cloze","mst-run-cp-pred","mst-run-cp-why"]},{"id":"mst-l5-b","title":"Optimize Water Distribution","cards":["mst-run-ow-teach","mst-run-ow-why","mst-run-ow-cloze","mst-run-ow-order","mst-run-ow-pred"]}]},{"id":"mst-l6","kind":"legendary","title":"Timed challenge","lessons":[{"id":"mst-l6-a","title":"Timed mix","sample":12,"seconds":40}]}]},{"id":"tri","title":"Trie","subtitle":"Prefixes, letter by letter","hue":84,"guide":{"intro":"A tree of letters where shared prefixes are stored once. Nested dicts with an end marker make it a few lines. Use it for prefix queries, wildcard matching, and searching for many words at once.","template":"root = {}\ndef insert(word):\n    node = root\n    for ch in word:\n        node = node.setdefault(ch, {})\n    node[\"$\"] = True\ndef walk(s):\n    node = root\n    for ch in s:\n        if ch not in node:\n            return None\n        node = node[ch]\n    return node","variants":[{"name":"Insert / search / prefix (core)","trigger":"implement trie, starts with","how":"`setdefault` to insert; word needs the `$` marker, prefix doesn't"},{"name":"Wildcard","trigger":"`.` matches any letter","how":"DFS; on `.` try every child except `$`"},{"name":"Shortest prefix","trigger":"replace words, shortest root","how":"store the root at its marker; return on the first marker"},{"name":"Many words in a grid","trigger":"word search II, boggle","how":"DFS along trie edges, pop found words, prune empty nodes"},{"name":"Per-node data","trigger":"autocomplete, count prefixes","how":"keep top-3 lists or pass-through counts at each node"},{"name":"Bit trie","trigger":"maximum XOR pair","how":"insert bits from the top; greedily take the opposite bit"}],"moves":[{"name":"Exact lookups","body":"a `set` is enough"},{"name":"Static prefixes","body":"sorted list + `bisect_left(words, prefix)`"},{"name":"Marker","body":"`\"$\"`: can't collide with a letter"},{"name":"Store the word","body":"`node[\"$\"] = word` saves rebuilding it"},{"name":"Cost","body":"O(L) per operation, independent of word count"}]},"levels":[{"id":"tri-l1","kind":"spot","title":"Spot it","lessons":[{"id":"tri-l1-a","title":"Trie or set?","cards":["tri-sig-teach","tri-spot-exact","tri-spot-prefix","tri-spot-grid","tri-spot-wild","tri-spot-xor","tri-spot-space"]}]},{"id":"tri-l2","kind":"template","title":"Core template","lessons":[{"id":"tri-l2-a","title":"Insert & search","cards":["tri-core-teach","tri-core-order","tri-core-cloze-step","tri-core-cloze-search","tri-core-bug","tri-core-pred","tri-node-teach","tri-node-cloze","tri-core-complex"]}]},{"id":"tri-l3","kind":"variants","title":"Variants","lessons":[{"id":"tri-l3-a","title":"Wildcards & prefixes","cards":["tri-wild-teach","tri-wild-cloze-dot","tri-wild-cloze-end","tri-wild-worst","tri-rep-teach","tri-rep-cloze","tri-rep-pred","tri-count"]}]},{"id":"tri-l4","kind":"moves","title":"Moves","lessons":[{"id":"tri-l4-a","title":"Short trie code","cards":["tri-moves-teach","tri-cmp-suggest","tri-cmp-walk","tri-sd-pred","tri-marker"]}]},{"id":"tri-l5","kind":"problems","title":"Problems","lessons":[{"id":"tri-l5-a","title":"Word Search II","cards":["tri-run-ws-teach","tri-run-ws-why","tri-run-ws-cloze-pop","tri-run-ws-order","tri-run-ws-prune"]},{"id":"tri-l5-b","title":"Search Suggestions","cards":["tri-run-ss-teach","tri-run-ss-cloze","tri-run-ss-sorted","tri-run-ss-miss","tri-run-ss-pred"]}]},{"id":"tri-l6","kind":"legendary","title":"Timed challenge","lessons":[{"id":"tri-l6-a","title":"Timed mix","sample":12,"seconds":40}]}]},{"id":"py","title":"Python Toolkit","subtitle":"Syntax you need without thinking","hue":168,"guide":{"intro":"The standard-library pieces that come up in almost every problem, and the traps that cause silent bugs.","template":"from collections import defaultdict, Counter, deque\nfrom heapq import heappush, heappop, heapify\nfrom bisect import bisect_left, bisect_right\nfrom functools import cache\n\ngraph = defaultdict(list)\ncount = Counter(s)\nq = deque([start])\ngrid = [[0] * cols for _ in range(rows)]","variants":[],"moves":[{"name":"Max-heap","body":"Push `-x` or `(-priority, i, item)`."},{"name":"Multi-key sort","body":"`key=lambda p: (p[0], -p[1])`"},{"name":"Safe 2D grid","body":"`[[0] * cols for _ in range(rows)]`"},{"name":"Copy on save","body":"`res.append(path[:])`"},{"name":"Transpose","body":"`list(zip(*grid))`"},{"name":"Letter index","body":"`ord(ch) - ord('a')`"},{"name":"Truncating division","body":"`int(a / b)`, not `a // b`, for negatives."}]},"levels":[{"id":"py-l1","kind":"template","title":"Maps & counters","lessons":[{"id":"py-l1-a","title":"dict, defaultdict, Counter","cards":["py-dict-teach","py-counter-most","py-dd-insert","py-counter-missing","py-counter-eq","py-anagram-key","py-dict-order","py-dict-zip","py-dd-cloze"]}]},{"id":"py-l2","kind":"variants","title":"Sort, heap, deque","lessons":[{"id":"py-l2-a","title":"Ordering things","cards":["py-sort-teach","py-sort-len","py-sort-tuple","py-sort-none","py-heap-pop","py-maxheap","py-heap-tie","py-deque"]}]},{"id":"py-l3","kind":"moves","title":"Traps","lessons":[{"id":"py-l3-a","title":"Silent bugs","cards":["py-traps-teach","py-grid-alias","py-floordiv","py-path-copy","py-zip-star","py-ord","py-divmod","py-enumerate","py-inf"]}]},{"id":"py-l4","kind":"legendary","title":"Timed challenge","lessons":[{"id":"py-l4-a","title":"Timed mix","sample":10,"seconds":25}]}]}],"cards":{"bs-sig-teach":{"id":"bs-sig-teach","type":"teach","title":"When binary search is on the table","body":"Look for one of these signals:\n- The input is **sorted**, or sorted then rotated.\n- The question asks for the **minimum X that works** or the **maximum X that still works**.\n- Checking one candidate answer is easy, and if X works, every bigger X works too.\n- The constraints demand `O(log n)`, or the answer range is huge, like `1..10^9`.","code":"","tests":"","unit":"bs"},"bs-spot-insert":{"id":"bs-spot-insert","type":"mcq","prompt":"Sorted array `nums` and a `target`. Return the index of `target`, or where it would be inserted to keep `nums` sorted.","code":"","options":["Binary search","Two pointers","Hash map","Sliding window"],"mono":false,"explain":"Sorted input plus *where would it go* is the textbook signal. The answer is the first index with `nums[i] >= target`.","run":"","unit":"bs"},"bs-spot-koko":{"id":"bs-spot-koko","type":"mcq","prompt":"Koko has piles of bananas and `h` hours. Each hour she eats up to `k` bananas from one pile. Find the minimum `k` that lets her finish in time.","code":"","options":["Binary search on the answer","Greedy: sort the piles","Heap of pile sizes","Dynamic programming"],"mono":false,"explain":"*Minimum k that works*, and if `k` works then `k + 1` works too. Search over values of `k`, not over the array. Checking one `k` is a simple O(n) loop.","run":"","unit":"bs"},"bs-spot-window":{"id":"bs-spot-window","type":"mcq","prompt":"Find the length of the longest substring without repeating characters.","code":"","options":["Sliding window","Binary search","Binary search on the answer","Heap"],"mono":false,"explain":"Contiguous + longest valid → sliding window. You *could* binary search the length, but the window solves it in one O(n) pass. Binary search is the wrong first instinct here.","run":"","unit":"bs"},"bs-spot-twosum":{"id":"bs-spot-twosum","type":"mcq","prompt":"Unsorted array. Return the indices of two numbers that add up to `target`.","code":"","options":["Hash map of value → index","Binary search","Sort, then binary search each element","Sliding window"],"mono":false,"explain":"Unsorted, and you need original indices. Sorting loses the indices and costs O(n log n). One pass with a hash map is O(n).","run":"","unit":"bs"},"bs-spot-ship":{"id":"bs-spot-ship","type":"mcq","prompt":"Packages with given weights must ship in order within `days` days. Find the least ship capacity that works.","code":"","options":["Binary search on the answer","Greedy","Prefix sums","Two pointers"],"mono":false,"explain":"Same shape as Koko: the minimum capacity that works, and any bigger capacity also works. Greedy is used *inside* the check, not as the whole solution.","run":"","unit":"bs"},"bs-spot-phrase":{"id":"bs-spot-phrase","type":"mcq","prompt":"Which phrase is the strongest hint for binary search on the answer?","code":"","options":["\"minimize the largest ...\"","\"longest contiguous subarray\"","\"all possible combinations\"","\"shortest path in a grid\""],"mono":false,"explain":"*Minimize the maximum* and *maximize the minimum* almost always mean: guess the answer, check it greedily, binary search the guess.","run":"","unit":"bs"},"bs-spot-rotated":{"id":"bs-spot-rotated","type":"mcq","prompt":"A sorted array was rotated at an unknown index, like `[4,5,6,7,0,1,2]`. Find a target in `O(log n)`.","code":"","options":["Binary search (modified)","Linear scan","Hash set","Two pointers"],"mono":false,"explain":"`O(log n)` in the requirement is a direct tell. Rotation breaks plain sortedness, but enough order is left to discard half each step.","run":"","unit":"bs"},"bs-spot-kth":{"id":"bs-spot-kth","type":"mcq","prompt":"Find the k-th largest element in an unsorted array.","code":"","options":["Heap of size k","Binary search on the index","Two pointers","Prefix sums"],"mono":false,"explain":"Unsorted + t
