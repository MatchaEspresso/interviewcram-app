 left=None, right=None):\n        self.val, self.left, self.right = val, left, right\n\ndef build(vals):\n    if not vals:\n        return None\n    nodes = [None if v is None else TreeNode(v) for v in vals]\n    kids = iter(nodes[1:])\n    for node in nodes:\n        if node:\n            node.left = next(kids, None)\n            node.right = next(kids, None)\n    return nodes[0]","unit":"tr"},"tr-inorder-pred":{"id":"tr-inorder-pred","type":"predict","prompt":"What does the last line evaluate to?","code":"class TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val, self.left, self.right = val, left, right\n\ndef build(vals):\n    if not vals:\n        return None\n    nodes = [None if v is None else TreeNode(v) for v in vals]\n    kids = iter(nodes[1:])\n    for node in nodes:\n        if node:\n            node.left = next(kids, None)\n            node.right = next(kids, None)\n    return nodes[0]\n\nout = []\ndef walk(n):\n    if n:\n        walk(n.left)\n        out.append(n.val)\n        walk(n.right)\nwalk(build([2, 1, 3]))","expr":"out","options":["[1, 2, 3]","[2, 1, 3]","[1, 3, 2]","[3, 2, 1]"],"mono":true,"explain":"Inorder: left, node, right. On a BST that's sorted order. Preorder would give `[2, 1, 3]`.","unit":"tr"},"tr-preorder":{"id":"tr-preorder","type":"mcq","prompt":"Which traversal copies or serializes a tree so it can be rebuilt top-down?","code":"","options":["Preorder (node, left, right)","Inorder","Postorder","Reverse inorder"],"mono":false,"explain":"Preorder writes a node before its children, so when reading back you create the parent first. Postorder suits *children before parent*, like deleting.","run":"","unit":"tr"},"tr-run-mp-teach":{"id":"tr-run-mp-teach","type":"teach","title":"Full run: Binary Tree Maximum Path Sum","body":"A path is any chain of connected nodes (at least one). Return the largest sum. Values can be negative.\n\nSame shape as diameter: return the best **one-sided** gain up; track the best **two-sided** path globally.","code":"","tests":"","setup":"","unit":"tr"},"tr-run-mp-return":{"id":"tr-run-mp-return","type":"mcq","prompt":"What does `gain(node)` return to its parent?","code":"","options":["`node.val` plus the better of its two child gains","`node.val + left + right`","The best path anywhere below","The subtree sum"],"mono":false,"explain":"The parent can only extend a path down **one** side. A path that bends at `node` can't continue upward.","run":"","unit":"tr"},"tr-run-mp-neg":{"id":"tr-run-mp-neg","type":"mcq","prompt":"Why `max(gain(child), 0)`?","code":"","options":["A negative branch should be dropped, not added","To avoid recursion errors","Values are never negative","To count leaves"],"mono":false,"explain":"If a subtree's best gain is negative, the path is better off not going there at all.","run":"","unit":"tr"},"tr-run-mp-order":{"id":"tr-run-mp-order","type":"order","prompt":"Build `max_path_sum`.","lines":["def max_path_sum(root):","    best = float(\"-inf\")","    def gain(node):","        nonlocal best","        if not node:","            return 0","        l = max(gain(node.left), 0)","        r = max(gain(node.right), 0)","        best = max(best, node.val + l + r)","        return node.val + max(l, r)","    gain(root)","    return best"],"distractors":["        return node.val + l + r","    best = 0"],"explain":"Clip each child's gain at 0, update the best bending path, return the best straight path.","tests":"assert max_path_sum(build([1, 2, 3])) == 6\nassert max_path_sum(build([-10, 9, 20, None, None, 15, 7])) == 42\nassert max_path_sum(build([-3])) == -3\nassert max_path_sum(build([2, -1])) == 2\nassert max_path_sum(build([-2, -1])) == -1\nassert max_path_sum(build([5, 4, 8, 11, None, 13, 4, 7, 2, None, None, None, 1])) == 48","setup":"class TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val, self.left, self.right = val, left, right\n\ndef build(vals):\n    if not vals:\n        return None\n    nodes = [None if v is None else TreeNode(v) for v in vals]\n    kids = iter(nodes[1:])\n    for node in nodes:\n        if node:\n            node.left = next(kids, None)\n            node.right = next(kids, None)\n    return nodes[0]","unit":"tr"},"tr-run-mp-init":{"id":"tr-run-mp-init","type":"cloze","prompt":"Starting value of `best`?","code":"def max_path_sum(root):\n    best = ___\n\n    def gain(node):\n        nonlocal best\n        if not node:\n            return 0\n        l = max(gain(node.left), 0)\n        r = max(gain(node.right), 0)\n        best = max(best, node.val + l + r)\n        return node.val + max(l, r)\n\n    gain(root)\n    return best","options":["float(\"-inf\")","0","-1"],"mono":true,"explain":"With all-negative values like `[-3]` the answer is negative. Starting at 0 would wrongly return 0.","tests":"assert max_path_sum(build([1, 2, 3])) == 6\nassert max_path_sum(build([-10, 9, 20, None, None, 15, 7])) == 42\nassert max_path_sum(build([-3])) == -3\nassert max_path_sum(build([2, -1])) == 2\nassert max_path_sum(build([-2, -1])) == -1\nassert max_path_sum(build([5, 4, 8, 11, None, 13, 4, 7, 2, None, None, None, 1])) == 48","setup":"class TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val, self.left, self.right = val, left, right\n\ndef build(vals):\n    if not vals:\n        return None\n    nodes = [None if v is None else TreeNode(v) for v in vals]\n    kids = iter(nodes[1:])\n    for node in nodes:\n        if node:\n            node.left = next(kids, None)\n            node.right = next(kids, None)\n    return nodes[0]","unit":"tr"},"tr-run-mp-pred":{"id":"tr-run-mp-pred","type":"predict","prompt":"What does the last line evaluate to?","code":"class TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val, self.left, self.right = val, left, right\n\ndef build(vals):\n    if not vals:\n        return None\n    nodes = [None if v is None else TreeNode(v) for v in vals]\n    kids = iter(nodes[1:])\n    for node in nodes:\n        if node:\n            node.left = next(kids, None)\n            node.right = next(kids, None)\n    return nodes[0]\n\ndef max_path_sum(root):\n    best = float(\"-inf\")\n\n    def gain(node):\n        nonlocal best\n        if not node:\n            return 0\n        l = max(gain(node.left), 0)\n        r = max(gain(node.right), 0)\n        best = max(best, node.val + l + r)\n        return node.val + max(l, r)\n\n    gain(root)\n    return best","expr":"max_path_sum(build([-10, 9, 20, None, None, 15, 7]))","options":["42","35","34","44"],"mono":true,"explain":"`15 + 20 + 7`. The -10 root and the 9 aren't worth including.","unit":"tr"},"tr-run-lc-teach":{"id":"tr-run-lc-teach","type":"teach","title":"Full run: Lowest Common Ancestor","body":"Given a binary tree (not a BST) and two nodes `p`, `q` that exist in it, return their lowest common ancestor. A node can be its own ancestor.","code":"","tests":"","setup":"","unit":"tr"},"tr-run-lc-brute":{"id":"tr-run-lc-brute","type":"mcq","prompt":"A brute-force approach to mention first?","code":"","options":["Find root-to-node paths for both, return the last common node","Try every node as the answer","Sort the nodes","BFS from `p`"],"mono":false,"explain":"Two DFS paths and a comparison: O(n) time, O(n) space. Then show the one-pass version.","run":"","unit":"tr"},"tr-run-lc-split":{"id":"tr-run-lc-split","type":"mcq","prompt":"In the one-pass version, `left` and `right` are both non-`None`. That means:","code":"","options":["`p` is on one side and `q` on the other: this node is the LCA","Both are on the left","There's a bug","The tree has duplicates"],"mono":false,"explain":"This is the first node, coming up from below, where the two searches meet.","run":"","unit":"tr"},"tr-run-lc-bug":{"id":"tr-run-lc-bug","type":"bug","prompt":"In the tree `[3, 5, 1, 6, 2, 0, 8]`, `lca(t, 5, 1)` returns 5 instead of 3. Tap the bug.","lines":["def lca(root, p, q):","    if not root or root.val == p:","        return root","    left = lca(root.left, p, q)","    right = lca(root.right, p, q)","    if left and right:","        return root","    return left or right"],"line":1,"fix":"if not root or root.val == p or root.val == q:","explain":"The search has to stop at **either** target. Checking only `p` means the right side never reports `q`, so the root can't see the split.","tests":"t = build([3, 5, 1, 6, 2, 0, 8, None, None, 7, 4])\nassert lca(t, 5, 1).val == 3\nassert lca(t, 5, 4).val == 5\nassert lca(t, 7, 4).val == 2\nassert lca(t, 6, 4).val == 5\nassert lca(t, 0, 8).val == 1\nassert lca(build([1, 2]), 1, 2).val == 1","setup":"class TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val, self.left, self.right = val, left, right\n\ndef build(vals):\n    if not vals:\n        return None\n    nodes = [None if v is None else TreeNode(v) for v in vals]\n    kids = iter(nodes[1:])\n    for node in nodes:\n        if node:\n            node.left = next(kids, None)\n            node.right = next(kids, None)\n    return nodes[0]","unit":"tr"},"tr-run-lc-complex":{"id":"tr-run-lc-complex","type":"mcq","prompt":"Complexity of the one-pass version?","code":"","options":["`O(n)` time, `O(h)` space","`O(log n)` time","`O(n²)` time","`O(n)` space always"],"mono":false,"explain":"Each node is visited at most once, and the recursion is as deep as the tree.","run":"","unit":"tr"},"hp-sig-teach":{"id":"hp-sig-teach","type":"teach","title":"When to reach for a heap","body":"A heap gives the **smallest** item in O(1) and removes or adds one in O(log n). Use it when:\n- You need the **k** largest / smallest / closest / most frequent.\n- You repeatedly need the **current** min or max while items keep arriving (streams, schedules).\n- You merge **k sorted** sequences.\n- Shortest paths with **weights** (Dijkstra).\n\nIf you need *everything* in order once, just sort.","code":"","tests":"","setup":"","unit":"hp"},"hp-spot-kth":{"id":"hp-spot-kth","type":"mcq","prompt":"k-th largest element of an unsorted array.","code":"","options":["Min-heap of size `k`","Sort descending, every time","Max-heap of all elements, pop `k` times","Binary search"],"mono":false,"explain":"Keep the `k` largest seen so far; the smallest of them (the heap top) is the answer. O(n log k). Sorting is O(n log n) and fine to mention. Quickselect is O(n) average.","run":"","unit":"hp"},"hp-spot-stream":{"id":"hp-spot-stream","type":"mcq","prompt":"Numbers arrive one at a time. After each, report the median.","code":"","options":["Two heaps: a max-heap for the lower half, a min-heap for the upper half","Sort after each insert","One min-heap","A sliding window"],"mono":false,"explain":"Each half's top is right next to the middle. Inserts are O(log n), medians O(1).","run":"","unit":"hp"},"hp-spot-mergek":{"id":"hp-spot-mergek","type":"mcq","prompt":"Merge `k` sorted linked lists into one sorted list.","code":"","options":["Min-heap holding the current head of each list","Concatenate then sort","Merge them pairwise left to right","Two pointers"],"mono":false,"explain":"The heap always holds at most `k` items: O(N log k). Pairwise in sequence is O(N·k). Pairwise in rounds (divide and conquer) also gets O(N log k).","run":"","unit":"hp"},"hp-spot-sorted-once":{"id":"hp-spot-sorted-once","type":"mcq","prompt":"Return all the elements in sorted order once.","code":"","options":["`sorted()`","A heap, popping all elements","Two heaps","Heap of size k"],"mono":false,"explain":"Popping everything from a heap is also O(n log n), but `sorted` is simpler and faster in practice. Heaps shine when items keep changing.","run":"","unit":"hp"},"hp-spot-rooms":{"id":"hp-spot-rooms","type":"mcq","prompt":"Meetings with start and end times. Minimum number of rooms?","code":"","options":["Sort by start; min-heap of end times","Sort by length","Max-heap of start times","Count overlaps with a set"],"mono":false,"explain":"The heap top is the room that frees up first. If it's free before the next start, reuse it. The heap size at the end is the answer. (A sweep over sorted starts and ends also works.)","run":"","unit":"hp"},"hp-spot-dijkstra":{"id":"hp-spot-dijkstra","type":"mcq","prompt":"Weighted graph, non-negative weights. Shortest time from one node to all others.","code":"","options":["Dijkstra with a min-heap of `(dist, node)`","Plain BFS","DFS","Topological sort"],"mono":false,"explain":"BFS assumes equal weights. The heap always expands the closest unfinished node next.","run":"","unit":"hp"},"hp-spot-api":{"id":"hp-spot-api","type":"mcq","prompt":"Python's `heapq` is a...","code":"","options":["Min-heap stored in a plain list","Max-heap class","Balanced BST","Sorted list"],"mono":false,"explain":"`h[0]` is the smallest item. The rest of the list is *not* sorted. For a max-heap, push negated values.","run":"","unit":"hp"},"hp-api-teach":{"id":"hp-api-teach","type":"teach","title":"heapq in one card","body":"- `heappush(h, x)`, `heappop(h)`: O(log n).\n- `h[0]`: peek at the smallest, O(1).\n- `heapify(h)`: turn a list into a heap in place, **O(n)**.\n- `heapreplace(h, x)`: pop then push, one O(log n) step. `heappushpop(h, x)`: push then pop.\n- `nlargest(k, xs)`, `nsmallest(k, xs, key=...)`: one-liners for top-k.\n- Tuples compare field by field: `(priority, tiebreak, item)`.","code":"h = [5, 1, 4]\nheapify(h)          # h[0] == 1\nheappush(h, 0)\nheappop(h)          # 0\nnlargest(2, [3, 1, 4, 1, 5])   # [5, 4]","tests":"assert h[0] == 1 and sorted(h) == [1, 4, 5]\nassert nlargest(2, [3, 1, 4, 1, 5]) == [5, 4]","setup":"","unit":"hp"},"hp-api-pop":{"id":"hp-api-pop","type":"predict","prompt":"What does the last line evaluate to?","code":"h = []\nfor x in [5, 1, 3]:\n    heappush(h, x)","expr":"[heappop(h) for _ in range(3)]","options":["[1, 3, 5]","[5, 3, 1]","[3, 1, 5]","[1, 5, 3]"],"mono":true,"explain":"Each pop returns the current smallest.","unit":"hp"},"hp-api-max":{"id":"hp-api-max","type":"predict","prompt":"What does the last line evaluate to?","code":"h = [-x for x in [4, 9, 1]]\nheapify(h)","expr":"-heappop(h)","options":["9","-9","1","-1"],"mono":true,"explain":"Store negatives for a max-heap: the smallest negative is the largest original. Negate again on the way out.","unit":"hp"},"hp-api-tuple":{"id":"hp-api-tuple","type":"predict","prompt":"What does the last line evaluate to?","code":"h = [(2, 'a'), (1, 'z'), (1, 'b')]\nheapify(h)","expr":"heappop(h)","options":["(1, 'b')","(1, 'z')","(2, 'a')","'b'"],"mono":true,"explain":"Tuples compare by the first field, then the second on ties.","unit":"hp"},"hp-api-list":{"id":"hp-api-list","type":"predict","prompt":"What does the last line evaluate to?","code":"h = [1, 5, 2]\nheapify(h)","expr":"h[1] <= h[2]","options":["False","True","IndexError","None"],"mono":true,"explain":"A heap only promises each parent ≤ its children. Siblings can be in any order, so don't read anything but `h[0]`.","unit":"hp"},"hp-api-heapify":{"id":"hp-api-heapify","type":"mcq","prompt":"`heapify(list_of_n)` costs:","code":"","options":["`O(n)`","`O(n log n)`","`O(log n)`","`O(1)`"],"mono":false,"explain":"Building bottom-up is linear. Pushing `n` items one by one is O(n log n).","run":"","unit":"hp"},"hp-api-nlargest":{"id":"hp-api-nlargest","type":"mcq","prompt":"Shortest correct way to get the 3 largest values?","code":"","options":["`nlargest(3, nums)`","`sorted(nums)[:3]`","`heapify(nums); nums[:3]`","`max(nums, 3)`"],"mono":true,"explain":"`sorted(nums)[:3]` gives the 3 **smallest**. A heapified list isn't sorted beyond index 0.","run":"nums = [4, 1, 7, 3, 9]\nassert nlargest(3, nums) == [9, 7, 4]\nassert sorted(nums)[:3] == [1, 3, 4]","unit":"hp"},"hp-core-teach":{"id":"hp-core-teach","type":"teach","title":"Core template: heap of size k","body":"To keep the **k largest**, use a **min**-heap:\n- Push each item.\n- If the heap holds more than `k`, pop the smallest.\n\nThe heap top is then the k-th largest. O(n log k) time, O(k) space. For the k *smallest*, flip it: a max-heap (negated keys).","code":"def find_kth_largest(nums, k):\n    h = []\n    for x in nums:\n        heappush(h, x)\n        if len(h) > k:\n            heappop(h)\n    return h[0]","tests":"assert find_kth_largest([3, 2, 1, 5, 6, 4], 2) == 5\nassert find_kth_largest([3, 2, 3, 1, 2, 4, 5, 5, 6], 4) == 4\nassert find_kth_largest([1], 1) == 1\nassert find_kth_largest([7, 7, 7], 2) == 7\nassert find_kth_largest([-1, -5, 2], 3) == -5","setup":"","unit":"hp"},"hp-core-order":{"id":"hp-core-order","type":"order","prompt":"Build `find_kth_largest`.","lines":["def find_kth_largest(nums, k):","    h = []","    for x in nums:","        heappush(h, x)","        if len(h) > k:","            heappop(h)","    return h[0]"],"distractors":["        heappush(h, -x)","    return h[-1]"],"explain":"Push, trim to size `k`, and read the top at the end.","tests":"assert find_kth_largest([3, 2, 1, 5, 6, 4], 2) == 5\nassert find_kth_largest([3, 2, 3, 1, 2, 4, 5, 5, 6], 4) == 4\nassert find_kth_largest([1], 1) == 1\nassert find_kth_largest([7, 7, 7], 2) == 7\nassert find_kth_largest([-1, -5, 2], 3) == -5","setup":"","unit":"hp"},"hp-core-cloze-trim":{"id":"hp-core-cloze-trim","type":"cloze","prompt":"When do you pop?","code":"def find_kth_largest(nums, k):\n    h = []\n    for x in nums:\n        heappush(h, x)\n        if ___:\n            heappop(h)\n    return h[0]","options":["len(h) > k","len(h) >= k","len(h) == 0"],"mono":true,"explain":"Let the heap reach exactly `k` items. Popping at `>= k` keeps only `k - 1`.","tests":"assert find_kth_largest([3, 2, 1, 5, 6, 4], 2) == 5\nassert find_kth_largest([3, 2, 3, 1, 2, 4, 5, 5, 6], 4) == 4\nassert find_kth_largest([1], 1) == 1\nassert find_kth_largest([7, 7, 7], 2) == 7\nassert find_kth_largest([-1, -5, 2], 3) == -5","setup":"","unit":"hp"},"hp-core-cloze-ret":{"id":"hp-core-cloze-ret","type":"cloze","prompt":"Which item is the answer?","code":"def find_kth_largest(nums, k):\n    h = []\n    for x in nums:\n        heappush(h, x)\n        if len(h) > k:\n            heappop(h)\n    return ___","options":["h[0]","h[-1]","max(h)"],"mono":true,"explain":"The heap holds the `k` largest; the smallest of those is the k-th largest. `h[-1]` is just some leaf.","tests":"assert find_kth_largest([3, 2, 1, 5, 6, 4], 2) == 5\nassert find_kth_largest([3, 2, 3, 1, 2, 4, 5, 5, 6], 4) == 4\nassert find_kth_largest([1], 1) == 1\nassert find_kth_largest([7, 7, 7], 2) == 7\nassert find_kth_largest([-1, -5, 2], 3) == -5","setup":"","unit":"hp"},"hp-core-why-min":{"id":"hp-core-why-min","type":"mcq","prompt":"Why a **min**-heap to find the k **largest**?","code":"","options":["The top is the weakest of the current top-k, so it's the one to evict","Python only has min-heaps","It's faster than a max-heap","To sort the output"],"mono":false,"explain":"Each new item only has to beat the smallest of the best `k`. The top is exactly that item.","run":"","unit":"hp"},"hp-key-teach":{"id":"hp-key-teach","type":"teach","title":"Top-k by a key","body":"Push `(key, item)` tuples. For *k closest*, the key is the distance, and you want to evict the **farthest**, so negate the key to make a max-heap on distance.","code":"def k_closest(points, k):\n    h = []\n    for x, y in points:\n        heappush(h, (-(x * x + y * y), x, y))\n        if len(h) > k:\n            heappop(h)\n    return [[x, y] for _, x, y in h]","tests":"assert sorted(k_closest([[1, 3], [-2, 2]], 1)) == [[-2, 2]]\nassert sorted(k_closest([[3, 3], [5, -1], [-2, 4]], 2)) == [[-2, 4], [3, 3]]\nassert sorted(k_closest([[0, 1], [1, 0]], 2)) == [[0, 1], [1, 0]]\nassert sorted(k_closest([[1, 1], [2, 2], [3, 3], [0, 0]], 2)) == [[0, 0], [1, 1]]","setup":"","unit":"hp"},"hp-key-cloze":{"id":"hp-key-cloze","type":"cloze","prompt":"The key for *k closest to the origin*.","code":"def k_closest(points, k):\n    h = []\n    for x, y in points:\n        heappush(h, (___, x, y))\n        if len(h) > k:\n            heappop(h)\n    return [[x, y] for _, x, y in h]","options":["-(x * x + y * y)","x * x + y * y","-(x + y)"],"mono":true,"explain":"Negated squared distance: the top is the **farthest**, which gets evicted. No `sqrt` needed: squaring keeps the order.","tests":"assert sorted(k_closest([[1, 3], [-2, 2]], 1)) == [[-2, 2]]\nassert sorted(k_closest([[3, 3], [5, -1], [-2, 4]], 2)) == [[-2, 4], [3, 3]]\nassert sorted(k_closest([[0, 1], [1, 0]], 2)) == [[0, 1], [1, 0]]\nassert sorted(k_closest([[1, 1], [2, 2], [3, 3], [0, 0]], 2)) == [[0, 0], [1, 1]]","setup":"","unit":"hp"},"hp-cmp-closest":{"id":"hp-cmp-closest","type":"compare","prompt":"Both return the `k` closest points. Which do you write first?","a":"def k_closest(points, k):\n    return nsmallest(k, points, key=lambda p: p[0] * p[0] + p[1] * p[1])","b":"def k_closest(points, k):\n    h = []\n    for x, y in points:\n        heappush(h, (-(x * x + y * y), x, y))\n        if len(h) > k:\n            heappop(h)\n    return [[x, y] for _, x, y in h]","answer":"a","explain":"A is the same O(n log k) algorithm in one line. Interviewers usually accept it; be ready to write B if they ask what `nsmallest` does.","tests":"assert sorted(k_closest([[1, 3], [-2, 2]], 1)) == [[-2, 2]]\nassert sorted(k_closest([[3, 3], [5, -1], [-2, 4]], 2)) == [[-2, 4], [3, 3]]\nassert sorted(k_closest([[0, 1], [1, 0]], 2)) == [[0, 1], [1, 0]]\nassert sorted(k_closest([[1, 1], [2, 2], [3, 3], [0, 0]], 2)) == [[0, 0], [1, 1]]","setup":"","unit":"hp"},"hp-merge-teach":{"id":"hp-merge-teach","type":"teach","title":"Variant: k-way merge","body":"Seed the heap with the **first** item of each list as `(value, list_index, item_index)`. Pop the smallest, then push the **next** item from the same list.\n\nThe heap never holds more than `k` items: O(N log k).","code":"def merge_k(lists):\n    h = [(lst[0], i, 0) for i, lst in enumerate(lists) if lst]\n    heapify(h)\n    res = []\n    while h:\n        val, i, j = heappop(h)\n        res.append(val)\n        if j + 1 < len(lists[i]):\n            heappush(h, (lists[i][j + 1], i, j + 1))\n    return res","tests":"assert merge_k([[1, 4, 5], [1, 3, 4], [2, 6]]) == [1, 1, 2, 3, 4, 4, 5, 6]\nassert merge_k([]) == []\nassert merge_k([[], []]) == []\nassert merge_k([[2], [], [1, 3]]) == [1, 2, 3]\nassert merge_k([[5, 5], [5]]) == [5, 5, 5]","setup":"","unit":"hp"},"hp-merge-cloze":{"id":"hp-merge-cloze","type":"cloze","prompt":"Push the next item from the same list.","code":"def merge_k(lists):\n    h = [(lst[0], i, 0) for i, lst in enumerate(lists) if lst]\n    heapify(h)\n    res = []\n    while h:\n        val, i, j = heappop(h)\n        res.append(val)\n        if j + 1 < len(lists[i]):\n            heappush(h, ___)\n    return res","options":["(lists[i][j + 1], i, j + 1)","(lists[i][j], i, j + 1)","(lists[j + 1][i], i, j + 1)"],"mono":true,"explain":"List `i`, next index `j + 1`, and its value goes first so the heap orders by value.","tests":"assert merge_k([[1, 4, 5], [1, 3, 4], [2, 6]]) == [1, 1, 2, 3, 4, 4, 5, 6]\nassert merge_k([]) == []\nassert merge_k([[], []]) == []\nassert merge_k([[2], [], [1, 3]]) == [1, 2, 3]\nassert merge_k([[5, 5], [5]]) == [5, 5, 5]","setup":"","unit":"hp"},"hp-merge-tie":{"id":"hp-merge-tie","type":"mcq","prompt":"Why is `i` in the tuple, not just `(value, node)` for linked lists?","code":"","options":["On equal values Python compares the next field; `ListNode`s can't be compared","To sort by list order","It's faster","To avoid duplicates"],"mono":false,"explain":"`(1, node_a) < (1, node_b)` raises `TypeError`. A unique index between them settles every tie.","run":"","unit":"hp"},"hp-merge-matrix":{"id":"hp-merge-matrix","type":"mcq","prompt":"*k-th smallest in a matrix whose rows and columns are sorted.* Heap approach?","code":"","options":["Seed with the first column (one item per row), pop k times, push the right neighbour","Flatten and sort","Heap of the whole first row and column","Binary search on rows"],"mono":false,"explain":"It's a k-way merge of the rows, stopped after `k` pops. (Binary search on the value range is the other classic.)","run":"","unit":"hp"},"hp-rooms-teach":{"id":"hp-rooms-teach","type":"teach","title":"Variant: a heap of end times","body":"*Meeting Rooms II*: sort by start. Keep a min-heap of the end times of rooms in use.\n- The earliest-ending room is free (`ends[0] <= start`)? Reuse it: `heapreplace`.\n- Otherwise open a new room: `heappush`.\n\nThe heap size is the number of rooms.","code":"def min_meeting_rooms(intervals):\n    intervals.sort()\n    ends = []\n    for s, e in intervals:\n        if ends and ends[0] <= s:\n            heapreplace(ends, e)\n        else:\n            heappush(ends, e)\n    return len(ends)","tests":"assert min_meeting_rooms([[0, 30], [5, 10], [15, 20]]) == 2\nassert min_meeting_rooms([[7, 10], [2, 4]]) == 1\nassert min_meeting_rooms([]) == 0\nassert min_meeting_rooms([[1, 5], [5, 10]]) == 1\nassert min_meeting_rooms([[1, 10], [2, 3], [3, 4], [4, 11]]) == 2\nassert min_meeting_rooms([[1, 4], [2, 5], [3, 6]]) == 3","setup":"","unit":"hp"},"hp-rooms-cloze":{"id":"hp-rooms-cloze","type":"cloze","prompt":"When can a room be reused?","code":"def min_meeting_rooms(intervals):\n    intervals.sort()\n    ends = []\n    for s, e in intervals:\n        if ends and ends[0] ___ s:\n            heapreplace(ends, e)\n        else:\n            heappush(ends, e)\n    return len(ends)","options":["<=","<",">="],"mono":true,"explain":"A meeting ending at 5 frees the room for one starting at 5. `<` would open an extra room for back-to-back meetings.","tests":"assert min_meeting_rooms([[0, 30], [5, 10], [15, 20]]) == 2\nassert min_meeting_rooms([[7, 10], [2, 4]]) == 1\nassert min_meeting_rooms([]) == 0\nassert min_meeting_rooms([[1, 5], [5, 10]]) == 1\nassert min_meeting_rooms([[1, 10], [2, 3], [3, 4], [4, 11]]) == 2\nassert min_meeting_rooms([[1, 4], [2, 5], [3, 6]]) == 3","setup":"","unit":"hp"},"hp-rooms-pred":{"id":"hp-rooms-pred","type":"predict","prompt":"What does the last line evaluate to?","code":"def min_meeting_rooms(intervals):\n    intervals.sort()\n    ends = []\n    for s, e in intervals:\n        if ends and ends[0] <= s:\n            heapreplace(ends, e)\n        else:\n            heappush(ends, e)\n    return len(ends)","expr":"min_meeting_rooms([[1, 10], [2, 3], [3, 4], [4, 11]])","options":["2","3","4","1"],"mono":true,"explain":"`[1, 10]` holds one room the whole time. The others chain in the second room.","unit":"hp"},"hp-dij-teach":{"id":"hp-dij-teach","type":"teach","title":"Variant: Dijkstra","body":"Shortest paths with non-negative weights:\n- Heap of `(distance, node)`, starting with `(0, source)`.\n- Pop the closest. If it's already finalised, skip it (**lazy deletion**).\n- Otherwise finalise it and push each neighbour with `d + w`.\n\nO(E log E).","code":"def network_delay(times, n, k):\n    graph = defaultdict(list)\n    for u, v, w in times:\n        graph[u].append((v, w))\n    dist = {}\n    h = [(0, k)]\n    while h:\n        d, u = heappop(h)\n        if u in dist:\n            continue\n        dist[u] = d\n        for v, w in graph[u]:\n            if v not in dist:\n                heappush(h, (d + w, v))\n    return max(dist.values()) if len(dist) == n else -1","tests":"assert network_delay([[2, 1, 1], [2, 3, 1], [3, 4, 1]], 4, 2) == 2\nassert network_delay([[1, 2, 1]], 2, 1) == 1\nassert network_delay([[1, 2, 1]], 2, 2) == -1\nassert network_delay([[1, 2, 5], [1, 3, 1], [3, 2, 1]], 3, 1) == 2\nassert network_delay([[1, 2, 1], [2, 3, 2], [1, 3, 4]], 3, 1) == 3","setup":"","unit":"hp"},"hp-dij-order":{"id":"hp-dij-order","type":"order","prompt":"Build the Dijkstra loop.","lines":["def dijkstra(graph, src):","    dist = {}","    h = [(0, src)]","    while h:","        d, u = heappop(h)","        if u in dist:","            continue","        dist[u] = d","        for v, w in graph[u]:","            if v not in dist:","                heappush(h, (d + w, v))","    return dist"],"distractors":["            dist[v] = d + w","        d, u = h.pop()"],"explain":"Pop, skip if already done, record, push neighbours.","tests":"g = {1: [(2, 5), (3, 1)], 2: [], 3: [(2, 1)]}\nassert dijkstra(g, 1) == {1: 0, 3: 1, 2: 2}\ng = {\"a\": [(\"b\", 1)], \"b\": [(\"a\", 1)]}\nassert dijkstra(g, \"a\") == {\"a\": 0, \"b\": 1}","setup":"","unit":"hp"},"hp-dij-bug":{"id":"hp-dij-bug","type":"bug","prompt":"Some distances come out too big. Tap the bug.","lines":["def network_delay(times, n, k):","    graph = defaultdict(list)","    for u, v, w in times:","        graph[u].append((v, w))","    dist = {}","    h = [(0, k)]","    while h:","        d, u = heappop(h)","        dist[u] = d","        for v, w in graph[u]:","            if v not in dist:","                heappush(h, (d + w, v))","    return max(dist.values()) if len(dist) == n else -1"],"line":8,"fix":"dist.setdefault(u, d)","explain":"A node can be pushed several times with different distances. The first pop is the smallest; later pops must not overwrite it. `setdefault` keeps the first (or use `if u in dist: continue`).","tests":"assert network_delay([[2, 1, 1], [2, 3, 1], [3, 4, 1]], 4, 2) == 2\nassert network_delay([[1, 2, 1]], 2, 1) == 1\nassert network_delay([[1, 2, 1]], 2, 2) == -1\nassert network_delay([[1, 2, 5], [1, 3, 1], [3, 2, 1]], 3, 1) == 2\nassert network_delay([[1, 2, 1], [2, 3, 2], [1, 3, 4]], 3, 1) == 3","setup":"","unit":"hp"},"hp-dij-neg":{"id":"hp-dij-neg","type":"mcq","prompt":"Why does Dijkstra fail with negative edge weights?","code":"","options":["A finalised node could later get a shorter path through a negative edge","Heaps can't hold negatives","It loops forever","It's only slower"],"mono":false,"explain":"Finalising on first pop assumes no future path can be shorter. Negative edges break that; use Bellman–Ford.","run":"","unit":"hp"},"hp-dij-unweighted":{"id":"hp-dij-unweighted","type":"mcq","prompt":"All weights are 1. What's simpler than Dijkstra?","code":"","options":["Plain BFS","DFS","Union-Find","Topological sort"],"mono":false,"explain":"With equal weights, BFS's level order already visits nodes by distance. O(V + E), no heap.","run":"","unit":"hp"},"hp-dij-state":{"id":"hp-dij-state","type":"mcq","prompt":"*Cheapest flight with at most `k` stops.* What goes in the heap?","code":"","options":["`(cost, node, stops)`, and visited is tracked per `(node, stops)`","`(cost, node)` only","`(stops, node)` only","Only the destination"],"mono":false,"explain":"A cheaper path with more stops may be useless, so the same node can matter with different stop counts. (Bellman–Ford with `k + 1` rounds is the other classic.)","run":"","unit":"hp"},"hp-moves-teach":{"id":"hp-moves-teach","type":"teach","title":"Moves that keep heap code short","body":"- **Negate** for a max-heap: `heappush(h, -x)`, read `-h[0]`.\n- **Tuple tiebreak**: `(priority, i, item)` with a unique `i`.\n- **`heapreplace` / `heappushpop`** to do pop+push in one step.\n- **Lazy deletion**: leave stale items in, skip them when popped.\n- **`nlargest` / `nsmallest`** when the whole job is top-k.\n- **`Counter.most_common(k)`** for top-k frequent.","code":"","tests":"","setup":"","unit":"hp"},"hp-cmp-kth":{"id":"hp-cmp-kth","type":"compare","prompt":"Both return the k-th largest. Which shows heap skill with less code?","a":"def find_kth_largest(nums, k):\n    h = nums[:k]\n    heapify(h)\n    for x in nums[k:]:\n        if x > h[0]:\n            heapreplace(h, x)\n    return h[0]","b":"def find_kth_largest(nums, k):\n    h = []\n    for x in nums:\n        heappush(h, x)\n        if len(h) > k:\n            heappop(h)\n    return h[0]","answer":"a","explain":"A heapifies the first `k` in O(k), then only touches the heap when `x` beats the current k-th largest. Both are O(n log k), but A skips useless push/pop pairs.","tests":"assert find_kth_largest([3, 2, 1, 5, 6, 4], 2) == 5\nassert find_kth_largest([3, 2, 3, 1, 2, 4, 5, 5, 6], 4) == 4\nassert find_kth_largest([1], 1) == 1\nassert find_kth_largest([7, 7, 7], 2) == 7\nassert find_kth_largest([-1, -5, 2], 3) == -5","setup":"","unit":"hp"},"hp-replace-pred":{"id":"hp-replace-pred","type":"predict","prompt":"What does the last line evaluate to?","code":"h = [2, 5, 7]","expr":"(heapreplace(h, 0), h[0])","options":["(2, 0)","(0, 0)","(0, 2)","(2, 2)"],"mono":true,"explain":"`heapreplace` pops first (returning 2), then pushes 0. `heappushpop` pushes first, so it would return 0 right back.","unit":"hp"},"hp-pushpop-pred":{"id":"hp-pushpop-pred","type":"predict","prompt":"What does the last line evaluate to?","code":"h = [2, 5, 7]","expr":"heappushpop(h, 0)","options":["0","2","5","None"],"mono":true,"explain":"Push 0, then pop the smallest: 0 comes straight back and the heap is unchanged.","unit":"hp"},"hp-lazy":{"id":"hp-lazy","type":"mcq","prompt":"You need to remove an arbitrary item from a heap. Clean approach?","code":"","options":["Mark it as deleted and skip it when it reaches the top","`h.remove(x)` then nothing","Rebuild the heap every time","Sort the list"],"mono":false,"explain":"`h.remove(x)` breaks the heap property unless you `heapify` again (O(n)). Lazy deletion keeps operations O(log n).","run":"","unit":"hp"},"hp-topfreq":{"id":"hp-topfreq","type":"mcq","prompt":"Top-k frequent words, ties broken alphabetically. One-liner?","code":"","options":["`sorted(c, key=lambda w: (-c[w], w))[:k]` with `c = Counter(words)`","`c.most_common(k)`","`nlargest(k, c)`","`sorted(c)[:k]`"],"mono":true,"explain":"`most_common` breaks ties by first appearance, not alphabetically. A key of `(-count, word)` gets both orders right.","run":"words = [\"i\", \"love\", \"leetcode\", \"i\", \"love\", \"coding\"]\nc = Counter(words)\nassert sorted(c, key=lambda w: (-c[w], w))[:2] == [\"i\", \"love\"]\nwords = [\"b\", \"a\", \"b\", \"a\"]\nc = Counter(words)\nassert sorted(c, key=lambda w: (-c[w], w))[:1] == [\"a\"]\nassert [w for w, _ in c.most_common(1)] == [\"b\"]","unit":"hp"},"hp-run-md-teach":{"id":"hp-run-md-teach","type":"teach","title":"Full run: Find Median from Data Stream","body":"`add_num(x)` and `find_median()`, called many times.\n\n- `lo`: max-heap (negated) of the smaller half.\n- `hi`: min-heap of the larger half.\n- Keep `len(lo) == len(hi)` or `len(lo) == len(hi) + 1`.\n\nThen the median is `-lo[0]`, or the average of both tops.","code":"","tests":"","setup":"","unit":"hp"},"hp-run-md-why":{"id":"hp-run-md-why","type":"mcq","prompt":"Why two heaps rather than one sorted list?","code":"","options":["Insertion is O(log n) instead of O(n)","Sorted lists can't find medians","It uses less memory","To support deletion"],"mono":false,"explain":"`insort` finds the position in O(log n) but shifting is O(n). Heaps keep both halves' boundary items on top.","run":"","unit":"hp"},"hp-run-md-order":{"id":"hp-run-md-order","type":"order","prompt":"Build `add_num`.","lines":["def add_num(self, x):","    heappush(self.lo, -x)","    heappush(self.hi, -heappop(self.lo))","    if len(self.hi) > len(self.lo):","        heappush(self.lo, -heappop(self.hi))"],"distractors":["    heappush(self.hi, x)"],"explain":"Push into `lo`, move `lo`'s largest to `hi` (that keeps every `lo` ≤ every `hi`), then rebalance sizes if `hi` got bigger.","tests":"class M:\n    def __init__(self):\n        self.lo, self.hi = [], []\nM.add_num = add_num\nm = M()\nfor x in [5, 15, 1, 3]:\n    m.add_num(x)\nassert sorted(-v for v in m.lo) == [1, 3] and sorted(m.hi) == [5, 15]\nm.add_num(8)\nassert -m.lo[0] == 5 and len(m.lo) == 3","setup":"","unit":"hp"},"hp-run-md-cloze":{"id":"hp-run-md-cloze","type":"cloze","prompt":"Median when the halves are equal.","code":"class MedianFinder:\n    def __init__(self):\n        self.lo = []\n        self.hi = []\n\n    def add_num(self, x):\n        heappush(self.lo, -x)\n        heappush(self.hi, -heappop(self.lo))\n        if len(self.hi) > len(self.lo):\n            heappush(self.lo, -heappop(self.hi))\n\n    def find_median(self):\n        if len(self.lo) > len(self.hi):\n            return -self.lo[0]\n        return ___","options":["(-self.lo[0] + self.hi[0]) / 2","(self.lo[0] + self.hi[0]) / 2","-self.lo[0]"],"mono":true,"explain":"`lo` stores negatives, so un-negate its top. Then average the two middle values.","tests":"m = MedianFinder()\nm.add_num(1); m.add_num(2)\nassert m.find_median() == 1.5\nm.add_num(3)\nassert m.find_median() == 2\nm = MedianFinder()\nfor x, want in [(5, 5), (15, 10), (1, 5), (3, 4), (8, 5), (7, 6)]:\n    m.add_num(x)\n    assert m.find_median() == want, (x, m.find_median())\nm = MedianFinder()\nfor x, want in [(-1, -1), (-2, -1.5), (-3, -2), (-4, -2.5), (-5, -3)]:\n    m.add_num(x)\n    assert m.find_median() == want","setup":"","unit":"hp"},"hp-run-md-bug":{"id":"hp-run-md-bug","type":"bug","prompt":"Medians come out wrong. Tap the bug.","lines":["class MedianFinder:","    def __init__(self):","        self.lo = []","        self.hi = []","","    def add_num(self, x):","        heappush(self.lo, -x)","        heappush(self.hi, heappop(self.lo))","        if len(self.hi) > len(self.lo):","            heappush(self.lo, -heappop(self.hi))","","    def find_median(self):","        if len(self.lo) > len(self.hi):","            return -self.lo[0]","        return (-self.lo[0] + self.hi[0]) / 2"],"line":7,"fix":"heappush(self.hi, -heappop(self.lo))","explain":"`lo` stores negated values. Moving its top to `hi` must negate it back, or `hi` fills up with negative numbers that sort before everything.","tests":"m = MedianFinder()\nm.add_num(1); m.add_num(2)\nassert m.find_median() == 1.5\nm.add_num(3)\nassert m.find_median() == 2\nm = MedianFinder()\nfor x, want in [(5, 5), (15, 10), (1, 5), (3, 4), (8, 5), (7, 6)]:\n    m.add_num(x)\n    assert m.find_median() == want, (x, m.find_median())\nm = MedianFinder()\nfor x, want in [(-1, -1), (-2, -1.5), (-3, -2), (-4, -2.5), (-5, -3)]:\n    m.add_num(x)\n    assert m.find_median() == want","setup":"","unit":"hp"},"hp-run-md-follow":{"id":"hp-run-md-follow","type":"mcq","prompt":"Follow-up: all numbers are in `0..100`. Better structure?","code":"","options":["A count array of size 101; walk it to find the middle","Still two heaps","A sorted list","A trie"],"mono":false,"explain":"Inserts are O(1) and a median is O(101). Interviewers like hearing that constraints can change the data structure.","run":"","unit":"hp"},"hp-run-ro-teach":{"id":"hp-run-ro-teach","type":"teach","title":"Full run: Reorganize String","body":"Rearrange `s` so no two adjacent characters are equal, or return `\"\"`.\n\nGreedy: always place the most frequent remaining character, except the one you just placed. Hold that one back for a turn.","code":"","tests":"","setup":"","unit":"hp"},"hp-run-ro-impossible":{"id":"hp-run-ro-impossible","type":"mcq","prompt":"When is it impossible?","code":"","options":["The most common letter appears more than `(n + 1) // 2` times","Any letter appears twice","`n` is even","There are more than 26 letters"],"mono":false,"explain":"It needs a gap after every copy except possibly the last. `aaab`: 3 > 2, impossible.","run":"","unit":"hp"},"hp-run-ro-order":{"id":"hp-run-ro-order","type":"order","prompt":"Build `reorganize`.","lines":["def reorganize(s):","    h = [(-c, ch) for ch, c in Counter(s).items()]","    heapify(h)","    res, prev = [], (0, \"\")","    while h:","        c, ch = heappop(h)","        res.append(ch)","        if prev[0] < 0:","            heappush(h, prev)","        prev = (c + 1, ch)","    return \"\".join(res) if len(res) == len(s) else \"\""],"distractors":["        heappush(h, (c + 1, ch))"],"explain":"Max-heap of `(-count, ch)`. Pop the top, place it, push back the one held from last round, and hold this one with one fewer count.","tests":"def valid(s, out):\n    return Counter(s) == Counter(out) and all(a != b for a, b in zip(out, out[1:]))\nassert valid(\"aab\", reorganize(\"aab\"))\nassert reorganize(\"aaab\") == \"\"\nassert valid(\"aaabbc\", reorganize(\"aaabbc\"))\nassert valid(\"vvvlo\", reorganize(\"vvvlo\"))\nassert reorganize(\"a\") == \"a\"\nassert reorganize(\"aa\") == \"\"","setup":"","unit":"hp"},"hp-run-ro-cloze":{"id":"hp-run-ro-cloze","type":"cloze","prompt":"When does the held character go back in?","code":"def reorganize(s):\n    h = [(-c, ch) for ch, c in Counter(s).items()]\n    heapify(h)\n    res, prev = [], (0, \"\")\n    while h:\n        c, ch = heappop(h)\n        res.append(ch)\n        if ___:\n            heappush(h, prev)\n        prev = (c + 1, ch)\n    return \"\".join(res) if len(res) == len(s) else \"\"","options":["prev[0] < 0","prev[0] > 0","prev[1]"],"mono":true,"explain":"Counts are negative. `prev[0] < 0` means it still has copies left. At 0 it's used up and is dropped.","tests":"def valid(s, out):\n    return Counter(s) == Counter(out) and all(a != b for a, b in zip(out, out[1:]))\nassert valid(\"aab\", reorganize(\"aab\"))\nassert reorganize(\"aaab\") == \"\"\nassert valid(\"aaabbc\", reorganize(\"aaabbc\"))\nassert valid(\"vvvlo\", reorganize(\"vvvlo\"))\nassert reorganize(\"a\") == \"a\"\nassert reorganize(\"aa\") == \"\"","setup":"","unit":"hp"},"hp-run-ro-complex":{"id":"hp-run-ro-complex","type":"mcq","prompt":"Time complexity with alphabet size `A`?","code":"","options":["`O(n log A)`","`O(n log n)`","`O(n²)`","`O(A²)`"],"mono":false,"explain":"The heap holds at most `A` (26) entries, so each of the `n` steps is O(log A), effectively O(n).","run":"","unit":"hp"},"iv-sig-teach":{"id":"iv-sig-teach","type":"teach","title":"Interval problems: sort first","body":"Almost every interval problem starts with a sort:\n- **By start** to merge or to scan in time order.\n- **By end** for greedy *keep as many as possible* / *fewest points to hit all*.\n\nTwo closed intervals `[a, b]` and `[c, d]` overlap exactly when `a <= d and c <= b`.","code":"","tests":"","setup":"","unit":"iv"},"iv-overlap-pred":{"id":"iv-overlap-pred","type":"predict","prompt":"What does the last line evaluate to?","code":"def overlap(x, y):\n    return x[0] <= y[1] and y[0] <= x[1]\npairs = [([1, 5], [2, 3]), ([1, 5], [5, 8]), ([1, 2], [3, 4])]","expr":"[overlap(*p) for p in pairs]","options":["[True, True, False]","[True, False, False]","[False, True, False]","[True, True, True]"],"mono":true,"explain":"`[1,5]`/`[5,8]` touch at 5, which counts for closed intervals. `[1,2]`/`[3,4]` don't meet.","unit":"iv"},"iv-spot-merge":{"id":"iv-spot-merge","type":"mcq","prompt":"Combine all overlapping intervals into one list.","code":"","options":["Sort by start, then extend the last merged interval or append","Sort by end, greedy","Heap of ends","Union-Find on all pairs"],"mono":false,"explain":"After sorting by start, an interval can only overlap the **last** one you added. One pass, O(n log n).","run":"","unit":"iv"},"iv-spot-erase":{"id":"iv-spot-erase","type":"mcq","prompt":"Remove the fewest intervals so the rest don't overlap.","code":"","options":["Sort by **end**, keep each interval that starts after the last kept end","Sort by start, merge","Sort by length, drop the longest","Heap of starts"],"mono":false,"explain":"Keeping the interval that ends first leaves the most room for the rest. This is the classic activity-selection greedy.","run":"","unit":"iv"},"iv-spot-rooms":{"id":"iv-spot-rooms","type":"mcq","prompt":"Minimum number of meeting rooms.","code":"","options":["Sweep line over start/end events (or a heap of end times)","Merge intervals and count","Sort by end, greedy keep","Binary search"],"mono":false,"explain":"The answer is the maximum number of meetings happening at once. Count +1 at each start and −1 at each end.","run":"","unit":"iv"},"iv-spot-attend":{"id":"iv-spot-attend","type":"mcq","prompt":"Can one person attend all meetings?","code":"","options":["Sort by start, check each meeting starts after the previous ends","Merge and compare counts","Sweep line","Heap"],"mono":false,"explain":"Any overlap between neighbours after sorting means no. O(n log n).","run":"","unit":"iv"},"iv-spot-two-lists":{"id":"iv-spot-two-lists","type":"mcq","prompt":"Two lists of disjoint, sorted intervals. Return their intersection.","code":"","options":["Two pointers, advance the one that ends first","Merge then subtract","Nested loops","Sort the combined list"],"mono":false,"explain":"Both lists are already sorted. Each step either records an overlap or skips an interval that can't overlap anything else.","run":"","unit":"iv"},"iv-spot-calendar":{"id":"iv-spot-calendar","type":"mcq","prompt":"*Book events one at a time; reject one that overlaps an existing booking.*","code":"","options":["Keep starts in a sorted list; check the neighbours with `bisect`","Re-sort and merge every time","A heap of ends","A set of all minutes"],"mono":false,"explain":"Only the booking just before and just after the new start can collide. Insertion is O(n) in a list but simple; a balanced tree gives O(log n).","run":"","unit":"iv"},"iv-core-teach":{"id":"iv-core-teach","type":"teach","title":"Core template: sort by start, merge into the last","body":"After sorting by start:\n- If the current interval starts **at or before** the last merged end, extend that end.\n- Otherwise it starts a new group: append it.\n\nExtend with `max`, because a long earlier interval can swallow a later one.","code":"def merge(intervals):\n    intervals.sort()\n    res = []\n    for s, e in intervals:\n        if res and s <= res[-1][1]:\n            res[-1][1] = max(res[-1][1], e)\n        else:\n            res.append([s, e])\n    return res","tests":"assert merge([[1, 3], [2, 6], [8, 10], [15, 18]]) == [[1, 6], [8, 10], [15, 18]]\nassert merge([[1, 4], [4, 5]]) == [[1, 5]]\nassert merge([[1, 4], [2, 3]]) == [[1, 4]]\nassert merge([[4, 7], [1, 4]]) == [[1, 7]]\nassert merge([[1, 2]]) == [[1, 2]]\nassert merge([[2, 3], [5, 6], [1, 10]]) == [[1, 10]]","setup":"","unit":"iv"},"iv-core-order":{"id":"iv-core-order","type":"order","prompt":"Build `merge`.","lines":["def merge(intervals):","    intervals.sort()","    res = []","    for s, e in intervals:","        if res and s <= res[-1][1]:","            res[-1][1] = max(res[-1][1], e)","        else:","            res.append([s, e])","    return res"],"distractors":["            res[-1][1] = e","    intervals.sort(key=lambda iv: iv[1])"],"explain":"Sort, then each interval either extends the last merged one or is appended.","tests":"assert merge([[1, 3], [2, 6], [8, 10], [15, 18]]) == [[1, 6], [8, 10], [15, 18]]\nassert merge([[1, 4], [4, 5]]) == [[1, 5]]\nassert merge([[1, 4], [2, 3]]) == [[1, 4]]\nassert merge([[4, 7], [1, 4]]) == [[1, 7]]\nassert merge([[1, 2]]) == [[1, 2]]\nassert merge([[2, 3], [5, 6], [1, 10]]) == [[1, 10]]","setup":"","unit":"iv"},"iv-core-cloze-cmp":{"id":"iv-core-cloze-cmp","type":"cloze","prompt":"When does the current interval join the last one?","code":"def merge(intervals):\n    intervals.sort()\n    res = []\n    for s, e in intervals:\n        if res and s ___ res[-1][1]:\n            res[-1][1] = max(res[-1][1], e)\n        else:\n            res.append([s, e])\n    return res","options":["<=","<",">"],"mono":true,"explain":"`[1, 4]` and `[4, 5]` touch, so they merge. `<` would keep them apart.","tests":"assert merge([[1, 3], [2, 6], [8, 10], [15, 18]]) == [[1, 6], [8, 10], [15, 18]]\nassert merge([[1, 4], [4, 5]]) == [[1, 5]]\nassert merge([[1, 4], [2, 3]]) == [[1, 4]]\nassert merge([[4, 7], [1, 4]]) == [[1, 7]]\nassert merge([[1, 2]]) == [[1, 2]]\nassert merge([[2, 3], [5, 6], [1, 10]]) == [[1, 10]]","setup":"","unit":"iv"},"iv-core-cloze-max":{"id":"iv-core-cloze-max","type":"cloze","prompt":"New end of the merged interval.","code":"def merge(intervals):\n    intervals.sort()\n    res = []\n    for s, e in intervals:\n        if res and s <= res[-1][1]:\n            res[-1][1] = ___\n        else:\n            res.append([s, e])\n    return res","options":["max(res[-1][1], e)","e","res[-1][1] + e"],"mono":true,"explain":"`[1, 4]` then `[2, 3]`: the end stays 4. Plain `e` would shrink it to 3.","tests":"assert merge([[1, 3], [2, 6], [8, 10], [15, 18]]) == [[1, 6], [8, 10], [15, 18]]\nassert merge([[1, 4], [4, 5]]) == [[1, 5]]\nassert merge([[1, 4], [2, 3]]) == [[1, 4]]\nassert merge([[4, 7], [1, 4]]) == [[1, 7]]\nassert merge([[1, 2]]) == [[1, 2]]\nassert merge([[2, 3], [5, 6], [1, 10]]) == [[1, 10]]","setup":"","unit":"iv"},"iv-core-bug":{"id":"iv-core-bug","type":"bug","prompt":"`merge([[4, 7], [1, 4]])` returns two intervals. Tap the bug.","lines":["def merge(intervals):","    res = []","    for s, e in intervals:","        if res and s <= res[-1][1]:","            res[-1][1] = max(res[-1][1], e)","        else:","            res.append([s, e])","    return res"],"line":1,"fix":"intervals.sort(); res = []","explain":"Without sorting, an interval can overlap one that's not the last in `res`. Sort by start first; everything else depends on it.","tests":"assert merge([[1, 3], [2, 6], [8, 10], [15, 18]]) == [[1, 6], [8, 10], [15, 18]]\nassert merge([[1, 4], [4, 5]]) == [[1, 5]]\nassert merge([[1, 4], [2, 3]]) == [[1, 4]]\nassert merge([[4, 7], [1, 4]]) == [[1, 7]]\nassert merge([[1, 2]]) == [[1, 2]]\nassert merge([[2, 3], [5, 6], [1, 10]]) == [[1, 10]]","setup":"","unit":"iv"},"iv-core-pred":{"id":"iv-core-pred","type":"predict","prompt":"What does the last line evaluate to?","code":"def merge(intervals):\n    intervals.sort()\n    res = []\n    for s, e in intervals:\n        if res and s <= res[-1][1]:\n            res[-1][1] = max(res[-1][1], e)\n        else:\n            res.append([s, e])\n    return res","expr":"merge([[2, 3], [5, 6], [1, 10]])","options":["[[1, 10]]","[[1, 3], [5, 10]]","[[2, 3], [5, 6], [1, 10]]","[[1, 6]]"],"mono":true,"explain":"Sorted: `[1,10]` first, which swallows both of the others.","unit":"iv"},"iv-core-copy":{"id":"iv-core-copy","type":"mcq","prompt":"`res.append([s, e])`: why a new list instead of appending the input interval?","code":"","options":["Otherwise extending `res[-1][1]` would modify the caller's input","Lists can't be appended","It's faster","No reason"],"mono":false,"explain":"Appending the original list object and then mutating it changes the input too. Usually harmless, but a nice detail to mention.","run":"","unit":"iv"},"iv-ins-teach":{"id":"iv-ins-teach","type":"teach","title":"Insert into a sorted, disjoint list","body":"Split the existing intervals into three groups:\n- **left**: end before the new one starts.\n- **right**: start after the new one ends.\n- everything in between overlaps: fold it into the new interval.\n\nO(n), no sort needed.","code":"def insert(intervals, new):\n    s, e = new\n    left = [iv for iv in intervals if iv[1] < s]\n    right = [iv for iv in intervals if iv[0] > e]\n    if len(left) + len(right) < len(intervals):\n        s = min(s, intervals[len(left)][0])\n        e = max(e, intervals[-len(right) - 1][1])\n    return left + [[s, e]] + right","tests":"assert insert([[1, 3], [6, 9]], [2, 5]) == [[1, 5], [6, 9]]\nassert insert([[1, 2], [3, 5], [6, 7], [8, 10], [12, 16]], [4, 8]) == [[1, 2], [3, 10], [12, 16]]\nassert insert([], [5, 7]) == [[5, 7]]\nassert insert([[1, 5]], [6, 8]) == [[1, 5], [6, 8]]\nassert insert([[3, 5]], [1, 2]) == [[1, 2], [3, 5]]\nassert insert([[1, 5]], [2, 3]) == [[1, 5]]\nassert insert([[1, 5]], [0, 0]) == [[0, 0], [1, 5]]\nassert insert([[1, 5]], [5, 7]) == [[1, 7]]","setup":"","unit":"iv"},"iv-ins-cloze-left":{"id":"iv-ins-cloze-left","type":"cloze","prompt":"Which intervals stay untouched on the left?","code":"def insert(intervals, new):\n    s, e = new\n    left = [iv for iv in intervals if ___]\n    right = [iv for iv in intervals if iv[0] > e]\n    if len(left) + len(right) < len(intervals):\n        s = min(s, intervals[len(left)][0])\n        e = max(e, intervals[-len(right) - 1][1])\n    return left + [[s, e]] + right","options":["iv[1] < s","iv[1] <= s","iv[0] < s"],"mono":true,"explain":"Strictly before: an interval ending exactly at `s` touches it and must merge.","tests":"assert insert([[1, 3], [6, 9]], [2, 5]) == [[1, 5], [6, 9]]\nassert insert([[1, 2], [3, 5], [6, 7], [8, 10], [12, 16]], [4, 8]) == [[1, 2], [3, 10], [12, 16]]\nassert insert([], [5, 7]) == [[5, 7]]\nassert insert([[1, 5]], [6, 8]) == [[1, 5], [6, 8]]\nassert insert([[3, 5]], [1, 2]) == [[1, 2], [3, 5]]\nassert insert([[1, 5]], [2, 3]) == [[1, 5]]\nassert insert([[1, 5]], [0, 0]) == [[0, 0], [1, 5]]\nassert insert([[1, 5]], [5, 7]) == [[1, 7]]","setup":"","unit":"iv"},"iv-ins-cloze-end":{"id":"iv-ins-cloze-end","type":"cloze","prompt":"The new end after folding.","code":"def insert(intervals, new):\n    s, e = new\n    left = [iv for iv in intervals if iv[1] < s]\n    right = [iv for iv in intervals if iv[0] > e]\n    if len(left) + len(right) < len(intervals):\n        s = min(s, intervals[len(left)][0])\n        e = max(e, ___)\n    return left + [[s, e]] + right","options":["intervals[-len(right) - 1][1]","intervals[len(left)][1]","intervals[-1][1]"],"mono":true,"explain":"The last overlapping interval sits just before the right group: index `-len(right) - 1`. `-0 - 1` is `-1` when `right` is empty, which also works.","tests":"assert insert([[1, 3], [6, 9]], [2, 5]) == [[1, 5], [6, 9]]\nassert insert([[1, 2], [3, 5], [6, 7], [8, 10], [12, 16]], [4, 8]) == [[1, 2], [3, 10], [12, 16]]\nassert insert([], [5, 7]) == [[5, 7]]\nassert insert([[1, 5]], [6, 8]) == [[1, 5], [6, 8]]\nassert insert([[3, 5]], [1, 2]) == [[1, 2], [3, 5]]\nassert insert([[1, 5]], [2, 3]) == [[1, 5]]\nassert insert([[1, 5]], [0, 0]) == [[0, 0], [1, 5]]\nassert insert([[1, 5]], [5, 7]) == [[1, 7]]","setup":"","unit":"iv"},"iv-ins-alt":{"id":"iv-ins-alt","type":"mcq","prompt":"Simplest correct approach if you blank on the slicing?","code":"","options":["Append the new interval and call `merge`","Binary search twice","Rebuild from scratch with a heap","There is none"],"mono":false,"explain":"O(n log n) instead of O(n), but correct and quick to write. Say so, then optimise.","run":"","unit":"iv"},"iv-ins-order":{"id":"iv-ins-order","type":"order","prompt":"Build `can_attend`: no two meetings overlap.","lines":["def can_attend(intervals):","    intervals.sort()","    for a, b in zip(intervals, intervals[1:]):","        if b[0] < a[1]:","            return False","    return True"],"distractors":["        if b[0] <= a[1]:"],"explain":"Sort, then compare each meeting with the next. Touching (`b[0] == a[1]`) is fine.","tests":"assert can_attend([[0, 30], [5, 10], [15, 20]]) is False\nassert can_attend([[7, 10], [2, 4]]) is True\nassert can_attend([[1, 5], [5, 6]]) is True\nassert can_attend([]) is True","setup":"","unit":"iv"},"iv-greedy-teach":{"id":"iv-greedy-teach","type":"teach","title":"Variant: sort by end, keep greedily","body":"*Keep the most non-overlapping intervals*: sort by **end**, and keep an interval whenever it starts at or after the last kept end.\n\nThe interval that ends first is always safe to keep: anything that conflicts with it would end later and block more.","code":"def erase_overlap(intervals):\n    intervals.sort(key=lambda iv: iv[1])\n    end = float(\"-inf\")\n    kept = 0\n    for s, e in intervals:\n        if s >= end:\n            kept += 1\n            end = e\n    return len(intervals) - kept","tests":"assert erase_overlap([[1, 2], [2, 3], [3, 4], [1, 3]]) == 1\nassert erase_overlap([[1, 2], [1, 2], [1, 2]]) == 2\nassert erase_overlap([[1, 2], [2, 3]]) == 0\nassert erase_overlap([[1, 100], [11, 22], [1, 11], [2, 12]]) == 2\nassert erase_overlap([[0, 2], [1, 3], [2, 4], [3, 5], [4, 6]]) == 2\nassert erase_overlap([[0, 5], [4, 6], [5, 10]]) == 1","setup":"","unit":"iv"},"iv-greedy-cloze-key":{"id":"iv-greedy-cloze-key","type":"cloze","prompt":"Sort key.","code":"def erase_overlap(intervals):\n    intervals.sort(key=lambda iv: ___)\n    end = float(\"-inf\")\n    kept = 0\n    for s, e in intervals:\n        if s >= end:\n            kept += 1\n            end = e\n    return len(intervals) - kept","options":["iv[1]","iv[0]","iv[1] - iv[0]"],"mono":true,"explain":"By end. Sorting by start keeps `[1, 100]` first and throws away everything inside it.","tests":"assert erase_overlap([[1, 2], [2, 3], [3, 4], [1, 3]]) == 1\nassert erase_overlap([[1, 2], [1, 2], [1, 2]]) == 2\nassert erase_overlap([[1, 2], [2, 3]]) == 0\nassert erase_overlap([[1, 100], [11, 22], [1, 11], [2, 12]]) == 2\nassert erase_overlap([[0, 2], [1, 3], [2, 4], [3, 5], [4, 6]]) == 2\nassert erase_overlap([[0, 5], [4, 6], [5, 10]]) == 1","setup":"","unit":"iv"},"iv-greedy-cloze-ok":{"id":"iv-greedy-cloze-ok","type":"cloze","prompt":"When can the interval be kept?","code":"def erase_overlap(intervals):\n    intervals.sort(key=lambda iv: iv[1])\n    end = float(\"-inf\")\n    kept = 0\n    for s, e in intervals:\n        if s ___ end:\n            kept += 1\n            end = e\n    return len(intervals) - kept","options":[">=",">"],"mono":true,"explain":"Here touching intervals (`[1,2]`, `[2,3]`) don't overlap, so `>=`.","tests":"assert erase_overlap([[1, 2], [2, 3], [3, 4], [1, 3]]) == 1\nassert erase_overlap([[1, 2], [1, 2], [1, 2]]) == 2\nassert erase_overlap([[1, 2], [2, 3]]) == 0\nassert erase_overlap([[1, 100], [11, 22], [1, 11], [2, 12]]) == 2\nassert erase_overlap([[0, 2], [1, 3], [2, 4], [3, 5], [4, 6]]) == 2\nassert erase_overlap([[0, 5], [4, 6], [5, 10]]) == 1","setup":"","unit":"iv"},"iv-arrow-teach":{"id":"iv-arrow-teach","type":"teach","title":"Same greedy, different touching rule","body":"*Minimum arrows to burst balloons*: balloons that **touch** share a point, so one arrow at the shared end bursts both. Sort by end, shoot at the end of the first balloon not yet burst.","code":"def find_min_arrows(points):\n    points.sort(key=lambda p: p[1])\n    arrows, end = 0, float(\"-inf\")\n    for s, e in points:\n        if s > end:\n            arrows += 1\n            end = e\n    return arrows","tests":"assert find_min_arrows([[10, 16], [2, 8], [1, 6], [7, 12]]) == 2\nassert find_min_arrows([[1, 2], [3, 4], [5, 6], [7, 8]]) == 4\nassert find_min_arrows([[1, 2], [2, 3], [3, 4], [4, 5]]) == 2\nassert find_min_arrows([[1, 10]]) == 1\nassert find_min_arrows([[1, 10], [2, 3], [4, 5]]) == 2","setup":"","unit":"iv"},"iv-arrow-cloze":{"id":"iv-arrow-cloze","type":"cloze","prompt":"When do you need a new arrow?","code":"def find_min_arrows(points):\n    points.sort(key=lambda p: p[1])\n    arrows, end = 0, float(\"-inf\")\n    for s, e in points:\n        if s ___ end:\n            arrows += 1\n            end = e\n    return arrows","options":[">",">="],"mono":true,"explain":"`[1,2]` and `[2,3]` share 2: one arrow. A new arrow only when the balloon starts strictly after the last shot.","tests":"assert find_min_arrows([[10, 16], [2, 8], [1, 6], [7, 12]]) == 2\nassert find_min_arrows([[1, 2], [3, 4], [5, 6], [7, 8]]) == 4\nassert find_min_arrows([[1, 2], [2, 3], [3, 4], [4, 5]]) == 2\nassert find_min_arrows([[1, 10]]) == 1\nassert find_min_arrows([[1, 10], [2, 3], [4, 5]]) == 2","setup":"","unit":"iv"},"iv-greedy-same":{"id":"iv-greedy-same","type":"mcq","prompt":"*Erase overlap* returns removals; *min arrows* returns groups. How do they relate?","code":"","options":["Both count a maximal set of non-overlapping intervals (with different touching rules)","They're unrelated","Arrows = removals + 1","Arrows sorts by start"],"mono":false,"explain":"Erase: `n - kept`. Arrows: `kept`, where *touching* counts as overlapping.","run":"","unit":"iv"},"iv-sweep-teach":{"id":"iv-sweep-teach","type":"teach","title":"Variant: sweep line","body":"Turn each interval into two events: `(start, +1)` and `(end, -1)`. Sort and walk them, keeping a running count. The max count is the peak overlap.\n\nSorting tuples puts `(5, -1)` before `(5, 1)`: a meeting that ends at 5 frees its room before one starting at 5 takes it.","code":"def min_rooms(intervals):\n    events = []\n    for s, e in intervals:\n        events.append((s, 1))\n        events.append((e, -1))\n    rooms = best = 0\n    for _, d in sorted(events):\n        rooms += d\n        best = max(best, rooms)\n    return best","tests":"assert min_rooms([[0, 30], [5, 10], [15, 20]]) == 2\nassert min_rooms([[7, 10], [2, 4]]) == 1\nassert min_rooms([[1, 5], [5, 10]]) == 1\nassert min_rooms([[1, 4], [2, 5], [3, 6]]) == 3\nassert min_rooms([]) == 0","setup":"","unit":"iv"},"iv-sweep-cloze":{"id":"iv-sweep-cloze","type":"cloze","prompt":"Event for the end of a meeting.","code":"def min_rooms(intervals):\n    events = []\n    for s, e in intervals:\n        events.append((s, 1))\n        events.append(___)\n    rooms = best = 0\n    for _, d in sorted(events):\n        rooms += d\n        best = max(best, rooms)\n    return best","options":["(e, -1)","(e, 1)","(e - 1, -1)"],"mono":true,"explain":"End events subtract a room. With equal times, `-1` sorts first, which handles back-to-back meetings.","tests":"assert min_rooms([[0, 30], [5, 10], [15, 20]]) == 2\nassert min_rooms([[7, 10], [2, 4]]) == 1\nassert min_rooms([[1, 5], [5, 10]]) == 1\nassert min_rooms([[1, 4], [2, 5], [3, 6]]) == 3\nassert min_rooms([]) == 0","setup":"","unit":"iv"},"iv-sweep-pred":{"id":"iv-sweep-pred","type":"predict","prompt":"What does the last line evaluate to?","code":"","expr":"sorted([(5, 1), (2, 1), (5, -1)])","options":["[(2, 1), (5, -1), (5, 1)]","[(2, 1), (5, 1), (5, -1)]","[(5, -1), (2, 1), (5, 1)]","[(5, 1), (5, -1), (2, 1)]"],"mono":true,"explain":"Tuples compare by time, then by the delta. -1 < 1, so ends come before starts at the same time.","unit":"iv"},"iv-sweep-diff":{"id":"iv-sweep-diff","type":"mcq","prompt":"Values are small integers (like days up to 1000). An even simpler sweep?","code":"","options":["A difference array: `+1` at start, `-1` after end, then prefix-sum it","A heap","Merge intervals","Binary search"],"mono":false,"explain":"No sorting at all: O(n + range). This is the *car pooling* / *corporate flight bookings* trick.","run":"","unit":"iv"},"iv-two-teach":{"id":"iv-two-teach","type":"teach","title":"Variant: two sorted lists","body":"Intersection of two sorted, disjoint lists: the overlap of `a[i]` and `b[j]` is `[max(starts), min(ends)]` if that's non-empty.\n\nThen drop the one that **ends first**: it can't overlap anything further in the other list.","code":"def interval_intersection(a, b):\n    i = j = 0\n    res = []\n    while i < len(a) and j < len(b):\n        lo = max(a[i][0], b[j][0])\n        hi = min(a[i][1], b[j][1])\n        if lo <= hi:\n            res.append([lo, hi])\n        if a[i][1] < b[j][1]:\n            i += 1\n        else:\n            j += 1\n    return res","tests":"a = [[0, 2], [5, 10], [13, 23], [24, 25]]\nb = [[1, 5], [8, 12], [15, 24], [25, 26]]\nassert interval_intersection(a, b) == [[1, 2], [5, 5], [8, 10], [15, 23], [24, 24], [25, 25]]\nassert interval_intersection([[1, 3], [5, 9]], []) == []\nassert interval_intersection([[1, 7]], [[3, 10]]) == [[3, 7]]\nassert interval_intersection([[3, 10]], [[1, 2], [4, 5], [8, 12]]) == [[4, 5], [8, 10]]","setup":"","unit":"iv"},"iv-two-cloze":{"id":"iv-two-cloze","type":"cloze","prompt":"Which pointer advances?","code":"def interval_intersection(a, b):\n    i = j = 0\n    res = []\n    while i < len(a) and j < len(b):\n        lo = max(a[i][0], b[j][0])\n        hi = min(a[i][1], b[j][1])\n        if lo <= hi:\n            res.append([lo, hi])\n        if ___:\n            i += 1\n        else:\n            j += 1\n    return res","options":["a[i][1] < b[j][1]","a[i][0] < b[j][0]","a[i][1] > b[j][1]"],"mono":true,"explain":"The interval that ends first is finished. The other might still overlap the next one.","tests":"a = [[0, 2], [5, 10], [13, 23], [24, 25]]\nb = [[1, 5], [8, 12], [15, 24], [25, 26]]\nassert interval_intersection(a, b) == [[1, 2], [5, 5], [8, 10], [15, 23], [24, 24], [25, 25]]\nassert interval_intersection([[1, 3], [5, 9]], []) == []\nassert interval_intersection([[1, 7]], [[3, 10]]) == [[3, 7]]\nassert interval_intersection([[3, 10]], [[1, 2], [4, 5], [8, 12]]) == [[4, 5], [8, 10]]","setup":"","unit":"iv"},"iv-two-bug":{"id":"iv-two-bug","type":"bug","prompt":"Misses overlaps of a single point like `[5, 5]`. Tap the bug.","lines":["def interval_intersection(a, b):","    i = j = 0","    res = []","    while i < len(a) and j < len(b):","        lo = max(a[i][0], b[j][0])","        hi = min(a[i][1], b[j][1])","        if lo < hi:","            res.append([lo, hi])","        if a[i][1] < b[j][1]:","            i += 1","        else:","            j += 1","    return res"],"line":6,"fix":"if lo <= hi:","explain":"Closed intervals sharing one point overlap in `[5, 5]`. `lo == hi` is a valid intersection.","tests":"a = [[0, 2], [5, 10], [13, 23], [24, 25]]\nb = [[1, 5], [8, 12], [15, 24], [25, 26]]\nassert interval_intersection(a, b) == [[1, 2], [5, 5], [8, 10], [15, 23], [24, 24], [25, 25]]\nassert interval_intersection([[1, 3], [5, 9]], []) == []\nassert interval_intersection([[1, 7]], [[3, 10]]) == [[3, 7]]\nassert interval_intersection([[3, 10]], [[1, 2], [4, 5], [8, 12]]) == [[4, 5], [8, 10]]","setup":"","unit":"iv"},"iv-moves-teach":{"id":"iv-moves-teach","type":"teach","title":"Moves for clean interval code","body":"- **Unpack**: `for s, e in intervals` reads better than `iv[0]`, `iv[1]`.\n- **Compare with the last**: `res[-1][1]` after sorting by start.\n- **Know the touching rule** before coding: are `[1,2]` and `[2,3]` overlapping?\n- **Sort by end** for greedy selection, **by start** for merging.\n- **Events** for counting overlaps.","code":"","tests":"","setup":"","unit":"iv"},"iv-cmp-merge":{"id":"iv-cmp-merge","type":"compare","prompt":"Both merge intervals. Which is cleaner?","a":"def merge(intervals):\n    intervals.sort()\n    res = []\n    i = 0\n    while i < len(intervals):\n        s, e = intervals[i]\n        j = i + 1\n        while j < len(intervals) and intervals[j][0] <= e:\n            e = max(e, intervals[j][1])\n            j += 1\n        res.append([s, e])\n        i = j\n    return res","b":"def merge(intervals):\n    intervals.sort()\n    res = []\n    for s, e in intervals:\n        if res and s <= res[-1][1]:\n            res[-1][1] = max(res[-1][1], e)\n        else:\n            res.append([s, e])\n    return res","answer":"b","explain":"Same complexity. B has one loop and one comparison with `res[-1]`. A manages two indices by hand.","tests":"assert merge([[1, 3], [2, 6], [8, 10], [15, 18]]) == [[1, 6], [8, 10], [15, 18]]\nassert merge([[1, 4], [4, 5]]) == [[1, 5]]\nassert merge([[1, 4], [2, 3]]) == [[1, 4]]\nassert merge([[4, 7], [1, 4]]) == [[1, 7]]\nassert merge([[1, 2]]) == [[1, 2]]\nassert merge([[2, 3], [5, 6], [1, 10]]) == [[1, 10]]","setup":"","unit":"iv"},"iv-cmp-rooms":{"id":"iv-cmp-rooms","type":"compare","prompt":"Both count meeting rooms. Which is easier to explain?","a":"def min_rooms(intervals):\n    events = []\n    for s, e in intervals:\n        events.append((s, 1))\n        events.append((e, -1))\n    rooms = best = 0\n    for _, d in sorted(events):\n        rooms += d\n        best = max(best, rooms)\n    return best","b":"def min_rooms(intervals):\n    starts = sorted(s for s, _ in intervals)\n    ends = sorted(e for _, e in intervals)\n    rooms = best = j = 0\n    for s in starts:\n        while j < len(ends) and ends[j] <= s:\n            rooms -= 1\n            j += 1\n        rooms += 1\n        best = max(best, rooms)\n    return best","answer":"a","explain":"A says *+1 at a start, −1 at an end, track the peak*, with ties handled by tuple order. B is the same idea with two pointers to get right.","tests":"assert min_rooms([[0, 30], [5, 10], [15, 20]]) == 2\nassert min_rooms([[7, 10], [2, 4]]) == 1\nassert min_rooms([[1, 5], [5, 10]]) == 1\nassert min_rooms([[1, 4], [2, 5], [3, 6]]) == 3\nassert min_rooms([]) == 0","setup":"","unit":"iv"},"iv-sortkey-pred":{"id":"iv-sortkey-pred","type":"predict","prompt":"What does the last line evaluate to?","code":"iv = [[2, 3], [0, 3], [1, 2]]","expr":"sorted(iv, key=lambda x: (x[1], x[0]))","options":["[[1, 2], [0, 3], [2, 3]]","[[0, 3], [1, 2], [2, 3]]","[[1, 2], [2, 3], [0, 3]]","[[2, 3], [0, 3], [1, 2]]"],"mono":true,"explain":"By end first, then by start on ties.","unit":"iv"},"iv-inplace":{"id":"iv-inplace","type":"mcq","prompt":"`intervals.sort()` sorts the caller's list. When does that matter?","code":"","options":["If the caller still needs the original order; use `sorted(intervals)` then","Never","Always: in-place sort is a bug","Only for empty lists"],"mono":false,"explain":"Mention it. `sorted()` costs O(n) extra memory.","run":"","unit":"iv"},"iv-free-time":{"id":"iv-free-time","type":"mcq","prompt":"*Employee free time*: all employees' busy intervals. Find gaps when everyone is free.","code":"","options":["Flatten, merge, and return the gaps between merged intervals","Intersect each pair of employees","Sweep for the maximum overlap","Heap of starts only"],"mono":false,"explain":"Everyone is free exactly where nobody is busy: the gaps in the union. (A heap merge of the sorted lists avoids the full sort.)","run":"","unit":"iv"},"iv-run-in-teach":{"id":"iv-run-in-teach","type":"teach","title":"Full run: Insert Interval","body":"`intervals` is sorted by start and has no overlaps. Insert `new` and merge if needed. Return the result.\n\nWalk through: one-pass loop version, with three phases.","code":"","tests":"","setup":"","unit":"iv"},"iv-run-in-phases":{"id":"iv-run-in-phases","type":"mcq","prompt":"The three phases of a single loop:","code":"","options":["Copy intervals ending before `new`; merge those overlapping it; copy the rest","Sort, merge, dedupe","Binary search, insert, merge all","Copy all, then remove overlaps"],"mono":false,"explain":"Because the input is sorted and disjoint, the overlapping ones form one contiguous block.","run":"","unit":"iv"},"iv-run-in-order":{"id":"iv-run-in-order","type":"order","prompt":"Build the one-pass version.","lines":["def insert(intervals, new):","    res, i, n = [], 0, len(intervals)","    s, e = new","    while i < n and intervals[i][1] < s:","        res.append(intervals[i])","        i += 1","    while i < n and intervals[i][0] <= e:","        s, e, i = min(s, intervals[i][0]), max(e, intervals[i][1]), i + 1","    res.append([s, e])","    return res + intervals[i:]"],"distractors":["    while i < n and intervals[i][0] < s:"],"explain":"Phase 1 copies, phase 2 absorbs overlaps into `[s, e]`, then add it and the untouched tail.","tests":"assert insert([[1, 3], [6, 9]], [2, 5]) == [[1, 5], [6, 9]]\nassert insert([[1, 2], [3, 5], [6, 7], [8, 10], [12, 16]], [4, 8]) == [[1, 2], [3, 10], [12, 16]]\nassert insert([], [5, 7]) == [[5, 7]]\nassert insert([[1, 5]], [6, 8]) == [[1, 5], [6, 8]]\nassert insert([[3, 5]], [1, 2]) == [[1, 2], [3, 5]]\nassert insert([[1, 5]], [2, 3]) == [[1, 5]]\nassert insert([[1, 5]], [0, 0]) == [[0, 0], [1, 5]]\nassert insert([[1, 5]], [5, 7]) == [[1, 7]]","setup":"","unit":"iv"},"iv-run-in-pred":{"id":"iv-run-in-pred","type":"predict","prompt":"What does the last line evaluate to?","code":"def insert(intervals, new):\n    s, e = new\n    left = [iv for iv in intervals if iv[1] < s]\n    right = [iv for iv in intervals if iv[0] > e]\n    if len(left) + len(right) < len(intervals):\n        s = min(s, intervals[len(left)][0])\n        e = max(e, intervals[-len(right) - 1][1])\n    return left + [[s, e]] + right","expr":"insert([[1, 2], [3, 5], [6, 7], [8, 10], [12, 16]], [4, 8])","options":["[[1, 2], [3, 10], [12, 16]]","[[1, 2], [3, 8], [12, 16]]","[[1, 2], [4, 10], [12, 16]]","[[1, 10], [12, 16]]"],"mono":true,"explain":"`[3,5]`, `[6,7]`, `[8,10]` all overlap `[4,8]`. Their union with it is `[3,10]`.","unit":"iv"},"iv-run-in-complex":{"id":"iv-run-in-complex","type":"mcq","prompt":"Complexity of the one-pass version?","code":"","options":["`O(n)` time","`O(n log n)`","`O(log n)`","`O(n²)`"],"mono":false,"explain":"Each interval is looked at once. Binary search could find the boundaries in O(log n), but building the output is O(n) anyway.","run":"","unit":"iv"},"iv-run-ar-teach":{"id":"iv-run-ar-teach","type":"teach","title":"Full run: Minimum Arrows to Burst Balloons","body":"Each balloon spans `[start, end]` on the x-axis. An arrow shot at `x` bursts every balloon with `start <= x <= end`. Find the minimum number of arrows.","code":"","tests":"","setup":"","unit":"iv"},"iv-run-ar-where":{"id":"iv-run-ar-where","type":"mcq","prompt":"Where should the first arrow go?","code":"","options":["At the smallest **end** among all balloons","At the smallest start","In the middle of the widest balloon","At 0"],"mono":false,"explain":"The balloon that ends first must be hit somewhere in its range. Its end is the point that also hits the most others.","run":"","unit":"iv"},"iv-run-ar-order":{"id":"iv-run-ar-order","type":"order","prompt":"Build `find_min_arrows`.","lines":["def find_min_arrows(points):","    points.sort(key=lambda p: p[1])","    arrows, end = 0, float(\"-inf\")","    for s, e in points:","        if s > end:","            arrows += 1","            end = e","    return arrows"],"distractors":["        if s >= end:","    points.sort()"],"explain":"Sort by end. Shoot a new arrow at a balloon's end whenever it starts after the last shot.","tests":"assert find_min_arrows([[10, 16], [2, 8], [1, 6], [7, 12]]) == 2\nassert find_min_arrows([[1, 2], [3, 4], [5, 6], [7, 8]]) == 4\nassert find_min_arrows([[1, 2], [2, 3], [3, 4], [4, 5]]) == 2\nassert find_min_arrows([[1, 10]]) == 1\nassert find_min_arrows([[1, 10], [2, 3], [4, 5]]) == 2","setup":"","unit":"iv"},"iv-run-ar-bug":{"id":"iv-run-ar-bug","type":"bug","prompt":"`[[1, 10], [2, 3], [4, 5]]` needs 2 arrows, but this returns 1. Tap the bug.","lines":["def find_min_arrows(points):","    points.sort(key=lambda p: p[0])","    arrows, end = 0, float(\"-inf\")","    for s, e in points:","        if s > end:","            arrows += 1","            end = e","    return arrows"],"line":1,"fix":"points.sort(key=lambda p: p[1])","explain":"Sorted by start, the first arrow goes at 10 and *seems* to cover `[2,3]` and `[4,5]`, but they don't share a point. Sort by end.","tests":"assert find_min_arrows([[10, 16], [2, 8], [1, 6], [7, 12]]) == 2\nassert find_min_arrows([[1, 2], [3, 4], [5, 6], [7, 8]]) == 4\nassert find_min_arrows([[1, 2], [2, 3], [3, 4], [4, 5]]) == 2\nassert find_min_arrows([[1, 10]]) == 1\nassert find_min_arrows([[1, 10], [2, 3], [4, 5]]) == 2","setup":"","unit":"iv"},"iv-run-ar-overflow":{"id":"iv-run-ar-overflow","type":"mcq","prompt":"Why `float('-inf')` for the first `end` instead of `0` or `-1`?","code":"","options":["Coordinates can be negative, even huge negatives","It's faster","`0` causes a crash","To count the first balloon twice"],"mono":false,"explain":"Any real start is greater than `-inf`, so the first balloon always gets an arrow.","run":"","unit":"iv"},"ps-sig-teach":{"id":"ps-sig-teach","type":"teach","title":"When prefix sums help","body":"`pre[i]` = sum of the first `i` elements. Then any subarray sum is one subtraction:\n\n`sum(nums[i..j]) = pre[j + 1] - pre[i]`\n\nReach for it when you see:\n- **Many range-sum queries** on an array that doesn't change.\n- **Count / longest subarray with sum k**, especially with **negatives** (a sliding window can't handle those).\n- *Left side vs right side* comparisons (pivot index, product except self).\n- **Range updates** applied all at once (difference array).","code":"","tests":"","setup":"","unit":"ps"},"ps-spot-queries":{"id":"ps-spot-queries","type":"mcq","prompt":"An array is fixed, and you get 10⁴ queries `sum(i, j)`.","code":"","options":["Build prefix sums once; each query is O(1)","Sum the slice for each query","A heap","Binary search"],"mono":false,"explain":"Slicing is O(n) per query. One O(n) build turns every query into a subtraction.","run":"","unit":"ps"},"ps-spot-neg":{"id":"ps-spot-neg","type":"mcq","prompt":"Count subarrays with sum exactly `k`; values can be negative.","code":"","options":["Prefix sums + a hash map of counts","Sliding window","Two pointers","Sort and binary search"],"mono":false,"explain":"Negatives break the window's *grow makes it bigger* rule. A map of earlier prefix sums finds every start in O(1).","run":"","unit":"ps"},"ps-spot-pos":{"id":"ps-spot-pos","type":"mcq","prompt":"Shortest subarray with sum ≥ `k`; all values are **positive**.","code":"","options":["Sliding window","Prefix sums + hash map","Heap","Dynamic programming"],"mono":false,"explain":"With only positives, a window works in O(n) with O(1) memory. Prefix sums aren't wrong, but the window is simpler here.","run":"","unit":"ps"},"ps-spot-updates":{"id":"ps-spot-updates","type":"mcq","prompt":"Apply 10⁵ updates *add `v` to every element in `[l, r]`*, then print the array.","code":"","options":["Difference array: `+v` at `l`, `-v` at `r + 1`, then one prefix-sum pass","Loop over each range","Segment tree","Sort the updates"],"mono":false,"explain":"Each update becomes O(1). The final prefix sum turns the markers into real values: O(n + q).","run":"","unit":"ps"},"ps-spot-pivot":{"id":"ps-spot-pivot","type":"mcq","prompt":"Find an index where the sum to the left equals the sum to the right.","code":"","options":["Running left sum vs `total - left - x`","Two pointers from both ends","Binary search","Hash map of sums"],"mono":false,"explain":"With the total known, the right sum is `total - left - nums[i]`. One pass, O(1) memory.","run":"","unit":"ps"},"ps-spot-updates-mixed":{"id":"ps-spot-updates-mixed","type":"mcq","prompt":"Range-sum queries **and** point updates, interleaved.","code":"","options":["Fenwick tree / segment tree","Plain prefix sums","Difference array","Sliding window"],"mono":false,"explain":"A point update invalidates O(n) prefix entries. A Fenwick tree does both operations in O(log n). Worth naming, rarely required to code.","run":"","unit":"ps"},"ps-spot-2d":{"id":"ps-spot-2d","type":"mcq","prompt":"Many queries for the sum of a rectangle in a fixed matrix.","code":"","options":["2D prefix sums with inclusion–exclusion","Prefix sums per row only","BFS","Sort each row"],"mono":false,"explain":"Per-row prefixes give O(rows) per query. A 2D table gives O(1).","run":"","unit":"ps"},"ps-core-teach":{"id":"ps-core-teach","type":"teach","title":"Core template: a padded prefix array","body":"Start with `[0]` so `pre[i]` is the sum of the first `i` elements:\n- `pre` has length `n + 1`.\n- `sum(nums[i..j])` (inclusive) is `pre[j + 1] - pre[i]`.\n- No special case for `i == 0`.","code":"class NumArray:\n    def __init__(self, nums):\n        self.pre = [0]\n        for x in nums:\n            self.pre.append(self.pre[-1] + x)\n\n    def sum_range(self, i, j):\n        return self.pre[j + 1] - self.pre[i]","tests":"a = NumArray([-2, 0, 3, -5, 2, -1])\nassert a.sum_range(0, 2) == 1\nassert a.sum_range(2, 5) == -1\nassert a.sum_range(0, 5) == -3\nassert a.sum_range(3, 3) == -5\nassert NumArray([7]).sum_range(0, 0) == 7","setup":"","unit":"ps"},"ps-core-order":{"id":"ps-core-order","type":"order","prompt":"Build `NumArray`.","lines":["class NumArray:","    def __init__(self, nums):","        self.pre = [0]","        for x in nums:","            self.pre.append(self.pre[-1] + x)","    def sum_range(self, i, j):","        return self.pre[j + 1] - self.pre[i]"],"distractors":["        return self.pre[j] - self.pre[i]","        self.pre = []"],"explain":"Pad with 0, append running sums, subtract to answer.","tests":"a = NumArray([-2, 0, 3, -5, 2, -1])\nassert a.sum_range(0, 2) == 1\nassert a.sum_range(2, 5) == -1\nassert a.sum_range(0, 5) == -3\nassert a.sum_range(3, 3) == -5\nassert NumArray([7]).sum_range(0, 0) == 7","setup":"","unit":"ps"},"ps-core-cloze-query":{"id":"ps-core-cloze-query","type":"cloze","prompt":"Sum of `nums[i..j]`, inclusive.","code":"class NumArray:\n    def __init__(self, nums):\n        self.pre = [0]\n        for x in nums:\n            self.pre.append(self.pre[-1] + x)\n\n    def sum_range(self, i, j):\n        return ___","options":["self.pre[j + 1] - self.pre[i]","self.pre[j] - self.pre[i]","self.pre
